name: lumo_lernen
description: Lumo Lernen - Lern-App mit integrierten Spielen fuer die 1. bis 4. Klasse Volksschule in Oesterreich
publish_to: none
version: 0.12.12+1919

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flame: ^1.18.0
  shared_preferences: ^2.3.3
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/images/
    - assets/lumo_design/fox/
    - assets/lumo_design/bg/
    - assets/lumo_design/learning_world/
    - assets/lumo_design/logo/
    - assets/lumo_design/cards/
    - assets/lumo_design/gameplay/
    - assets/lumo_design/icons/
    - assets/lumo_design/badges/
    - assets/lumo_design/onboarding/
    - assets/lumo_design/spielwelt/
    - assets/lumo_design/memory/
    - assets/lumo_design/cards_game/
    - assets/lumo_jump/fox/master/
    - assets/lumo_jump/fox/sprite_sheets/
    - assets/lumo_jump/fox/idle/
    - assets/lumo_jump/fox/run/
    - assets/lumo_jump/fox/jump/
    - assets/lumo_jump/fox/fall/
    - assets/lumo_jump/fox/duck/
    - assets/lumo_jump/fox/roll/
    - assets/lumo_sprite_pack/
    - assets/lumo_sprite_pack/cheer/
    - assets/lumo_cards/
    - assets/lumo_cards/cards/red/
    - assets/lumo_cards/cards/yellow/
    - assets/lumo_cards/cards/green/
    - assets/lumo_cards/cards/blue/
    - assets/lumo_cards/cards/special/
    - assets/lumo_cards/cards/back/
    - assets/lumo_cards/avatars/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/audio/voice/lumo/
    - assets/companion/
    - assets/lottie/
    - assets/learning_questions/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
