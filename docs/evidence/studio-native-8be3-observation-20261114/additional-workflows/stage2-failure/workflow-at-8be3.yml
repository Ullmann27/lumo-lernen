name: Verify Lumo Kart Stage 2

on:
  pull_request:
    paths:
      - .github/workflows/kart-stage2-regression.yml
      - assets/shaders/kart_*.gdshader
      - assets/characters/lumo_animated/**
      - assets/kart/menu/**
      - scripts/app/mobile_runtime.gd
      - scripts/app/app_boot.gd
      - scripts/app/scene_router.gd
      - scripts/characters/lumo/**
      - scripts/games/kart_*.gd
      - scripts/games/visual/**
      - scripts/games/authoring/**
      - scenes/games/track_authoring/**
      - tools/validate_track_packs.py
      - scripts/tests/kart_*.gd
      - scripts/tests/lumo_*animation*.gd
      - scripts/tests/lumo_kart_production_regression.gd
      - scripts/tests/lumo_gesture_contact_regression.gd
      - tools/lumo_animation/**
      - docs/track_expansion/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kart-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Authoring sources stay outside runtime import
        run: test -f docs/design/1939-harbor/.gdignore

      - name: Static project validator
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_project.py

      - name: Validate structured track developer packs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_track_packs.py

      - name: Import project and parse GDScript/shaders
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --editor --import --quit \
            > "$RUNNER_TEMP/godot-import.log" 2>&1
          cat "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|Shader compilation failed|ERROR: Failed to load' "$RUNNER_TEMP/godot-import.log"; then
            echo "Rejected Godot error output in $RUNNER_TEMP/godot-import.log"
            exit 1
          fi

      - name: Start lights reuse resources and respect motion preferences
        run: |
          python3 tools/run_godot_probe.py --log "$RUNNER_TEMP/start-lights.log" --timeout 30 --required '[StartLights] PASS' -- Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script scripts/tests/kart_start_lights_regression.gd
          python3 tools/run_godot_probe.py --log "$RUNNER_TEMP/quality-persistence.log" --timeout 30 --required '[KartQualityPersist] PASS' -- Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script scripts/tests/kart_quality_persistence_regression.gd
          python3 tools/run_godot_probe.py --log "$RUNNER_TEMP/quality-scene-switch.log" --timeout 45 --required '[KartQualitySceneSwitch] PASS' -- Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script scripts/tests/kart_quality_scene_switch_regression.gd

      - name: Verify actual harbor prefab placement and mobile LODs
        run: |
          python3 tools/run_godot_probe.py --log "$RUNNER_TEMP/harbor-pavilion.log" --timeout 120 --required '[HarborPavilion] PASS' -- Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script scripts/tests/kart_harbor_pavilion_regression.gd

      - name: Animated Lumo in the actual Kart player factory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exports/lumo-kart-production
          export XDG_DATA_HOME="$RUNNER_TEMP/lumo-kart-production-user"
          python3 tools/run_godot_probe.py \
            --log exports/lumo-kart-production/gesture-contact.log \
            --timeout 90 --required '[LumoGestureContact] PASS' -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --audio-driver Dummy \
            --path . --script res://scripts/tests/lumo_gesture_contact_regression.gd \
            -- exports/lumo-kart-production/gesture-contact
          python3 tools/run_godot_probe.py \
            --log exports/lumo-kart-production/production.log \
            --timeout 120 --required '[LumoKartProduction] PASS' -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --audio-driver Dummy \
            --path . --script res://scripts/tests/lumo_kart_production_regression.gd \
            -- exports/lumo-kart-production
          python3 tools/run_godot_probe.py \
            --log exports/lumo-kart-production/export.log \
            --timeout 240 --required savepack -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --audio-driver Dummy \
            --path . --export-pack Linux "$RUNNER_TEMP/lumo-kart-production.pck"
          mkdir -p "$RUNNER_TEMP/lumo-kart-packed-runtime"
          cp scripts/tests/lumo_kart_production_regression.gd \
            "$RUNNER_TEMP/lumo-kart-packed-runtime/production_probe.gd"
          export XDG_DATA_HOME="$RUNNER_TEMP/lumo-kart-packed-user"
          python3 tools/run_godot_probe.py \
            --log exports/lumo-kart-production/packed-runtime.log \
            --timeout 120 --required '[LumoKartProduction] PASS' -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --audio-driver Dummy \
            --path "$RUNNER_TEMP/lumo-kart-packed-runtime" \
            --main-pack "$RUNNER_TEMP/lumo-kart-production.pck" \
            --script "$RUNNER_TEMP/lumo-kart-packed-runtime/production_probe.gd" \
            -- exports/lumo-kart-production/packed

      - name: Track geometry contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --script res://scripts/tests/kart_track_contract.gd \
            > "$RUNNER_TEMP/track-contract.log" 2>&1
          cat "$RUNNER_TEMP/track-contract.log"
          if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$RUNNER_TEMP/track-contract.log"; then
            echo "Rejected Godot error output in $RUNNER_TEMP/track-contract.log"
            exit 1
          fi
          grep -F '[TrackContract]' "$RUNNER_TEMP/track-contract.log"
          grep -F 'bergwelt' "$RUNNER_TEMP/track-contract.log"

      - name: Actual reference menu at eleven density and safe-area configurations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exports/production-menu
          export XDG_DATA_HOME="$RUNNER_TEMP/lumo-production-menu-user"
          python3 tools/run_godot_probe.py \
            --log exports/production-menu/menu.log \
            --timeout 120 --required '[KartProductionMenu] PASS' -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --audio-driver Dummy \
            --path . --script res://scripts/tests/kart_production_menu_regression.gd \
            -- exports/production-menu
          python3 tools/run_godot_probe.py \
            --log exports/production-menu/touch-journey.log \
            --timeout 120 --required '[StartHero] PASS' -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --audio-driver Dummy \
            --path . --script res://scripts/tests/kart_start_hero_regression.gd

      - name: Actual Next Level Fold menu and the existing greeting clip
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p exports/production-menu/gl exports/production-menu/motion
          export XDG_DATA_HOME="$RUNNER_TEMP/lumo-next-level-gl-user"
          python3 tools/run_godot_probe.py \
            --log exports/production-menu/gl-menu.log \
            --timeout 240 --required '[KartProductionMenu] PASS' -- \
            xvfb-run -a -s '-screen 0 2400x1920x24' \
            Godot_v4.6.3-stable_linux.x86_64 --audio-driver Dummy --path . \
            --rendering-method gl_compatibility \
            --script res://scripts/tests/kart_production_menu_regression.gd \
            -- exports/production-menu/gl --only-case=4 \
            --motion-output=exports/production-menu/motion

      - name: Optional stage ownership and renderer capability regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exports/aaa-regressions
          python3 tools/run_godot_probe.py --log exports/aaa-regressions/stage-lifetime.log \
            --timeout 45 --required '[AAAStageLifetime] PASS:' -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --path . \
            --script res://scripts/tests/kart_aaa_stage_lifetime.gd
          python3 tools/run_godot_probe.py --log exports/aaa-regressions/renderer-profile.log \
            --timeout 45 --required '[RendererProfiles] PASS:' -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --path . \
            --script res://scripts/tests/kart_renderer_profile_regression.gd

      - name: Sky Halo authoring safety contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --script res://scripts/tests/kart_sky_halo_authoring_contract.gd \
            > "$RUNNER_TEMP/sky-halo-contract.log" 2>&1
          cat "$RUNNER_TEMP/sky-halo-contract.log"
          if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$RUNNER_TEMP/sky-halo-contract.log"; then
            echo "Rejected Godot error output in $RUNNER_TEMP/sky-halo-contract.log"
            exit 1
          fi
          grep -F '[SkyHaloContract]' "$RUNNER_TEMP/sky-halo-contract.log"

      - name: Verify branded boot scene and real artwork for six games
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s Godot_v4.6.3-stable_linux.x86_64 \
            --headless --audio-driver Dummy --path . \
            --script res://scripts/tests/kart_entry_artwork_regression.gd \
            > "$RUNNER_TEMP/game-entry.log" 2>&1
          cat "$RUNNER_TEMP/game-entry.log"
          if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:|ERROR: Failed to load' "$RUNNER_TEMP/game-entry.log"; then exit 1; fi
          grep -F '[KartEntry] PASS:' "$RUNNER_TEMP/game-entry.log"

      - name: Actual threaded Kart loading, timeout, Retry and loaded-scene navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exports/kart-loading
          export XDG_DATA_HOME="$RUNNER_TEMP/lumo-kart-loading-user"
          python3 tools/run_godot_probe.py \
            --log exports/kart-loading/loading.log \
            --timeout 120 --required '[KartLoading] PASS' -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --audio-driver Dummy \
            --path . --script res://scripts/tests/kart_loading_regression.gd \
            -- exports/kart-loading
          cp scripts/tests/kart_loading_regression.gd \
            "$RUNNER_TEMP/lumo-kart-packed-runtime/loading_probe.gd"
          export XDG_DATA_HOME="$RUNNER_TEMP/lumo-kart-loading-packed-user"
          python3 tools/run_godot_probe.py \
            --log exports/kart-loading/packed-loading.log \
            --timeout 120 --required '[KartLoading] PASS' -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --audio-driver Dummy \
            --path "$RUNNER_TEMP/lumo-kart-packed-runtime" \
            --main-pack "$RUNNER_TEMP/lumo-kart-production.pck" \
            --script "$RUNNER_TEMP/lumo-kart-packed-runtime/loading_probe.gd" \
            -- exports/kart-loading/packed

      - name: Kart physics regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --script res://scripts/tests/kart_physics_regression.gd \
            > "$RUNNER_TEMP/kart-physics.log" 2>&1
          cat "$RUNNER_TEMP/kart-physics.log"
          if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$RUNNER_TEMP/kart-physics.log"; then
            echo "Rejected Godot error output in $RUNNER_TEMP/kart-physics.log"
            exit 1
          fi
          grep -F '[KartPhysics]' "$RUNNER_TEMP/kart-physics.log"

      - name: Active race autosave and I/O recovery regressions
        shell: bash
        run: |
          set -euo pipefail
          for case in \
            'kart_first_active_snapshot_regression:first-active-snapshot-evidence.json:41' \
            'kart_first_active_snapshot_engine_probe:natural-engine-public-touch-evidence.json:11' \
            'kart_first_active_snapshot_write_failure_probe:actual-write-failure-evidence.json:8'; do
            IFS=: read -r name evidence expected <<< "$case"
            dir="$RUNNER_TEMP/lumo-first-active/$name"
            mkdir -p "$dir"
            LUMO_QA_DIR="$dir" timeout 240s Godot_v4.6.3-stable_linux.x86_64 \
              --headless --audio-driver Dummy --path . \
              --script "res://scripts/tests/$name.gd" > "$dir/run.log" 2>&1
            cat "$dir/run.log"
            if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$dir/run.log"; then exit 1; fi
            python3 - "$dir/$evidence" "$expected" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          assert path.is_file(), path
          report = json.loads(path.read_text())
          count = int(sys.argv[2])
          assert report["status"] == "PASS"
          assert report["check_count"] == count
          assert report["failures"] == 0
          assert len(report["checks"]) == count
          assert all(row["passed"] for row in report["checks"])
          print(f"PASS {path.name}: {count} required checks")
          PY
          done

      - name: Full-viewport Fold pause shading and touch evidence
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/lumo-modal-backdrop"
          mkdir -p "$dir"
          LUMO_QA_DIR="$dir" timeout 300s \
            xvfb-run -a -s '-screen 0 2500x2500x24' Godot_v4.6.3-stable_linux.x86_64 \
              --path . --rendering-method gl_compatibility --audio-driver Dummy \
              --script res://scripts/tests/kart_modal_backdrop_regression.gd > "$dir/run.log" 2>&1
          cat "$dir/run.log"
          if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$dir/run.log"; then exit 1; fi
          grep -F '[LumoBackdrop] PASS:40' "$dir/run.log"
          python3 - "$dir" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          data = json.loads((root / "modal-backdrop-evidence.json").read_text())
          assert data["check_count"] == data["pass_count"] == 40
          assert len(data["cases"]) == 5
          assert len(data["checks"]) == 40
          assert all(check["passed"] for check in data["checks"])
          assert len(list(root.glob("*-actual-pause.png"))) == 5
          print("PASS: forty pause cover/touch/color checks and five actual Fold/phone PNGs")
          PY

      - name: Actual direct sections and race entry inside Android safe insets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exports/menu-safe-area
          python3 tools/run_godot_probe.py --log exports/menu-safe-area/menu-flow.log \
            --timeout 300 --required '[KartMenuFlow] PASS: five direct sections;' -- \
            xvfb-run -a -s '-screen 0 2500x2500x24' Godot_v4.6.3-stable_linux.x86_64 \
            --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/tests/kart_menu_flow_regression.gd
          grep -F '[KartMenuFlow] PASS: direct selected Cup start inside compact Android safe insets' exports/menu-safe-area/menu-flow.log
          cp exports/holographic-proof/menu-flow-*.png exports/menu-safe-area/
          cp exports/holographic-proof/menu-direct-640x320.png exports/menu-safe-area/

      - name: Kart mode and dynamic cup regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --script res://scripts/tests/kart_modes_regression.gd \
            > "$RUNNER_TEMP/kart-modes.log" 2>&1
          cat "$RUNNER_TEMP/kart-modes.log"
          if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$RUNNER_TEMP/kart-modes.log"; then
            echo "Rejected Godot error output in $RUNNER_TEMP/kart-modes.log"
            exit 1
          fi
          grep -F '[KartModesTests] PASS:' "$RUNNER_TEMP/kart-modes.log"

      - name: Fold and pause layout regression
        shell: bash
        run: |
          set -euo pipefail
          # This regression intentionally asserts a real desktop/window backend because it
          # captures rendered frames and injects physical-pixel touch coordinates.
          # Run it under Xvfb instead of Godot --headless.
          timeout 300s xvfb-run -a Godot_v4.6.3-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://scripts/tests/kart_pause_layout_regression.gd \
            > "$RUNNER_TEMP/kart-fold.log" 2>&1
          cat "$RUNNER_TEMP/kart-fold.log"
          if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:' "$RUNNER_TEMP/kart-fold.log"; then
            echo "Rejected Godot error output in $RUNNER_TEMP/kart-fold.log"
            exit 1
          fi
          grep -F '[KartPauseLayoutTests] PASS' "$RUNNER_TEMP/kart-fold.log"

      - name: Capture actual runtime frames for four track worlds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exports/sonnenhafen exports/sky-islands exports/zauberwald exports/holo-city
          timeout 220s xvfb-run -a Godot_v4.6.3-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://scripts/tests/kart_sonnenhafen_showcase.gd \
            > "$RUNNER_TEMP/kart-sonnenhafen-capture.log" 2>&1
          cat "$RUNNER_TEMP/kart-sonnenhafen-capture.log"
          test -s exports/sonnenhafen/01_start_grid.png
          test -s exports/sonnenhafen/06_overview.png

          python3 tools/run_godot_probe.py \
            --log "$RUNNER_TEMP/kart-sky-capture.log" \
            --timeout 220 \
            --required '[SkyShots] PASS: eight views, five prisms and clean factory lifetime' -- \
            xvfb-run -a Godot_v4.6.3-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://scripts/tests/kart_sky_islands_showcase.gd
          cat "$RUNNER_TEMP/kart-sky-capture.log"
          test -s exports/sky-islands/07_overview.png
          test -s exports/sky-islands/08_mystery_prisms.png
          grep -F '[SkyShots] runtime Mystery Prisms=5' "$RUNNER_TEMP/kart-sky-capture.log"

          timeout 220s xvfb-run -a Godot_v4.6.3-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://scripts/tests/kart_zauberwald_showcase.gd \
            > "$RUNNER_TEMP/kart-zauberwald-capture.log" 2>&1
          cat "$RUNNER_TEMP/kart-zauberwald-capture.log"
          test -s exports/zauberwald/01_glow_arch.png
          test -s exports/zauberwald/06_overview.png

          timeout 220s xvfb-run -a Godot_v4.6.3-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://scripts/tests/kart_holo_city_showcase.gd \
            > "$RUNNER_TEMP/kart-holo-city-capture.log" 2>&1
          cat "$RUNNER_TEMP/kart-holo-city-capture.log"
          test -s exports/holo-city/01_nova_link.png
          test -s exports/holo-city/06_overview.png

          mkdir -p exports/sky-halo-authoring
          timeout 180s xvfb-run -a Godot_v4.6.3-stable_linux.x86_64 \
            --path . \
            --rendering-method gl_compatibility \
            --audio-driver Dummy \
            --script res://scripts/tests/kart_sky_halo_authoring_showcase.gd \
            > "$RUNNER_TEMP/sky-halo-capture.log" 2>&1
          cat "$RUNNER_TEMP/sky-halo-capture.log"
          test -s exports/sky-halo-authoring/01_side.png
          test -s exports/sky-halo-authoring/02_three_quarter.png

      - name: Verify character anatomy and capture the real start menu
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LUMO_EXPECT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p exports/character-review
          for case in \
            'kart_character_pose_regression|character-pose|[CharacterPose] checks=2325 failures=0' \
            'kart_face_depth_regression|face-depth|[FaceDepth] checks=23 failures=0' \
            'kart_fox_eye_proportions_regression|fox-eyes|[LumoEyeProportions] PASS:' \
            'kart_stage_visual_regression|face-studio|[LumoFaceStudio] PASS:'; do
            IFS='|' read -r lumo_probe lumo_log lumo_marker <<< "$case"
            python3 tools/run_godot_probe.py --log "exports/character-review/$lumo_log.log" \
              --timeout 180 --required "$lumo_marker" -- \
              Godot_v4.6.3-stable_linux.x86_64 --headless --audio-driver Dummy --path . \
              --script "res://scripts/tests/$lumo_probe.gd"
          done
          grep -F '[CharacterPose] PASS:' exports/character-review/character-pose.log
          grep -F '[FaceDepth] PASS:' exports/character-review/face-depth.log
          python3 tools/run_godot_probe.py --log exports/character-review/lumo-face-capture.log \
            --timeout 240 --required '[LumoFaceCapture] PASS:' -- \
            xvfb-run -a -s '-screen 0 2400x2400x24' Godot_v4.6.3-stable_linux.x86_64 \
            --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/tests/kart_garage_face_capture.gd
          python3 tools/run_godot_probe.py --log exports/character-review/lumo-driver-4views.log \
            --timeout 240 --required '[DriverPortrait] PASS:' -- \
            xvfb-run -a -s '-screen 0 2400x2400x24' Godot_v4.6.3-stable_linux.x86_64 \
            --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/tests/kart_driver_portrait.gd \
            -- res://exports/face-showroom/lumo-driver-4views.png
          python3 tools/run_godot_probe.py --log exports/character-review/start-hero.log \
            --timeout 600 --required '[StartHero] checks=225 failures=0' -- \
            xvfb-run -a -s '-screen 0 2400x2400x24' Godot_v4.6.3-stable_linux.x86_64 \
            --path . --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://scripts/tests/kart_start_hero_regression.gd
          grep -F '[StartHero] PASS:' exports/character-review/start-hero.log
          python3 tools/run_godot_probe.py --log exports/character-review/aquarium-headless.log \
            --timeout 240 --required '[KartAquarium] PASS:' -- \
            Godot_v4.6.3-stable_linux.x86_64 --headless --audio-driver Dummy --path . \
            --script res://scripts/tests/kart_aquarium_clearance_regression.gd
          python3 tools/run_godot_probe.py --log exports/character-review/aquarium-rendered.log \
            --timeout 240 --required '[KartAquarium] PASS:' -- \
            xvfb-run -a -s '-screen 0 2400x2400x24' Godot_v4.6.3-stable_linux.x86_64 --audio-driver Dummy --path . \
            --rendering-method gl_compatibility --script res://scripts/tests/kart_aquarium_clearance_regression.gd
          python3 tools/run_godot_probe.py --log exports/character-review/aquarium-capture.log \
            --timeout 300 --required '[KartAquariumCapture] PASS: six actual chase-camera views, LOW/HIGH' -- \
            xvfb-run -a -s '-screen 0 2400x2400x24' Godot_v4.6.3-stable_linux.x86_64 --audio-driver Dummy --path . \
            --rendering-method gl_compatibility --script res://scripts/tests/kart_aquarium_capture.gd
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, struct, subprocess
          from pathlib import Path
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['LUMO_EXPECT_SOURCE']
          subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--'], check=True)
          output = Path('exports/character-review')
          checks = {}
          for name, tag, expected in (
              ('character-pose', 'CharacterPose', 2325),
              ('face-depth', 'FaceDepth', 23),
              ('start-hero', 'StartHero', 225),
          ):
              results = re.findall(rf'^\[{re.escape(tag)}\] checks=(\d+) failures=(\d+)$',
                  (output / (name + '.log')).read_text(), re.MULTILINE)
              assert results == [(str(expected), '0')], name
              checks[name] = int(results[0][0])
          aquarium_runs = {}
          aquarium_pass = '[KartAquarium] PASS: schools, reefs, clearance, water UVs, budgets and preserved race geometry'
          for mode in ('headless', 'rendered'):
              log = (output / ('aquarium-' + mode + '.log')).read_text()
              rows = re.findall(r'^\[KartAquarium\] (LOW|HIGH): (\d+) batched props, (\d+) fish$', log, re.MULTILINE)
              assert rows == [('LOW', '292', '12'), ('HIGH', '324', '40')], mode
              assert log.splitlines().count(aquarium_pass) == 1, mode
              aquarium_runs[mode] = {quality: {'batched_props': int(props), 'fish': int(fish)}
                                      for quality, props, fish in rows}
          gpu_marker = '[KartAquarium] GPU instance clearance verified for the complete school motion envelope'
          assert (output / 'aquarium-rendered.log').read_text().splitlines().count(gpu_marker) == 1
          driven_rows = re.findall(r'^\[KartAquariumCapture\] ([0-9]{2}-(?:low|high)-(?:entry|middle|exit)): '
                                   r'1280x720, ([0-9]+\.[0-9]+) metres driven$',
                                   (output / 'aquarium-capture.log').read_text(), re.MULTILINE)
          aquarium_names = ('01-low-entry', '02-low-middle', '03-low-exit',
                            '04-high-entry', '05-high-middle', '06-high-exit')
          assert tuple(name for name, _ in driven_rows) == aquarium_names
          assert all(float(distance) >= 6.0 for _, distance in driven_rows)
          aquarium = {'runs': aquarium_runs, 'gpu_instance_clearance_verified': True,
                      'capture_driven_metres': {name: float(distance) for name, distance in driven_rows}}
          captures = []
          for name, size in {
              'face-showroom/lumo-driver-4views.png': (1280, 1280),
              'face-showroom/lumo-face-1280x720.png': (1280, 720),
              'face-showroom/lumo-face-800x480.png': (800, 480),
              'face-showroom/lumo-face-412x915.png': (412, 915),
              'start-review/start-1280x720.png': (1280, 720),
              'start-review/start-800x480.png': (800, 480),
              'start-review/start-412x915.png': (412, 915),
              'start-review/start-saved-320x568.png': (320, 568),
              'aquarium-proof/01-low-entry.png': (1280, 720),
              'aquarium-proof/02-low-middle.png': (1280, 720),
              'aquarium-proof/03-low-exit.png': (1280, 720),
              'aquarium-proof/04-high-entry.png': (1280, 720),
              'aquarium-proof/05-high-middle.png': (1280, 720),
              'aquarium-proof/06-high-exit.png': (1280, 720),
          }.items():
              path = Path('exports') / name
              assert path.is_file() and not path.is_symlink(), name
              raw = path.read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n' and raw[12:16] == b'IHDR', name
              assert struct.unpack('>II', raw[16:24]) == size, name
              shutil.copyfile(path, output / path.name)
              captures.append({'file': path.name, 'source_path': str(path),
                               'width': size[0], 'height': size[1],
                               'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          sources = (
              'scripts/games/kart_vehicle.gd', 'scripts/games/kart_character_finish.gd',
              'scripts/games/kart_garage_menu.gd', 'scripts/games/kart_stage.gd',
              'scripts/games/kart_harbor_aquarium.gd',
              'assets/shaders/kart_aquarium.gdshader',
              'scripts/tests/kart_aquarium_clearance_regression.gd',
              'scripts/tests/kart_aquarium_capture.gd',
              'scripts/tests/kart_character_pose_regression.gd',
              'scripts/tests/kart_face_depth_regression.gd',
              'scripts/tests/kart_fox_eye_proportions_regression.gd',
              'scripts/tests/kart_stage_visual_regression.gd',
              'scripts/tests/kart_start_hero_regression.gd',
              'scripts/tests/kart_garage_face_capture.gd',
              'scripts/tests/kart_driver_portrait.gd',
          )
          (output / 'STAGE2-CHARACTER-EVIDENCE.json').write_text(json.dumps({
              'status': 'PASS', 'tested_godot_commit': source,
              'engine': subprocess.check_output(['Godot_v4.6.3-stable_linux.x86_64', '--version'], text=True).strip(),
              'measured_checks': checks, 'aquarium': aquarium, 'captures': captures,
              'source_sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sources},
              'log_sha256': {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                             for path in sorted(output.glob('*.log'))},
              'capture_scope': 'Actual X11/gl_compatibility software renders of the checked-out Stage 2 source',
              'physical_device_performance': 'NOT EXECUTED',
          }, indent=2) + '\n')
          print('[Stage2Character] PASS: measured anatomy/start/aquarium checks and fourteen source-bound PNGs')
          PY

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kart-stage2-regression-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/track-contract.log
            ${{ runner.temp }}/kart-physics.log
            ${{ runner.temp }}/game-entry.log
            ${{ runner.temp }}/kart-modes.log
            ${{ runner.temp }}/kart-fold.log
            ${{ runner.temp }}/kart-sonnenhafen-capture.log
            ${{ runner.temp }}/kart-sky-capture.log
            ${{ runner.temp }}/kart-zauberwald-capture.log
            ${{ runner.temp }}/kart-holo-city-capture.log
            ${{ runner.temp }}/sky-halo-contract.log
            ${{ runner.temp }}/sky-halo-capture.log
            ${{ runner.temp }}/lumo-first-active/**
            ${{ runner.temp }}/lumo-modal-backdrop/**
            exports/sonnenhafen/*.png
            exports/sky-islands/*.png
            exports/zauberwald/*.png
            exports/holo-city/*.png
            exports/sky-halo-authoring/*.png
            exports/character-review/**
            exports/menu-safe-area/**
            exports/lumo-kart-production/**
            exports/production-menu/**
            exports/kart-loading/**
          if-no-files-found: warn
          retention-days: 14
