name: LUMO Studio 2020 native acceptance

on:
  push:
    branches: [chatgpt/lumo-studio-2020-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep exact-source evidence from a prior review candidate while the corrected
  # commit is tested. Duplicate events for one commit still share one runner.
  group: lumo-studio-2020-acceptance-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # Independent, early renderer evidence for the active light/camera review.
  # The complete new-worlds/gameplay jobs remain required for final acceptance.
  learning-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LUMO_PREVIEW_DIR: ${{ github.workspace }}/learning-preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install exact verified Godot engine and software renderer
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import exact production source and capture the actual learning world
        run: |
          set -euo pipefail
          mkdir -p "$LUMO_PREVIEW_DIR"
          git rev-parse HEAD > "$LUMO_PREVIEW_DIR/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$LUMO_PREVIEW_DIR/source-tree.txt"
          godot --version > "$LUMO_PREVIEW_DIR/engine.txt"
          export XDG_DATA_HOME="$LUMO_PREVIEW_DIR/user-data"
          export XDG_CONFIG_HOME="$LUMO_PREVIEW_DIR/user-config"
          export XDG_CACHE_HOME="$LUMO_PREVIEW_DIR/user-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          godot --headless --editor --import --quit 2>&1 | tee "$LUMO_PREVIEW_DIR/import.log"
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' "$LUMO_PREVIEW_DIR/import.log"; then exit 1; fi
          LUMO_CAPTURE_DIR="$LUMO_PREVIEW_DIR/images" python3 tools/run_godot_probe.py \
            --log "$LUMO_PREVIEW_DIR/render.log" --timeout 900 --required '[LearningCapture] PASS' -- \
            xvfb-run -a -s '-screen 0 2560x2560x24' godot --path . \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --script scripts/tests/learning_world_capture.gd -- --output="$LUMO_PREVIEW_DIR/images"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-studio-2020-learning-preview
          path: learning-preview/
          if-no-files-found: error
          retention-days: 30

  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LUMO_2014_LOG_DIR: ${{ github.workspace }}/acceptance-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install exact verified Godot engine and software renderer
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import production project and validate structure
        run: |
          set -euo pipefail
          mkdir -p "$LUMO_2014_LOG_DIR"
          git rev-parse HEAD > "$LUMO_2014_LOG_DIR/source-sha.txt"
          python3 tools/validate_project.py 2>&1 | tee "$LUMO_2014_LOG_DIR/project-validation.log"
          godot --headless --editor --import --quit 2>&1 | tee "$LUMO_2014_LOG_DIR/import.log"
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' "$LUMO_2014_LOG_DIR/import.log"; then exit 1; fi
      - name: Live full-screen menu, action ramps and lasso render evidence
        run: LUMO_ACTION_LOG_DIR="$LUMO_2014_LOG_DIR/action-stage" bash tools/validate_action_stage.sh
      - name: Existing gameplay regression suite
        run: |
          set -euo pipefail
          bash tools/validate_project.sh 2>&1 | tee "$LUMO_2014_LOG_DIR/existing-gameplay.log"
      - name: Continuous loops, physical ramps, fair AI and living harbor
        run: bash tools/validate_2014.sh
      - name: Integrated streetfronts, original Lumo and garage presentation
        run: LUMO_ART_LOG_DIR="$LUMO_2014_LOG_DIR/technical-art" bash tools/validate_technical_art.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-studio-2020-legacy-evidence
          path: |
            acceptance-evidence/
            exports/spatial-menu/
            exports/nextgen/
            exports/creative-build/
            exports/jump/
            exports/learning/
            exports/nextgen-garage/
          if-no-files-found: error
          retention-days: 30

  new-worlds:
    needs: studio
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LUMO_2014_LOG_DIR: ${{ github.workspace }}/nextgen-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install exact verified Godot engine and software renderer
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import production project and validate structure
        run: |
          set -euo pipefail
          mkdir -p "$LUMO_2014_LOG_DIR"
          git rev-parse HEAD > "$LUMO_2014_LOG_DIR/source-sha.txt"
          python3 tools/validate_project.py 2>&1 | tee "$LUMO_2014_LOG_DIR/project-validation.log"
          godot --headless --editor --import --quit 2>&1 | tee "$LUMO_2014_LOG_DIR/import.log"
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' "$LUMO_2014_LOG_DIR/import.log"; then exit 1; fi
      - name: Verify fail-closed collection of every independent module
        run: python3 -m unittest discover -s tools/tests -p test_nextgen_runner.py -v
      - name: Capture the original 2017 garage using its exact production source
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/lumo-nextgen-original-2017"
          proof="$LUMO_2014_LOG_DIR/baseline-2017"
          mkdir -p "$proof" "$baseline"
          git -C "$baseline" init
          git -C "$baseline" remote add origin https://github.com/Ullmann27/lumo-godot.git
          git -C "$baseline" fetch --depth 1 origin 1d5c5cb45a323228f627ec529e6ff1ddd86f1c57
          git -C "$baseline" checkout --detach FETCH_HEAD
          test "$(git -C "$baseline" rev-parse HEAD)" = 1d5c5cb45a323228f627ec529e6ff1ddd86f1c57
          git -C "$baseline" rev-parse HEAD > "$proof/source-sha.txt"
          git -C "$baseline" rev-parse 'HEAD^{tree}' > "$proof/source-tree.txt"
          cp scripts/tests/kart_nextgen_garage_baseline_capture.gd "$baseline/scripts/tests/"
          sha256sum "$baseline/scripts/tests/kart_nextgen_garage_baseline_capture.gd" > "$proof/test-sha256.txt"
          export XDG_DATA_HOME="$proof/user-data"
          export XDG_CONFIG_HOME="$proof/user-config"
          export XDG_CACHE_HOME="$proof/user-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          godot --headless --path "$baseline" --editor --import --quit 2>&1 | tee "$proof/import.log"
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' "$proof/import.log"; then exit 1; fi
          LUMO_CAPTURE_DIR="$proof/garage" python3 tools/run_godot_probe.py \
            --log "$proof/garage-render.log" --timeout 420 --required '[NextGenGarageBefore] PASS' -- \
            xvfb-run -a -s '-screen 0 2560x2560x24' godot --path "$baseline" \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --script "$baseline/scripts/tests/kart_nextgen_garage_baseline_capture.gd"
          python3 tools/run_godot_probe.py \
            --log "$proof/build-render.log" --timeout 420 \
            --required '[CreativeBuild] PASS: actual world, successful JSON reload, pause, 4 rendered screenshots' -- \
            xvfb-run -a -s '-screen 0 2560x2560x24' godot --path "$baseline" \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --script "$baseline/scripts/tests/creative_build_capture.gd"
          cp -R "$baseline/exports/creative-build" "$proof/build"
      - name: New learning, character and interactive production-scene gates
        run: LUMO_NEXTGEN_LOG_DIR="$LUMO_2014_LOG_DIR/nextgen" bash tools/validate_nextgen.sh
      - uses: actions/download-artifact@v4
        with:
          name: lumo-studio-2020-new-evidence
          path: studio-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-studio-2020-worlds-evidence
          path: |
            studio-evidence/
            nextgen-evidence/
            exports/nextgen-garage/
          if-no-files-found: error
          retention-days: 30

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LUMO_STUDIO_LOG_DIR: ${{ github.workspace }}/studio-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install exact verified Godot engine and software renderer
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0 ffmpeg
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import exact production source and execute Studio interactions and captures
        run: |
          set -euo pipefail
          mkdir -p "$LUMO_STUDIO_LOG_DIR"
          godot --headless --editor --import --quit 2>&1 | tee "$LUMO_STUDIO_LOG_DIR/import.log"
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' "$LUMO_STUDIO_LOG_DIR/import.log"; then exit 1; fi
          bash tools/validate_studio.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-studio-2020-new-evidence
          path: studio-evidence/
          if-no-files-found: error
          retention-days: 30

  touch-density:
    name: touch-${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        scope: [workshop, treasure, build]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      LUMO_TOUCH_LOG_DIR: ${{ github.workspace }}/touch-evidence/${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install exact verified Godot engine and software renderer
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import production project and exercise real density-aware input
        env:
          TOUCH_SCOPE: ${{ matrix.scope }}
        run: |
          set -euo pipefail
          mkdir -p "$LUMO_TOUCH_LOG_DIR"
          godot --headless --editor --import --quit 2>&1 | tee "$LUMO_TOUCH_LOG_DIR/import.log"
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' "$LUMO_TOUCH_LOG_DIR/import.log"; then exit 1; fi
          bash tools/validate_studio_touch.sh "$TOUCH_SCOPE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-studio-2020-touch-${{ matrix.scope }}
          path: touch-evidence/
          if-no-files-found: error
          retention-days: 30

  bundle-evidence:
    needs: [new-worlds, touch-density]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lumo-studio-2020-worlds-evidence
          path: native-evidence/
      - uses: actions/download-artifact@v4
        with:
          pattern: lumo-studio-2020-touch-*
          path: native-evidence/touch-evidence/
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-studio-2020-native-evidence
          path: native-evidence/
          if-no-files-found: error
          retention-days: 30

  archive-evidence:
    needs: [learning-preview, gameplay, new-worlds, studio, touch-density, bundle-evidence]
    if: github.repository == 'Ullmann27/lumo-godot' && github.ref_name == 'chatgpt/lumo-studio-2020-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Preserve exact original native ZIP without cross-repository credentials
        run: |
          set -euo pipefail
          gh api "repos/Ullmann27/lumo-godot/actions/runs/$RUN_ID/artifacts?per_page=100" > artifacts.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          artifacts = json.loads(Path('artifacts.json').read_text())['artifacts']
          matches = [item for item in artifacts if item['name'] == 'lumo-studio-2020-native-evidence']
          assert len(matches) == 1, 'Missing or ambiguous current native artifact'
          artifact = matches[0]
          assert artifact['expired'] is False
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_SHA']
          assert artifact['workflow_run']['id'] == int(os.environ['RUN_ID'])
          assert type(artifact['id']) is int and artifact['id'] > 0
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', artifact['digest'])
          Path('artifact-id.txt').write_text(str(artifact['id']))
          Path('native-artifact.json').write_text(json.dumps(artifact, indent=2) + '\n')
          Path('native-evidence.zip.sha256').write_text(artifact['digest'][7:] + '  native-evidence.zip\n')
          PY
          artifact_id="$(cat artifact-id.txt)"
          gh api "repos/Ullmann27/lumo-godot/actions/artifacts/$artifact_id/zip" > native-evidence.zip
          sha256sum -c native-evidence.zip.sha256
          tag="studio-2020-evidence-$SOURCE_SHA-$artifact_id"
          gh api "repos/Ullmann27/lumo-godot/git/matching-refs/tags/$tag" > refs.json
          gh api --paginate --slurp 'repos/Ullmann27/lumo-godot/releases?per_page=100' > releases.json
          python3 - "$tag" <<'PY'
          import json, os, sys
          from pathlib import Path
          tag = sys.argv[1]
          refs = [item for item in json.loads(Path('refs.json').read_text()) if item['ref'] == 'refs/tags/' + tag]
          releases = [item for page in json.loads(Path('releases.json').read_text()) for item in page if item['tag_name'] == tag]
          if refs or releases:
              assert len(refs) == len(releases) == 1, 'Incomplete archive identity already exists; preserve it'
              assert refs[0]['object']['type'] == 'commit' and refs[0]['object']['sha'] == os.environ['SOURCE_SHA']
              assert releases[0]['draft'] is False and releases[0]['prerelease'] is True
              assets = [item for item in releases[0]['assets'] if item['name'] == 'native-evidence.zip']
              assert len(assets) == 1 and assets[0]['state'] == 'uploaded'
              Path('archive-mode.txt').write_text('verify-existing')
          else:
              Path('archive-mode.txt').write_text('create')
          PY
          if [ "$(cat archive-mode.txt)" = create ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          Path('archive-notes.md').write_text(
              'Original native CI evidence archive. This contains test logs and renderer captures, not an APK.\n\n'
              'Source: `' + os.environ['SOURCE_SHA'] + '`\n\n'
              'Workflow: https://github.com/Ullmann27/lumo-godot/actions/runs/' + os.environ['RUN_ID'] + '\n\n'
              'The ZIP bytes and SHA-256 are identical to the GitHub Actions artifact. '
              'Preserving them here allows the separate Flutter repository to verify the original evidence '
              'without granting its workflow a cross-repository access token. Visual review and Android acceptance remain separate.\n')
          PY
            gh release create "$tag" native-evidence.zip native-evidence.zip.sha256 native-artifact.json \
              --repo Ullmann27/lumo-godot --target "$SOURCE_SHA" \
              --title "Studio native evidence $SOURCE_SHA" --notes-file archive-notes.md \
              --prerelease --latest=false
          fi
          curl --fail --location --retry 3 \
            "https://github.com/Ullmann27/lumo-godot/releases/download/$tag/native-evidence.zip" \
            --output public-native-evidence.zip
          cmp native-evidence.zip public-native-evidence.zip
