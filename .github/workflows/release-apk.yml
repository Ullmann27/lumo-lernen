name: Build unified Lumo Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: ['claude/lumo-gesamt']
  push:
    # One isolated, already validated Godot->Flutter recovery candidate.
    branches: ['copilot/5979796457-update-integrationsaudit', 'chatgpt/lumo-aaa-kart-integration-2026-10-10', 'chatgpt/lumo-onboarding-voice-1924-2026-10-10']
    paths: ['.github/workflows/release-apk.yml', 'config/godot-source.json', 'pubspec.yaml', 'lib/features/onboarding/**', 'lib/core/lumo_voice.dart', 'test/onboarding_visual_capture_test.dart', 'test/lumo_voice_clips_test.dart']
permissions:
  contents: write
concurrency:
  group: unified-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      apk-sha: ${{ steps.apk-identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Get locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Install required source scan tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          rg --version
      - name: Backend and Android preparation tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lumo-probe-test-logs"
          node --test server/lumo-ai-proxy/test/*.test.js 2>&1 | tee "$RUNNER_TEMP/lumo-probe-test-logs/backend.log"
          python3 -m unittest discover -s scripts/tests 2>&1 | tee "$RUNNER_TEMP/lumo-probe-test-logs/android-preparation.log"
      - name: Generated content audit
        run: |
          set -euo pipefail
          dart scripts/audit_content.dart 2>&1 | tee "$RUNNER_TEMP/lumo-probe-test-logs/content-audit.log"
      - name: Repair guard
        run: |
          set -euo pipefail
          bash scripts/lumo_repair_guard.sh 2>&1 | tee "$RUNNER_TEMP/lumo-probe-test-logs/repair-guard.log"
      - name: Analyze
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/lumo-probe-test-logs/flutter-analyze.log"
      - name: Full Flutter regression tests
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter=expanded --timeout=60s --concurrency=2 2>&1 | tee "$RUNNER_TEMP/lumo-probe-test-logs/flutter-tests.log"
      - name: Install matching Godot engine
        run: bash scripts/install_godot_for_build.sh
      - name: Use the committed application version
        run: |
          set -euo pipefail
          read -r lumo_version_name lumo_build_number < <(python3 scripts/build_version.py)
          printf 'LUMO_BUILD_NUMBER=%s\nLUMO_VERSION_NAME=%s\n' \
            "$lumo_build_number" "$lumo_version_name" >> "$GITHUB_ENV"
      - name: Build and verify the single application
        run: bash scripts/build_unified_apk.sh
      - name: Record build proof
        id: apk-identity
        run: |
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$(sha256sum dist/Lumo-Lernen-Neu.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Record compact test outcomes
        if: success()
        run: |
          {
            printf 'Source SHA: %s\n' "$(git rev-parse HEAD)"
            printf 'Package build number: %s\n' "$LUMO_BUILD_NUMBER"
            printf 'Package version name: %s\n' "$LUMO_VERSION_NAME"
            for log in "$RUNNER_TEMP"/lumo-probe-test-logs/*.log; do
              printf '\n--- %s ---\n' "$(basename "$log")"
              tail -n 12 "$log"
              grep -iE 'skip|skipped' "$log" | tail -n 20 || true
            done
          } | tee dist/TEST-RESULTS.txt
      - name: Upload verified probe APK and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-probe-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/Lumo-Lernen-Neu.apk
            dist/SHA256SUMS.txt
            dist/APK-VERIFICATION.json
            dist/BUILD-PROVENANCE.json
            dist/TEST-RESULTS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Record artifact handoff location
        if: success()
        run: |
          {
            echo ""
            echo "## Verified probe artifact"
            echo ""
            echo "Artifact: \`lumo-probe-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Download the artifact from the run's Artifacts section; no release was published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Heinz test APK prerelease
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'chatgpt/lumo-test-apk-2026-10-05'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="lumo-test-apk-2026-10-05-fold-kart"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/Lumo-Lernen-Neu.apk \
              dist/SHA256SUMS.txt \
              dist/APK-VERIFICATION.json \
              dist/BUILD-PROVENANCE.json \
              dist/TEST-RESULTS.txt \
              --clobber
          else
            gh release create "$TAG" \
              dist/Lumo-Lernen-Neu.apk \
              dist/SHA256SUMS.txt \
              dist/APK-VERIFICATION.json \
              dist/BUILD-PROVENANCE.json \
              dist/TEST-RESULTS.txt \
              --prerelease \
              --title "Lumo Test APK – Hologlass + Fold + Kart" \
            --notes "Testversion aus ${GITHUB_SHA}. Enthält neues Hologlass-Onboarding, Fold-Host-Fix und aktuellen Lumo-Kart-Stand. Kein Produktionsrelease."

  android-voice-smoke:
    name: Android16 voice controls and update evidence
    needs: verify
    if: github.ref_name == 'computer/lumo-context-sulafat-2026-10-10'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      LUMO_EXPECT_SOURCE: ${{ github.sha }}
      LUMO_EXPECT_APK_SHA: ${{ needs.verify.outputs.apk-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          name: lumo-probe-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
      - name: Fetch digest-pinned 1926 baseline and isolated UI readers
        run: |
          set -euo pipefail
          mkdir -p baseline voice-proof
          curl -fL --max-time 120 'https://github.com/Ullmann27/lumo-lernen/releases/download/lumo-0.12.19-1926-sulafat-test/Lumo-Lernen-Neu.apk' -o baseline/Lumo-Lernen-Neu.apk
          echo '9dfd5f58a8879b3fa95b505ad92bc9cb20ee433298c92797404d3f588c38b1f4  baseline/Lumo-Lernen-Neu.apk' | sha256sum -c -
          echo "$LUMO_EXPECT_APK_SHA  candidate/Lumo-Lernen-Neu.apk" | sha256sum -c -
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          python3 -m py_compile .github/probes/lumo_speech_android_probe.py
      - name: Enable KVM for a disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod a+rw /dev/kvm
      - name: Prepare declared Android16 image
        run: python3 tools/android_qa/prepare_system_image.py --api 36 --out voice-proof/system-image --timeout 600
      - name: Update exact APK and use actual parent voice controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: .probe-venv/bin/python .github/probes/lumo_speech_android_probe.py --baseline baseline/Lumo-Lernen-Neu.apk --candidate candidate/Lumo-Lernen-Neu.apk --out voice-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-1927-android16-voice-proof-${{ github.run_id }}
          path: voice-proof/
          if-no-files-found: error
          retention-days: 14
