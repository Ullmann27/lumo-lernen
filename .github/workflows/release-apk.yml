name: Relay exact Lumo 1927 Android failure evidence
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  relay:
    if: github.ref_name == 'computer/lumo-1927-apk-handoff-2026-10-10'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Ullmann27/lumo-lernen
      TAG: lumo-0.12.20-1927-context-voice-technical-test
    steps:
      - name: Relay immutable fictional-emulator evidence, never an APK rebuild
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/11677331830/zip" > ANDROID-VOICE-QA-ORIGINAL.zip
          echo 'f72a333d9b90ff3ab1befcb3ba844fbf0bb909f599d4e1eb5a926cef25d770f8  ANDROID-VOICE-QA-ORIGINAL.zip' | sha256sum -c -
          gh release upload "$TAG" ANDROID-VOICE-QA-ORIGINAL.zip --repo "$REPO"
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('ANDROID-VOICE-QA-ORIGINAL.zip') as z:
              for n in z.namelist():
                  if n.endswith('speech-android-result.json'):
                      print(z.read(n).decode())
          PY
