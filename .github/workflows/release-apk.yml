name: Publish verified Android APK
on:
  push:
    branches: [main, codex/lumo-restart-school-test-2026-10-02, codex/lumo-school-readiness-followup-2026-10-02]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Create Android host
        run: flutter create --platforms=android --org dev.ullmann.lumo .
      - name: Prepare native connections and stable signing
        run: python3 scripts/prepare_android.py
      - name: Backend and Android regression tests
        run: |
          node --test server/lumo-ai-proxy/test/*.test.js
          python3 -m unittest discover -s scripts/tests
      - name: Audit all generated task templates
        run: dart scripts/audit_content.dart
      - name: Repair guard
        run: bash scripts/lumo_repair_guard.sh
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Full Flutter regression tests
        run: flutter test --no-pub --reporter=expanded --timeout=45s --concurrency=2
      - name: Build Android APK
        run: >-
          flutter build apk --release
          --build-number "$GITHUB_RUN_NUMBER" --build-name 0.9.0
          --dart-define=LUMO_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          --dart-define=LUMO_VERSION_NAME=0.9.0
          --dart-define=LUMO_ACTIVATE_COACH=true
      - name: Verify upgrade signing certificate
        run: python3 scripts/verify_android_apk.py build/app/outputs/flutter-apk/app-release.apk
      - name: Prepare release
        id: prepare
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Lumo-Lernen-latest.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          school=os.environ['BRANCH']!='main'
          tag=('school-test-' if school else 'build-')+os.environ['GITHUB_RUN_NUMBER']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write(f'tag={tag}\nprerelease={str(school).lower()}\nlatest={str(not school).lower()}\n')
          Path('/tmp/release_body.md').write_text('Lumo Lernen 0.9.0 – geprüfter Android-Testbuild.\n\nFlüssig bewegter Lernfuchs mit freiwilligen Lernideen und Erklärungen, überarbeitete Aufgaben und Schreibvorlagen sowie Eltern-PIN-Einrichtung. Optimierter Release-Build mit bestehender Update-Signatur. Online-KI in der App freigegeben; ihr externer Dienst kann weiterhin durch ein Provider-Limit blockiert sein.\n\nFlutter-Analyse, vollständige Flutter-Tests sowie Backend- und Android-Verbindungstests müssen vor Veröffentlichung erfolgreich sein. Geräte-, Sprach- und Unterrichtstest stehen noch aus.\n\nDie 3D-App wird separat installiert; im Rennspiel führt „3D-Rennen“ direkt zu ihr oder zur Browser-Version.\n\nPrüfsumme: SHA256SUMS.txt.\n')
          PY
      - name: Publish downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: Lumo Lernen ${{ steps.prepare.outputs.tag }}
          body_path: /tmp/release_body.md
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.prepare.outputs.latest }}
          files: |
            dist/Lumo-Lernen-latest.apk
            dist/SHA256SUMS.txt
