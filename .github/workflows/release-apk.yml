name: Build unified Lumo Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Get locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Backend and Android preparation tests
        run: |
          node --test server/lumo-ai-proxy/test/*.test.js
          python3 -m unittest discover -s scripts/tests
      - name: Generated content audit
        run: dart scripts/audit_content.dart
      - name: Repair guard
        run: bash scripts/lumo_repair_guard.sh
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Full Flutter regression tests
        run: flutter test --no-pub --reporter=expanded --timeout=60s --concurrency=2
      - name: Install matching Godot engine
        run: bash scripts/install_godot_for_build.sh
      - name: Build and verify the single application
        run: bash scripts/build_unified_apk.sh
      # Production downloads are published from the APK that passed actual
      # installed Android lifecycle/race tests, with its digest in the handoff.
      - name: Record build proof
        run: |
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk >> "$GITHUB_STEP_SUMMARY"
