name: Android16 proof against the same already built Lumo 1927 APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-voice:
    if: github.ref_name == 'computer/lumo-1927-runtime-qa-same-apk-2026-10-10'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LUMO_EXPECT_SOURCE: 8408f37772d8ec4067f49f3b9d506190b3de94c5
      LUMO_EXPECT_APK_SHA: 8d88637daaea63944213f86de90508c6f78e5deeb4d696af1f197e3a16957370
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch immutable existing APKs, never build or resign either one
        run: |
          set -euo pipefail
          mkdir -p candidate baseline voice-proof
          URL=https://github.com/Ullmann27/lumo-lernen/releases/download/lumo-0.12.20-1927-context-voice-technical-test
          curl -fL --max-time 180 "$URL/Lumo-Lernen-Neu.apk" -o candidate/Lumo-Lernen-Neu.apk
          curl -fL --max-time 45 "$URL/BUILD-PROVENANCE.json" -o candidate/BUILD-PROVENANCE.json
          curl -fL --max-time 180 https://github.com/Ullmann27/lumo-lernen/releases/download/lumo-0.12.19-1926-sulafat-test/Lumo-Lernen-Neu.apk -o baseline/Lumo-Lernen-Neu.apk
          echo "$LUMO_EXPECT_APK_SHA  candidate/Lumo-Lernen-Neu.apk" | sha256sum -c -
          echo '9dfd5f58a8879b3fa95b505ad92bc9cb20ee433298c92797404d3f588c38b1f4  baseline/Lumo-Lernen-Neu.apk' | sha256sum -c -
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          python3 -m py_compile .github/probes/lumo_speech_android_probe.py
      - name: Enable KVM for a disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod a+rw /dev/kvm
      - name: Prepare declared Android16 image
        run: python3 tools/android_qa/prepare_system_image.py --api 36 --out voice-proof/system-image --timeout 600
      - name: Exercise actual update and parent controls with corrected navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: .probe-venv/bin/python .github/probes/lumo_speech_android_probe.py --baseline baseline/Lumo-Lernen-Neu.apk --candidate candidate/Lumo-Lernen-Neu.apk --out voice-proof
      - name: Preserve actual result, including a failure, without changing the APK
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="ANDROID-VOICE-QA-${GITHUB_RUN_ID}.zip"
          (cd voice-proof && zip -qr "$GITHUB_WORKSPACE/$ARCHIVE" .)
          gh release upload lumo-0.12.20-1927-context-voice-technical-test "$ARCHIVE" --repo Ullmann27/lumo-lernen
          if test -f voice-proof/speech-android-result.json; then
            cat voice-proof/speech-android-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-1927-same-apk-android16-${{ github.run_id }}
          path: voice-proof/
          if-no-files-found: error
          retention-days: 14
