name: Diagnose actual 6b Village return and C4 with the unchanged APK
on:
  push:
    branches: [qa/lumo-village-return-6b-20261114]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumo-unchanged-6b-diagnostic-${{ github.ref_name }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  QA_SOURCE: ${{ github.sha }}
  CANDIDATE_SOURCE: 6b3047b7979dfb86d837e74a21b0fd890e4f9e66
  NATIVE_SOURCE: 84789d0c2c6fb4b6ecd2897ce1951b89f958b604
jobs:
  probe-contracts:
    if: >-
      github.repository == 'Ullmann27/lumo-lernen' &&
      github.ref_name == 'qa/lumo-village-return-6b-20261114' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: unchanged-6b-probe-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.QA_SOURCE }}
      - name: Verify source binding and actual observation contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/android_qa/tests
        run: |
          set -euo pipefail
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          bash -n scripts/run_unchanged_6b_village_diagnostic.sh
          .probe-venv/bin/python -B -m unittest -v \
            scripts.tests.test_verify_unchanged_6b_village_diagnostic \
            tools.android_qa.tests.test_kart_garage_evidence \
            tools.android_qa.tests.test_kart_garage_observed_scroll \
            tools.android_qa.tests.test_kart_scroll_word_evidence \
            tools.android_qa.tests.test_kart_driver_word_evidence \
            tools.android_qa.tests.test_village_android_evidence \
            scripts.tests.test_6b_roundtrip_diagnostic \
            tools.android_qa.tests.test_connect_four_probe_deadlines \
            2>&1 | tee diagnostic-contracts.log
          if grep -Eq '^OK \(skipped=|^FAILED.*skipped=' diagnostic-contracts.log; then
            echo 'Diagnostic contracts cannot be skipped.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-6b-roundtrip-diagnostic-probe-contracts
          path: diagnostic-contracts.log
          if-no-files-found: error
          retention-days: 30

  android-diagnostic:
    needs: [probe-contracts]
    name: unchanged-6b-${{ matrix.case }}-api35
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: main
            minutes: 80
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      - name: Checkout the actual diagnostic observer
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.QA_SOURCE }}
      - name: Checkout the unchanged APK source independently
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 6b3047b7979dfb86d837e74a21b0fd890e4f9e66
          path: candidate-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config/godot-source.json
            /pubspec.yaml
      - name: Download the exact original 2020 candidate without rebuilding
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14125990109'
          merge-multiple: true
          run-id: 43616038272
          github-token: ${{ github.token }}
          path: candidate/dist/
      - name: Download the exact original 2017 baseline for the update
        if: matrix.case == 'update2017'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13948686178'
          merge-multiple: true
          run-id: 43220602252
          github-token: ${{ github.token }}
          path: baseline/dist/
      - name: Install the existing real UI readers
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p tour
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          tesseract --list-langs 2>&1 | tee tour/tesseract-installed-languages.txt
          grep -Fxq 'deu' tour/tesseract-installed-languages.txt
          grep -Fxq 'eng' tour/tesseract-installed-languages.txt
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
      - name: Preserve original candidate and diagnostic run metadata separately
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p tour/binding-inputs/candidate tour/binding-inputs/qa
          gh api 'repos/Ullmann27/lumo-lernen/actions/runs/43616038272' > tour/binding-inputs/candidate/run.json
          gh api 'repos/Ullmann27/lumo-lernen/actions/runs/43616038272/attempts/1/jobs?per_page=100' > tour/binding-inputs/candidate/jobs.json
          gh api 'repos/Ullmann27/lumo-lernen/actions/runs/43616038272/artifacts?per_page=100' > tour/binding-inputs/candidate/artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > tour/binding-inputs/qa/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > tour/binding-inputs/qa/jobs.json
          if [ "$DIAGNOSTIC_CASE" = update2017 ]; then
            mkdir -p tour/binding-inputs/baseline
            gh api 'repos/Ullmann27/lumo-lernen/actions/runs/43220602252' > tour/binding-inputs/baseline/run.json
            gh api 'repos/Ullmann27/lumo-lernen/actions/runs/43220602252/attempts/1/jobs?per_page=100' > tour/binding-inputs/baseline/jobs.json
            gh api 'repos/Ullmann27/lumo-lernen/actions/runs/43220602252/artifacts?per_page=100' > tour/binding-inputs/baseline/artifacts.json
          fi
          git rev-parse HEAD > tour/probe-source-sha.txt
          git -C candidate-source rev-parse HEAD > tour/apk-source-sha.txt
      - name: Bind exact sources, successful builds, original APKs and embedded PCKs
        env:
          DIAGNOSTIC_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          baseline_args=()
          if [ "$DIAGNOSTIC_CASE" = update2017 ]; then
            baseline_args=(--baseline "$GITHUB_WORKSPACE/baseline/dist/x86_64/Lumo-Lernen-Neu.apk"
              --baseline-metadata-dir "$GITHUB_WORKSPACE/tour/binding-inputs/baseline")
          fi
          .probe-venv/bin/python scripts/verify_unchanged_6b_village_diagnostic.py \
            --qa-source "$GITHUB_WORKSPACE" --candidate-source "$GITHUB_WORKSPACE/candidate-source" \
            --candidate-metadata-dir "$GITHUB_WORKSPACE/tour/binding-inputs/candidate" \
            --qa-metadata-dir "$GITHUB_WORKSPACE/tour/binding-inputs/qa" \
            --expected-qa-source "$QA_SOURCE" --expected-qa-run "$GITHUB_RUN_ID" \
            --expected-qa-attempt "$GITHUB_RUN_ATTEMPT" --qa-job-name "unchanged-6b-${DIAGNOSTIC_CASE}-api35" \
            --apk "$GITHUB_WORKSPACE/candidate/dist/x86_64/Lumo-Lernen-Neu.apk" \
            --provenance "$GITHUB_WORKSPACE/candidate/dist/x86_64/BUILD-PROVENANCE.json" \
            --sums "$GITHUB_WORKSPACE/candidate/dist/ANDROID-TOUR-SHA256SUMS.txt" \
            "${baseline_args[@]}" --out "$GITHUB_WORKSPACE/tour/candidate-and-probe-binding.json"
      - name: Enable the existing disposable KVM emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Start the same software display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > tour/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > tour/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -i 'OpenGL renderer string' tour/mesa-renderer.txt
      - name: Run the actual API35 main tour then direct Village and C4 roundtrips
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash "$GITHUB_WORKSPACE/scripts/run_unchanged_6b_village_diagnostic.sh" "${{ matrix.case }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-6b-roundtrip-diagnostic-${{ matrix.case }}-api35
          path: tour/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

