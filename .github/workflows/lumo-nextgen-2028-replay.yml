name: LUMO 2028 – complete Android replay of immutable corrected APK

on:
  push:
    branches: [qa/lumo-nextgen-2028-android-20261116]
    paths: [config/nextgen-2028-replay.json]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumo-2028-android-replay-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  LUMO_EXPECTED_SOURCE: fc5f6403cb8fb5e26a103ec2deeaa3662c5fa242
  LUMO_EXPECTED_NATIVE: 678cb38fea3a83a7f5841e71fba9bb2f3bfa2eef
  LUMO_EXPECTED_SHA256: 6b3a2f62ea80144b5af397e6353d1a52f2210109531a1edd49a1b22ec2bc4fa9
  LUMO_EXPECTED_VERSION: '2028'
  LUMO_EXPECTED_VERSION_NAME: 0.13.16
  LUMO_CERTIFICATE: a6b1ef61bf59db4e0794c742aeb3b5506d130f4d21175c9975140e6acdb80702

jobs:
  android-replay:
    if: github.repository == 'Ullmann27/lumo-lernen' && github.ref_name == 'qa/lumo-nextgen-2028-android-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            .github/probes
            .github/workflows
            config
            scripts
            tools/android_qa
            tools/nextgen
      - name: Verify source boundary and download the exact existing 2028 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/probes/lumo_nextgen_2028_replay_reference_android_probe.py download
          --candidate candidate/x86 --out evidence/download --qa-commit "$GITHUB_SHA"
          --workflow-run-id "$GITHUB_RUN_ID"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Prepare the proven Android readers and software renderer
        run: |
          set -euo pipefail
          mkdir -p evidence/emulator
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 ffmpeg tesseract-ocr tesseract-ocr-deu
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Check unchanged acceptance gates and the new identity and permission readers
        run: |
          set -euo pipefail
          mkdir -p evidence/checkers
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_nextgen_learning_android_probe.py' -v 2>&1 | tee evidence/checkers/original-gates.log
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_nextgen_reference_android_probe.py' -v 2>&1 | tee evidence/checkers/reference-gates.log
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_nextgen_current_candidate.py' -v 2>&1 | tee evidence/checkers/current-gates.log
          .probe-venv/bin/python -c 'from pathlib import Path; assert list(Path("tools/android_qa/tests").glob("test_nextgen_2028*.py")), "2028 replay gate tests are missing"'
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_nextgen_2028*.py' -v 2>&1 | tee evidence/checkers/replay-gates.log
          .probe-venv/bin/python -m unittest discover -s tools/nextgen -p 'test_prepare_2028_learning_replay_release.py' -v 2>&1 | tee evidence/checkers/publication-gates.log
      - name: Start the same real software display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > evidence/emulator/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > evidence/emulator/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -i 'OpenGL renderer string' evidence/emulator/mesa-renderer.txt
      - name: Run the complete original tour then the native Banane and pattern routes
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: bash .github/probes/run_lumo_nextgen_2028_replay_android.sh
      - name: Verify both independently retained complete Android results
        run: >-
          python3 .github/probes/lumo_nextgen_2028_replay_reference_android_probe.py verify
          --original evidence/android/original-android/learning-android-result.json
          --reference evidence/android/reference-android/reference-android-result.json
          --qa-commit "$GITHUB_SHA" --workflow-run-id "$GITHUB_RUN_ID"
          --out evidence/replay-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-nextgen-2028-replay-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: error
