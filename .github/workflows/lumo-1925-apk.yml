name: LUMO 1925 verified Android APK (voice and writing)
# Build includes repaired compiler errors and the full-size pointer ink target.
on:
  push:
    branches:
      - chatgpt/lumo-1925-apk-build-2026-10-10
    paths:
      - .github/workflows/lumo-1925-apk.yml
  workflow_dispatch:

concurrency:
  group: lumo-1925-delivery
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  verified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      LUMO_NDK_DISPOSABLE_RUNNER: '1'
    steps:
      - name: Checkout exact Lumo Android build branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 30
      - name: Record and validate source, build number and predecessors
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD | tee proof/build-source-sha.txt
          git merge-base --is-ancestor 7ecad048179cae5e68ae43f0f16d09f1a9a29cf0 HEAD
          test "$(sed -n 's/^version: //p' pubspec.yaml)" = "0.12.18+1925"
          git diff --exit-code --quiet HEAD --
          git status --porcelain --untracked-files=no > proof/tracked-before.txt
          test ! -s proof/tracked-before.txt
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Prepare pinned NDK and record evidence
        run: |
          set -euo pipefail
          bash scripts/install_ndk_for_build.sh proof/ndk-preflight 2>&1 | tee proof/ndk.log
      - name: Resolve Flutter dependencies without changing lockfile
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee proof/pub-get.log
      - name: Analyze source (fatal errors block)
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee proof/flutter-analyze.log
      - name: Test voice and all updated writing surfaces
        run: |
          set -euo pipefail
          flutter test --no-pub --timeout=75s --reporter=expanded --concurrency=2 \
            test/lumo_voice_clips_test.dart \
            test/lumo_voice_dialogue_variation_test.dart \
            test/lumo_ink_surface_regression_test.dart \
            test/writing_accuracy_regression_test.dart \
            test/other_subject_generator_regression_test.dart \
            2>&1 | tee proof/targeted-tests.log
      - name: Verify backend and writing-content audits
        run: |
          set -euo pipefail
          node --test server/lumo-ai-proxy/test/*.test.js 2>&1 | tee proof/backend-tests.log
          dart scripts/audit_content.dart 2>&1 | tee proof/content-audit.log
      - name: Install Godot 4.6.3 from pinned upstream
        run: bash scripts/install_godot_for_build.sh
      - name: Build integrated Flutter and Godot signed release APK
        run: |
          set -euo pipefail
          bash scripts/build_unified_apk.sh 2>&1 | tee proof/android-build.log
      - name: Verify APK architecture, identity, signature, and hashes
        run: |
          set -euo pipefail
          test -s dist/Lumo-Lernen-Neu.apk
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk | tee proof/apk-verification.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          info = json.loads(Path('dist/APK-VERIFICATION.json').read_text())
          assert info['package'] == 'dev.ullmann.lumo.lumo_lernen.coachpreview'
          assert info['versionCode'] == 1925
          assert info['versionName'] == '0.12.18'
          assert info['elf16KiBAligned'] is True
          assert info['resourcesArscAligned'] is True
          assert set(info['abis']) == {'arm64-v8a','x86_64'}
          Path('proof/apk-identity.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
      - name: Upload APK and complete provenance
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-Lernen-Neu-0.12.18-1925-APK
          path: |
            dist/Lumo-Lernen-Neu.apk
            dist/SHA256SUMS.txt
            dist/APK-VERIFICATION.json
            dist/BUILD-PROVENANCE.json
            proof/build-source-sha.txt
            proof/apk-identity.json
            proof/targeted-tests.log
            proof/flutter-analyze.log
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish separate installable APK test release (not Play Store)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=lumo-0.12.18-1925-voice-writing
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing APK release" >&2
            exit 1
          fi
          gh release create "$TAG" \
            dist/Lumo-Lernen-Neu.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Lumo Lernen Neu 0.12.18 (Build 1925) – Android Test" \
            --notes "Test-APK: Original-Lumo-Sulafat-Aufnahmen wieder aktiv, differenzierte Lernreaktionen, Buchstaben-Anzeige, stabile Schreibfläche, korrigierte Sterne/XP. Quelle: $GITHUB_SHA. Paketkennung: dev.ullmann.lumo.lumo_lernen.coachpreview. Signatur im APK-VERIFICATION.json des CI-Artefakts. Zusätzlich erzeugte Audiozeilen sind noch nicht als Aufnahme enthalten. Kein Play-Store-Release." \
            --prerelease --latest=false
          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease | tee proof/release.json
      - name: Preserve diagnostic logs when compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-1925-Build-Diagnose
          path: proof/
          if-no-files-found: warn
          retention-days: 14
