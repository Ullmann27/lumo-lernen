name: Lumo 1938 exact Android16 Kart smoke
on:
  push:
    branches: [chatgpt/lumo-1938-android-smoke-2026-10-12]
    paths: [.github/workflows/lumo-1938-android-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  LUMO_EXPECT_SOURCE: '5fe56eb111f5d44a69ba98ef5424033afa6f417b'
  LUMO_EXPECT_GODOT: 'ec96515a2e359d21e9591120fc81dfd15116e81e'
  LUMO_EXPECT_VERSION: '1938'
  LUMO_EXPECT_ANDROID_API: '36'
  LUMO_FOLD_PROBE: '0'
  LUMO_FINAL_BUILD_RUN: '38254745157'
  LUMO_BASE_BUILD_RUN: '38238926882'

jobs:
  android-kart-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.LUMO_EXPECT_SOURCE }}

      - name: Wait for exact final 1938 build
        uses: actions/github-script@v7
        with:
          script: |
            const runId=Number(process.env.LUMO_FINAL_BUILD_RUN);
            const deadline=Date.now()+30*60*1000;
            while (true) {
              const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:runId})).data;
              if (run.status==='completed') {
                if (run.conclusion!=='success') throw new Error('Final 1938 build did not succeed');
                if (run.head_sha!==process.env.LUMO_EXPECT_SOURCE) throw new Error('Final build source SHA mismatch');
                break;
              }
              if (Date.now()>deadline) throw new Error('Timed out waiting for final 1938 build');
              await new Promise(r=>setTimeout(r,30000));
            }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.LUMO_BASE_BUILD_RUN }}
          name: lumo-education-1937-emulator-${{ env.LUMO_BASE_BUILD_RUN }}
          path: baseline/

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.LUMO_FINAL_BUILD_RUN }}
          name: lumo-education-1938-emulator-${{ env.LUMO_FINAL_BUILD_RUN }}
          path: candidate/

      - name: Verify immutable APK provenance and install probe dependencies
        run: |
          set -euo pipefail
          mkdir -p android-proof
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          base=json.loads(Path('baseline/BUILD-PROVENANCE.json').read_text())
          candidate=json.loads(Path('candidate/BUILD-PROVENANCE.json').read_text())
          assert base['versionCode']==1937 and base['abis']==['x86_64']
          assert candidate['versionCode']==1938 and candidate['versionName']=='0.12.31'
          assert candidate['flutter_source_commit']==os.environ['LUMO_EXPECT_SOURCE']
          assert candidate['godot']['revision']==os.environ['LUMO_EXPECT_GODOT']
          assert candidate['abis']==['x86_64'] and candidate['tracked_source_clean'] is True
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('LUMO_BASE_DIGEST='+base['sha256']+'\n')
          PY
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y             ripgrep tesseract-ocr tesseract-ocr-deu xvfb mesa-utils             libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check             uiautomator2==3.7.0 Pillow==12.3.0
          .probe-venv/bin/python -m py_compile .github/probes/creative_android_probe.py

      - name: Disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Actual software OpenGL surface
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 2500x2200x24 -nolisten tcp +extension GLX > android-proof/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > android-proof/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          rg -i 'OpenGL renderer string:.*llvmpipe' android-proof/mesa-renderer.txt

      - name: Existing Android16 image
        timeout-minutes: 11
        run: python3 tools/android_qa/prepare_system_image.py --api 36 --out android-proof/system-image --timeout 600

      - name: Actual 1937 to 1938 update and native Kart race start
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: .probe-venv/bin/python .github/probes/creative_android_probe.py --baseline baseline/Lumo-Lernen-Neu.apk --candidate candidate/Lumo-Lernen-Neu.apk --game-scope kart --out android-proof

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-1938-android-kart-smoke-${{ github.run_id }}
          path: android-proof/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
