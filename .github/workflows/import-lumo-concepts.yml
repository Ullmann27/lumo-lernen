name: Import Lumo gameplay design concepts
on:
  push:
    branches: [codex/lumo-reference-assets-2026-10-10]
    paths: ['.github/workflows/import-lumo-concepts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve-generated-concepts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Transfer exact rendered concept images for review
        shell: bash
        run: |
          set -euo pipefail
          dest=docs/design/2026-10-10-lumo-games/concepts
          mkdir -p "$dest"
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -o "$dest/lumo-kart-concept.png" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/20b330ae-6cf6-4fa1-be2f-6fe90f60a2de/7f9d8344-d0d5-4077-adf5-559ed06f24d4/Create_ONE_spectacular_production_quality_game_UI_concept_sc.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTkyNjE0YjJhZWExMzQxNiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTcyMzMxNH0.tdI4Akl9R2hRTFJPX-Z6JGjJmktA9jrSPNiWmhQ_FQ4'
          test "$(stat -c '%s' "$dest/lumo-kart-concept.png")" -gt 4096
          file "$dest/lumo-kart-concept.png"
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -o "$dest/lumo-cards-concept.png" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/5fdfefce-9bbf-4a56-a5eb-147cd536ab5e/f4e068fb-9f80-4005-ad6e-06c121806ed7/One_single_premium_16_9_mobile_game_screenshot_concept_for__.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjFmNDY1YjcyZjRiNzBjMCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc1Nzg3OX0.kT7ndDtwhsc3ASX0pSW-Ge8A27JOsgSmGtnolicb-7c'
          test "$(stat -c '%s' "$dest/lumo-cards-concept.png")" -gt 4096
          file "$dest/lumo-cards-concept.png"
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -o "$dest/lumo-build-concept.png" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/5efac796-2799-4e57-a9a5-32eb164ce0bf/4360ca25-9e74-46cf-90fb-d454f86942c8/One_single_stunning_16_9_premium_working_game_screenshot_con.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODg4MTFhMjc2YzdmYTdhNiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTcyMDYxNX0.Ygn4hpIJH2KEMci-hVldaYHB65QvmWtbzv70V9oLPw8'
          test "$(stat -c '%s' "$dest/lumo-build-concept.png")" -gt 4096
          file "$dest/lumo-build-concept.png"
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -o "$dest/lumo-4-gewinnt-concept.png" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/906dff06-604f-4f78-8ab2-1c3e22bc879f/4c8a3e59-2fc0-42e6-8fa9-0edd2cba070c/One_single_exceptionally_beautiful_actual_play_mobile_game_U.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNzViMGE2MTUxMzIyNDhkMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc3NTEyNX0.bwnVCKa6tiQdNbkXCRKYxcljEdAvgiB680hE6aPeIPs'
          test "$(stat -c '%s' "$dest/lumo-4-gewinnt-concept.png")" -gt 4096
          file "$dest/lumo-4-gewinnt-concept.png"
          test "$(find "$dest" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m 'assets: archive four rendered Lumo gameplay concept images'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
