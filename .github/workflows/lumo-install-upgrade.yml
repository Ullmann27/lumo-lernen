name: Lumo preview installation repair

on:
  push:
    branches: [chatgpt/install-upgrade-2026-10-07]
    paths:
      - .github/workflows/lumo-install-upgrade.yml
      - config/install-upgrade-2026-10-07.json
      - scripts/probes/install_upgrade_20261007.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumo-install-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Read reserved forward version and record source
        run: |
          mkdir -p install-evidence
          git rev-parse HEAD > install-evidence/source-sha.txt
          flutter --version > install-evidence/flutter-version.txt
          cp config/install-upgrade-2026-10-07.json install-evidence/policy.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('config/install-upgrade-2026-10-07.json').read_text())
          if p['version_code'] <= max(map(int,p['previous_builds'])):
              raise RuntimeError('Refusing downgrade delivery')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('LUMO_BUILD_NUMBER='+str(p['version_code'])+'\n')
              env.write('LUMO_VERSION_NAME='+p['version_name']+'\n')
          PY
          python3 -m py_compile scripts/probes/install_upgrade_20261007.py
      - name: Fetch exact prior 1291 candidate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37345802156
          name: lumo-probe-apk-37345802156-1
          path: previous/1291/
      - name: Fetch exact reported build 280
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37566239982
          name: lumo-pr207-apk-37566239982
          path: previous/280/
      - name: Resolve only committed dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee install-evidence/dependencies.log
      - name: Test backend and Android preparation
        shell: bash
        run: |
          set -euo pipefail
          node --test server/lumo-ai-proxy/test/*.test.js 2>&1 | tee install-evidence/backend.log
          python3 -m unittest discover -s scripts/tests 2>&1 | tee install-evidence/android-preparation.log
          dart scripts/audit_content.dart 2>&1 | tee install-evidence/content-audit.log
      - name: Analyze and run complete Flutter suite
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee install-evidence/analyze.log
          flutter test --no-pub --reporter=expanded --timeout=60s --concurrency=2 2>&1 | tee install-evidence/flutter-tests.log
      - name: Build with original package, test key and Godot source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_godot_for_build.sh 2>&1 | tee install-evidence/godot-install.log
          bash scripts/build_unified_apk.sh 2>&1 | tee install-evidence/build.log
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk | tee install-evidence/new-verification.json
          python3 scripts/probes/install_upgrade_20261007.py verify
      - name: Upload built candidate and identity proofs (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: lumo-install-candidate-${{ github.run_id }}
          path: |
            dist/Lumo-Lernen-Neu.apk
            dist/APK-VERIFICATION.json
            dist/BUILD-PROVENANCE.json
            dist/SHA256SUMS.txt
            dist/LAUNCHER-RESOURCES.json
            install-evidence/package-comparison.json
            install-evidence/source-sha.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve actual build evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-install-build-evidence-${{ github.run_id }}
          path: install-evidence/
          if-no-files-found: error
          retention-days: 14

  update:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: '280'
            api: 35
          - baseline: '1291'
            api: 36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: lumo-install-candidate-${{ github.run_id }}
          path: candidate/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37345802156
          name: lumo-probe-apk-37345802156-1
          path: previous/1291/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37566239982
          name: lumo-pr207-apk-37566239982
          path: previous/280/
      - name: Install isolated test-only UI adapter
        run: |
          mkdir -p upgrade-evidence
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0
          .probe-venv/bin/python -m pip freeze > upgrade-evidence/probe-dependencies.txt
          cp config/install-upgrade-2026-10-07.json upgrade-evidence/policy.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real update without uninstall or clearing app data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: .probe-venv/bin/python scripts/probes/install_upgrade_20261007.py smoke --baseline ${{ matrix.baseline }} --new candidate/dist --comparison candidate/install-evidence/package-comparison.json --out upgrade-evidence
      - name: Preserve real installer logs, screenshots and profile checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-install-from-${{ matrix.baseline }}-api${{ matrix.api }}-${{ github.run_id }}
          path: upgrade-evidence/
          if-no-files-found: error
          retention-days: 14

  acceptance:
    needs: [build, update]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record acceptance only after both update jobs succeeded
        run: |
          mkdir acceptance
          printf '%s\n' \
            'Source SHA: ${{ github.sha }}' \
            'Run: ${{ github.run_id }}' \
            'APK identity/signature/version/provenance: PASS' \
            'Update build280 -> build1400, API35: PASS' \
            'Update build1291 -> build1400, API36: PASS' \
            '1291 -> 280 downgrade rejection reproduced: PASS' \
            'Existing fictional profile retained, restart and repeat install: PASS' \
            'No uninstall, no clear-data, no downgrade/signature bypass.' \
            'Specific user-phone cause, Samsung installer and physical ARM64 device: NOT TESTED.' \
            'No merged parallel PR204/PR206 or new gameplay/visual completion claim.' \
            > acceptance/ACCEPTANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-install-acceptance-${{ github.run_id }}
          path: acceptance/
          if-no-files-found: error
          retention-days: 14
