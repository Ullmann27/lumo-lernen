name: Lumo installation lane coordination (no APK build)

on:
  push:
    branches: [chatgpt/android-install-upgrade-2026-10-07]
    paths: [.github/workflows/lumo-install-upgrade.yml]
  workflow_dispatch:

permissions:
  contents: read

# This branch previously built a competing 1335 preview. Supersede only that
# branch's run, not the separate PR208 installation or PR204/206 integration.
concurrency:
  group: lumo-install-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No additional APK is built or published from this lane
        run: |
          printf '%s\n' \
            'PR208 version 1400 is the single delivery candidate.' \
            'PR209 1335 experiment is diagnostic only; no user delivery.' \
            '1321 baseline adds independent update verification of that same artifact.' \
            'Do not merge the two differently authored workflow files blindly.' \
            'See issue170 comment6031617709; no main/other-branch writes.'
