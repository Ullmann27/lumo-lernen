name: Lumo 1980 phone APK download
on:
  push:
    branches:
      - codex/lumo-learning-lab-2026-10-18
    paths:
      - .github/workflows/lumo-1980-mobile-apk-download.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-private-draft:
    if: github.repository == 'Ullmann27/lumo-lernen'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch the exact previously built ARM64 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 39129428544 --repo Ullmann27/lumo-lernen \
            --name lumo-1980-arm64-verified --dir dist
          test -s dist/Lumo-Lernen-Neu.apk
          test -s dist/APK-SHA256.txt
          test -s dist/BUILD-PROVENANCE.json
      - name: Verify bytes, ABI, version and pinned game source
        run: |
          set -euo pipefail
          sha256sum -c dist/APK-SHA256.txt
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path('dist/Lumo-Lernen-Neu.apk')
          data = json.loads(Path('dist/BUILD-PROVENANCE.json').read_text())
          actual = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert actual == '91a77f8e9a528ed485beb272cf1226791094c2d0b74f1f4828d5c618b4f4551b' == data['sha256'], 'SHA-256 mismatch'
          assert data['versionCode'] == 1980, 'Wrong APK build'
          assert data['versionName'] == '0.12.68', 'Wrong APK version'
          assert data['godot']['revision'] == '20652880eda687c67cfa72301dad5a173b1fe6c5'
          assert 'arm64-v8a' in data['abis'], 'Not ARM64'
          print('PASS exact verified source artifact: ' + actual)
          PY
          cp dist/Lumo-Lernen-Neu.apk dist/Lumo-Lernen-1980-ARM64.apk
      - name: Publish downloadable asset in an owner-only draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=lumo-v0.12.68-1980-mobile-test
          ASSET=dist/Lumo-Lernen-1980-ARM64.apk
          if gh release view "$TAG" --repo Ullmann27/lumo-lernen >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo Ullmann27/lumo-lernen --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --repo Ullmann27/lumo-lernen \
              --target 8617e4ab9f647939b1205121bc257c141e905403 \
              --title 'Lumo Lernen + Lumo Kart 1980 – Android-Testdownload' \
              --notes 'Build 1980 / version 0.12.68. Authentische ARM64-APK aus GitHub Actions run 39129428544; sha256 91a77f8e9a528ed485beb272cf1226791094c2d0b74f1f4828d5c618b4f4551b. Gemeinsame Flutter-/Godot-Paketierung erfolgreich. Der separate Android-Tour-Job ist beim Scroll-/Profil-Begrüßungstest fehlgeschlagen; Lernatelier, Kart-Start, Rennen, Fahrt und Rückkehr wurden nachgewiesen. Testversion, nicht als finaler Release freigegeben.' \
              --draft --prerelease
          fi
          gh release view "$TAG" --repo Ullmann27/lumo-lernen \
            --json url,isDraft,assets \
            --jq '{url: .url, draft: .isDraft, assets: [.assets[].name]}'
