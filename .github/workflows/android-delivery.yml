name: Transfer completed Android QA deliverables

on:
  push:
    branches: ['codex/lumo-unified-android-2026-10-03']
    paths: ['.github/workflows/android-delivery.yml']
  workflow_dispatch:
    inputs:
      runId:
        description: 'Completed Android integration QA run ID'
        required: true
        type: string
      qaCommit:
        description: 'Full QA commit SHA belonging to that completed run'
        required: true
        type: string

permissions:
  # GitHub only lists unpublished drafts to credentials with push access.
  # The transfer script itself only performs GET/download operations.
  contents: write
  actions: read

jobs:
  transfer:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[lumo-export-280]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QA_RUN_ID: ${{ github.event_name == 'push' && '37174626790' || inputs.runId }}
      QA_COMMIT: ${{ github.event_name == 'push' && 'e332e24104345b1d851e2903939c3336ea5dc995' || inputs.qaCommit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the complete Android QA helper suite before transfer
        run: |
          python3 -m pip install Pillow
          python3 -m unittest discover -s tools/android_qa/tests -p 'test_*.py' -v
      - name: Wait only for the explicitly selected QA run to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          repository = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['QA_RUN_ID']
          expected = os.environ['QA_COMMIT']
          if not run_id.isdigit():
              raise SystemExit('Invalid QA run ID')
          deadline = time.monotonic()+55*60
          previous = None
          while time.monotonic() < deadline:
              run = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{repository}/actions/runs/{run_id}'
              ], text=True, timeout=30))
              if (run.get('head_sha') != expected or
                  run.get('path') != '.github/workflows/android-integration-qa.yml' or
                  run.get('head_branch') != 'codex/lumo-unified-android-2026-10-03'):
                  raise SystemExit('Selected run does not match the expected QA source')
              status = (run.get('status'), run.get('conclusion'))
              if status != previous:
                  print(json.dumps({'qa_run_id': int(run_id), 'status': status[0],
                                    'conclusion': status[1]}), flush=True)
                  previous = status
              if status[0] == 'completed':
                  break
              time.sleep(30)
          else:
              raise SystemExit('Selected QA run did not finish within the bounded transfer wait')
          PY
      - name: Read the completed run, its evidence and its byte-identical APK only on success
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/android_qa/export_delivery.py
          --repository "$GITHUB_REPOSITORY"
          --run-id "$QA_RUN_ID"
          --expected-head "$QA_COMMIT"
          --release-tag unified-build-280
          --sha256 3c01ba849139583be0b41ef2195e67f68373ebb18d720ce2d1ad1bd638523f48
          --out delivery
      - name: Include the current read-only QA source for offline regression replay
        run: |
          mkdir -p delivery/qa-source
          cp -R tools/android_qa delivery/qa-source/
          git rev-parse HEAD > delivery/qa-source/SOURCE-COMMIT.txt
          find delivery/qa-source -type d -name __pycache__ -prune -exec rm -rf {} +
      # Transfer only: no release publishing, APK signing, rebuild or promotion.
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-android-280-${{ env.QA_RUN_ID }}
          path: delivery/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
