              rows = re.findall(r'^\[KartAquarium\] (LOW|HIGH): (\d+) batched props, (\d+) fish$', log, re.MULTILINE)
              assert rows == [('LOW', '292', '12'), ('HIGH', '324', '40')], mode
              assert log.splitlines().count(aquarium_pass) == 1, mode
              aquarium_runs[mode] = {quality: {'batched_props': int(props), 'fish': int(fish)}
                                      for quality, props, fish in rows}
          gpu_marker = '[KartAquarium] GPU instance clearance verified for the complete school motion envelope'
          assert (Path('exports/fold-controls') / 'aquarium-rendered.log').read_text().splitlines().count(gpu_marker) == 1
          driven_rows = re.findall(r'^\[KartAquariumCapture\] ([0-9]{2}-(?:low|high)-(?:entry|middle|exit)): '
                                   r'1280x720, ([0-9]+\.[0-9]+) metres driven$',
                                   (Path('exports/fold-controls') / 'aquarium-capture.log').read_text(), re.MULTILINE)
          aquarium_names = ('01-low-entry', '02-low-middle', '03-low-exit',
                            '04-high-entry', '05-high-middle', '06-high-exit')
          assert tuple(name for name, _ in driven_rows) == aquarium_names
          assert all(float(distance) >= 6.0 for _, distance in driven_rows)
          aquarium = {'runs': aquarium_runs, 'gpu_instance_clearance_verified': True,
                      'capture_driven_metres': {name: float(distance) for name, distance in driven_rows}}
          log_names = ('character-pose', 'face-depth', 'start-hero',
                       'fox-eyes', 'face-studio', 'lumo-face-capture', 'lumo-driver-4views',
                       'kart_reference_capture', 'visual',
                       'aquarium-headless', 'aquarium-rendered', 'aquarium-capture')
          report = {
              'status': 'PASS',
              'flutter_source_commit': (workspace / 'proof/source-sha.txt').read_text().strip(),
              'godot_source_commit': native_source,
              'measured_checks': measured_checks, 'aquarium': aquarium,
              'engine': subprocess.check_output(['godot', '--version'], text=True).strip(),
              'capture_scope': 'Actual Godot X11/gl_compatibility software renders; fixed inspection poses and menu/race fixtures',
              'physical_device_performance': 'NOT EXECUTED',
              'source_sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                                for name in source_paths},
              'log_sha256': {name + '.log': hashlib.sha256(
                  (Path('exports/fold-controls') / (name + '.log')).read_bytes()).hexdigest()
                  for name in log_names},
              'captures': captures,
          }
          (output / 'CHARACTER-EVIDENCE.json').write_text(json.dumps(report, indent=2) + '\n')
          print(f'[LumoCharacterEvidence] PASS: {len(captures)} source-bound PNGs from {native_source}')
