          apk.rename(candidate / filename)
          (candidate / 'SHA256SUMS.txt').write_text(f'{actual_sha}  {filename}\n')
          (candidate / 'QA-RESULTS.json').write_text(json.dumps({
              'status': 'PASS', 'apk_file': filename, 'apk_sha256': actual_sha,
              'flutter_source_commit': source, 'godot_source_commit': pin['revision'],
              'profile_identity_evidence_sha256': hashlib.sha256(profile_path.read_bytes()).hexdigest(),
              'profile_widget_capture_evidence_sha256': hashlib.sha256(profile_capture_path.read_bytes()).hexdigest(),
              'workflow_run': f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/{run_id}",
              'verified_jobs': [{'name': job['name'], 'job_id': job['id'],
                                 'url': job['html_url'], 'conclusion': job['conclusion']}
                                for job in checked],
              'physical_device_performance': 'NOT EXECUTED',
          }, indent=2) + '\n')
          print(f'PASS: exact APK {filename}, {len(character["captures"])} character frames and all seven required jobs')
