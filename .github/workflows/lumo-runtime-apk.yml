      - uses: actions/upload-artifact@v4
        with:
          name: LUMO-Lernen-${{ needs.verify-and-build.outputs.version-name }}-${{ needs.verify-and-build.outputs.build-number }}-Android-APK
          path: candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
