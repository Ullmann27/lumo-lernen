          test "$(grep -Ec '^CONNECT_FOUR_RETURN_' "$native_logs/connect-four-return.log")" -eq 1
          if grep -En "ERROR:|SCRIPT ERROR:|Parse Error:" "$native_logs/connect-four-return.log"; then
            echo "Connect Four return regression emitted an engine error" >&2
            exit 1
          fi
          test "$(git -C "$native_source" rev-parse HEAD)" = "$native_revision"
          git -C "$native_source" diff --exit-code HEAD -- scripts/games/connect_four/connect_four_table.gd scripts/tests/connect_four_return_regression.gd
      - name: Require actual Dream gates on the exact pinned native source
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GIT_OPTIONAL_LOCKS: '0'
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.ci-python/bin:$PATH"
          native_revision="$(python3 -c 'import json; print(json.load(open("config/godot-source.json"))["revision"])')"
          native_source="$RUNNER_TEMP/lumo-native-acceptance"
          native_logs="$GITHUB_WORKSPACE/acceptance-native"
          dream_logs="$native_logs/dream"
          test "$(git -C "$native_source" rev-parse HEAD)" = "$native_revision"
          test "$(git -C "$native_source" rev-parse HEAD:tools/verify_dream_rasters.py)" = da8eed7d6383fcbc82a03596518a5fcc3b9a00c5
          printf '%s  %s\n' f7296a802d15c382dbcc77640373a0f53e30306fcaab3de869549ff1656de89d "$native_source/tools/verify_dream_rasters.py" | sha256sum -c -
          test ! -e "$dream_logs" && test ! -L "$dream_logs"
          test ! -e "$native_logs/dream-verifier-original.py" && test ! -L "$native_logs/dream-verifier-original.py"
          cp "$native_source/tools/verify_dream_rasters.py" "$native_logs/dream-verifier-original.py"
          cmp "$native_source/tools/verify_dream_rasters.py" "$native_logs/dream-verifier-original.py"
          cd "$native_source"
          python3 -c 'from PIL import Image; print("Pinned-native Dream raster verification ready")'
          LUMO_DREAM_LOG_DIR="$dream_logs" LUMO_EXPECTED_NATIVE_SHA="$native_revision" \
            bash tools/validate_dream_connections.sh 2>&1 | tee "$native_logs/dream-runner.log"
      - name: Verify connected dream ambience and garden on exact native source
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.ci-python/bin:$PATH"
          native_revision="$(python3 -c 'import json; print(json.load(open("config/godot-source.json"))["revision"])')"
          native_source="$RUNNER_TEMP/lumo-native-acceptance"
          native_logs="$GITHUB_WORKSPACE/acceptance-native"
          test "$(git -C "$native_source" rev-parse HEAD)" = "$native_revision"
          export XDG_DATA_HOME="$native_logs/user-data"
          export XDG_CONFIG_HOME="$native_logs/user-config"
          export XDG_CACHE_HOME="$native_logs/user-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          cd "$native_source"
          LUMO_LIVE_LOG_DIR="$GITHUB_WORKSPACE/acceptance-native/live" bash tools/validate_live_connections.sh 2>&1 | tee "$native_logs/live-runner.log"
      - name: Require actual Discovery gates on the exact pinned native source
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GIT_OPTIONAL_LOCKS: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.ci-python/bin:$PATH"
          native_revision="$(python3 -c 'import json; print(json.load(open("config/godot-source.json"))["revision"])')"
          native_source="$RUNNER_TEMP/lumo-native-acceptance"
          native_logs="$GITHUB_WORKSPACE/acceptance-native"
          discovery_logs="$native_logs/discovery"
          native_tree="$(git -C "$native_source" rev-parse "$native_revision^{tree}")"
          test "$(git -C "$native_source" rev-parse HEAD)" = "$native_revision"
          test "$(git -C "$native_source" rev-parse 'HEAD^{tree}')" = "$native_tree"
          test -z "$(git -C "$native_source" status --porcelain --untracked-files=no)"
          test ! -e "$discovery_logs" && test ! -L "$discovery_logs"
          bind_native_discovery_helper() {
            local name="$1" blob="$2" sha="$3"
            test ! -L "$native_source/tools/$name"
            test "$(git -C "$native_source" rev-parse "$native_revision:tools/$name")" = "$blob"
            test "$(git -C "$native_source" hash-object "tools/$name")" = "$blob"
            printf '%s  %s\n' "$sha" "$native_source/tools/$name" | sha256sum -c -
          }
          bind_native_discovery_helper verify_discovery_connections.py c00ca9873106c974d66282cddfdcfaf5eb3bbebc 5edab9f77acaa4114281b74166eec3dbf306eb5b574f677c03190a379081dfaf
          bind_native_discovery_helper collect_discovery_connections.py 1ebdec66300dfb87bf9287d194525d3c374c8aee bfc9f32c8287849047e9f7babf400c107d790aecb21a45be16d45fa7302a3f83
          bind_native_discovery_helper verify_discovery_rasters.py 219e691fc8aa119cc80221b3db6c77e63caf8bfe 55591b4478d2074135ea4950fb00200d68a3f9bede286b39642d7fc17aa586da
          bind_native_discovery_helper verify_dream_rasters.py da8eed7d6383fcbc82a03596518a5fcc3b9a00c5 f7296a802d15c382dbcc77640373a0f53e30306fcaab3de869549ff1656de89d
          bind_native_discovery_helper run_godot_probe.py c23859ece2d62101d000d7a89556fda5d3fe4105 e1836029a196e4dcd4a4f47fd8c2010c5b460ec5bf4c0578e90e75d3a5d2ea13
          cd "$native_source"
          python3 -c 'from PIL import Image; print("Pinned-native Discovery raster verification ready")'
          LUMO_EXPECTED_NATIVE_SHA="$native_revision" LUMO_EXPECTED_NATIVE_TREE="$native_tree" \
            python3 tools/collect_discovery_connections.py --project "$native_source" --output "$discovery_logs" \
              --expected-native-sha "$native_revision" --expected-native-tree "$native_tree" --godot "$(command -v godot)" \
            2>&1 | tee "$native_logs/discovery-collector.log"
          test "$(grep -Fxc '[DiscoveryOriginals] PASS 10 exact probes, 38 decoded PNGs and 2 original reports' "$native_logs/discovery-collector.log")" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-candidate-pinned-native-gameplay
          path: acceptance-native/
          if-no-files-found: warn
          retention-days: 30
      - name: Build unified real Android APK
        run: bash scripts/build_unified_apk.sh
      - name: Verify APK archive and collect reproducible source hashes
        run: |
          set -euo pipefail
          test -s dist/Lumo-Lernen-Neu.apk
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk --abi arm64-v8a
          sha256sum dist/Lumo-Lernen-Neu.apk | tee dist/APK-SHA256.txt
          test -s dist/APK-VERIFICATION.json
          test -s dist/BUILD-PROVENANCE.json
          python3 scripts/verify_unified_apk.py dist/x86_64/Lumo-Lernen-Neu.apk --abi x86_64
          sha256sum dist/x86_64/Lumo-Lernen-Neu.apk > dist/ANDROID-TOUR-SHA256SUMS.txt
          grep '^version:' pubspec.yaml | tee dist/APP-VERSION.txt
      - name: Upload exact candidate (no release or synthetic screenshots)
        id: upload-candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-integrated-2021-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deliver verified ARM64 APK separately for direct download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-integrated-2021-arm64-verified
          path: |
            dist/Lumo-Lernen-Neu.apk
            dist/APK-SHA256.txt
            dist/APK-VERIFICATION.json
            dist/BUILD-PROVENANCE.json
            dist/GODOT-SOURCE.json
            dist/APP-VERSION.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  android-c4:
    needs: [verify-and-build, android-host-compile, connect-four-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      NATIVE_REVISION: ${{ needs.connect-four-runtime.outputs.native-revision }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify-and-build.outputs.candidate-artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Ullmann27/lumo-godot
          ref: ${{ needs.connect-four-runtime.outputs.native-revision }}
          path: native-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
          merge-multiple: true
          path: candidate/dist/
      - name: Live UI reader
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p tour
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          command -v tesseract
          tesseract --list-langs 2>&1 | tee tour/tesseract-installed-languages.txt
          grep -Fxq 'deu' tour/tesseract-installed-languages.txt
          grep -Fxq 'eng' tour/tesseract-installed-languages.txt
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          python3 -m py_compile .github/probes/modernization_android_tour.py .github/probes/lumo_connect_four_android_probe.py .github/probes/lumo_village_android_probe.py
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_nextgen*.py' -v
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_studio*.py' -v
          sha256sum candidate/dist/x86_64/Lumo-Lernen-Neu.apk | tee tour/tested-apk-sha256.txt
      - name: Enable accelerated disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Software display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > tour/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > tour/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -i 'OpenGL renderer string' tour/mesa-renderer.txt
      - name: Read current original run jobs and exact upload metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tour/metadata
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > tour/metadata/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > tour/metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > tour/metadata/artifacts.json
      - name: Install and tour the exact APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          LUMO_NATIVE_STAGE_MENU: '1'
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell getprop ro.build.version.sdk > tour/android-sdk.txt
            adb shell getprop ro.build.version.release > tour/android-release.txt
            "$ANDROID_HOME/emulator/emulator" -version > tour/android-emulator-version.txt 2>&1
            .probe-venv/bin/python .github/probes/modernization_android_tour.py --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/dist/x86_64/BUILD-PROVENANCE.json --sums candidate/dist/ANDROID-TOUR-SHA256SUMS.txt --out tour/main
            .probe-venv/bin/python .github/probes/lumo_integrated_android_probe.py --game village --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/dist/x86_64/BUILD-PROVENANCE.json --sums candidate/dist/ANDROID-TOUR-SHA256SUMS.txt --prior-tour tour/main/tour-result.json --metadata-dir tour/metadata --expected-source "$SOURCE_SHA" --expected-native "$NATIVE_REVISION" --build-run "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --artifact-id "$CANDIDATE_ARTIFACT_ID" --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" --out tour/village
            .probe-venv/bin/python .github/probes/lumo_integrated_android_probe.py --game c4 --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/dist/x86_64/BUILD-PROVENANCE.json --sums candidate/dist/ANDROID-TOUR-SHA256SUMS.txt --prior-tour tour/main/tour-result.json --metadata-dir tour/metadata --expected-source "$SOURCE_SHA" --expected-native "$NATIVE_REVISION" --build-run "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --artifact-id "$CANDIDATE_ARTIFACT_ID" --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" --out tour/c4
            .probe-venv/bin/python .github/probes/lumo_quiz_android_probe.py --candidate-source . --native-source native-source --expected-source "$SOURCE_SHA" --expected-native "$NATIVE_REVISION" --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/dist/x86_64/BUILD-PROVENANCE.json --sums candidate/dist/ANDROID-TOUR-SHA256SUMS.txt --tour-result tour/main/tour-result.json --expected-api 35 --serial emulator-5554 --out tour/quiz
            .probe-venv/bin/python .github/probes/lumo_memory_android_probe.py --candidate-source . --native-source native-source --expected-source "$SOURCE_SHA" --expected-native "$NATIVE_REVISION" --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/dist/x86_64/BUILD-PROVENANCE.json --sums candidate/dist/ANDROID-TOUR-SHA256SUMS.txt --tour-result tour/main/tour-result.json --expected-api 35 --serial emulator-5554 --out tour/memory
            .probe-venv/bin/python .github/probes/lumo_english_objects_android_probe.py --candidate-source . --native-source native-source --expected-source "$SOURCE_SHA" --expected-native "$NATIVE_REVISION" --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/dist/x86_64/BUILD-PROVENANCE.json --sums candidate/dist/ANDROID-TOUR-SHA256SUMS.txt --tour-result tour/main/tour-result.json --expected-api 35 --serial emulator-5554 --out tour/english
      - name: Preserve complete actual main-tour and C4 Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-integrated-2021-android-c4
          path: tour/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  update-2021-from-2017:
    # Independent emulator and original baseline; the complete update remains
    # mandatory before this test candidate receives its verification report.
    needs: [verify-and-build]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
          merge-multiple: true
          path: candidate/dist/
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13948686178'
          merge-multiple: true
          path: baseline/dist/
          run-id: 43220602252
          github-token: ${{ github.token }}
      - name: Live UI reader
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p tour
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          command -v tesseract
          tesseract --list-langs 2>&1 | tee tour/tesseract-installed-languages.txt
          grep -Fxq 'deu' tour/tesseract-installed-languages.txt
          grep -Fxq 'eng' tour/tesseract-installed-languages.txt
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          python3 -m py_compile .github/probes/lumo_2003_update_android_probe.py .github/probes/lumo_2021_update_android_probe.py
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_update*preservation.py' -v
          sha256sum candidate/dist/x86_64/Lumo-Lernen-Neu.apk | tee tour/tested-apk-sha256.txt
      - name: Enable accelerated disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Software display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > tour/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > tour/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -i 'OpenGL renderer string' tour/mesa-renderer.txt
      - name: Preserve actual 2017 learning through an in-place 2021 upgrade
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
          LUMO_CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: .probe-venv/bin/python .github/probes/lumo_2021_update_android_probe.py --baseline baseline/dist/x86_64/Lumo-Lernen-Neu.apk --candidate candidate/dist/x86_64/Lumo-Lernen-Neu.apk --out tour
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-integrated-2021-in-place-update-proof
          path: tour/
          retention-days: 30

  verify-c4-candidate:
    needs: [verify-and-build, android-host-compile, connect-four-runtime, android-c4, update-2021-from-2017]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify-and-build.outputs.candidate-artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install actual signature manifest and raster verification tools
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          python3 -m venv .c4-verify
          .c4-verify/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
          merge-multiple: true
          path: candidate/dist/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-desktop-runtime
          path: proofs/runtime/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-android-host-compile
          path: proofs/host/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-android-c4
          path: proofs/android/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-in-place-update-proof
          path: proofs/update/
      - uses: actions/download-artifact@v4
        with:
          pattern: lumo-integrated-2021-nextgen-authority-*
          path: proofs/authorities/
          merge-multiple: false
      - name: Bind final original jobs and immutable candidate upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p proofs/metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > proofs/metadata/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > proofs/metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > proofs/metadata/artifacts.json
      - name: Reverify both signed APKs and every mandatory current C4 and update proof
        run: |
          set -euo pipefail
          .c4-verify/bin/python scripts/verify_integrated_candidate.py --source "$SOURCE_SHA" --build-run "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --artifact-id "$CANDIDATE_ARTIFACT_ID" --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" --candidate candidate/dist --runtime proofs/runtime/runtime --host-compile proofs/host --android proofs/android --update proofs/update --metadata proofs/metadata --authorities proofs/authorities --out C4-CANDIDATE-FACTS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-integrated-2021-candidate-verification
          path: |
            C4-CANDIDATE-FACTS.json
            proofs/metadata/
          if-no-files-found: error
          retention-days: 30

  prepare-c4-delivery:
    needs: [verify-and-build, android-host-compile, connect-four-runtime, android-c4, update-2021-from-2017, verify-c4-candidate]
    if: >-
      github.repository == 'Ullmann27/lumo-lernen' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'integration/lumo-complete-apk-20261114-7a1' &&
      needs.verify-and-build.result == 'success' &&
      needs.android-host-compile.result == 'success' &&
      needs.connect-four-runtime.result == 'success' &&
      needs.android-c4.result == 'success' &&
      needs.update-2021-from-2017.result == 'success' &&
      needs.verify-c4-candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      delivery-artifact-id: ${{ steps.upload-delivery.outputs.artifact-id }}
      delivery-artifact-digest: ${{ steps.upload-delivery.outputs.artifact-digest }}
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      NATIVE_REVISION: ${{ needs.connect-four-runtime.outputs.native-revision }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify-and-build.outputs.candidate-artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Ullmann27/lumo-godot
          ref: ${{ needs.connect-four-runtime.outputs.native-revision }}
          path: native-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Prepare actual APK signature and original raster verification
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          python3 -m venv .c4-delivery
          .c4-delivery/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
          merge-multiple: true
          path: candidate/dist/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-desktop-runtime
          path: proofs/runtime/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-android-host-compile
          path: proofs/host/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-android-c4
          path: proofs/android/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-in-place-update-proof
          path: proofs/update/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-candidate-verification
          path: proofs/final/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-build-contracts
          path: proofs/contracts/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-candidate-pinned-native-gameplay
          path: proofs/native/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-integrated-2021-learning-curriculum-audit
          path: proofs/learning/
      - uses: actions/download-artifact@v4
        with:
          pattern: lumo-integrated-2021-nextgen-authority-*
          path: proofs/authorities/
          merge-multiple: false
      - name: Read exact current original acceptance and release catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p proofs/publication-metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > proofs/publication-metadata/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > proofs/publication-metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > proofs/publication-metadata/artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > proofs/publication-metadata/pull.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > proofs/publication-metadata/releases.json
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/coachpreview-build-2021" > proofs/publication-metadata/tags.json
      - name: Reverify actual current APKs C4 update PCM and complete native originals
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C native-source rev-parse HEAD)" = "$NATIVE_REVISION"
          .c4-delivery/bin/python scripts/verify_integrated_delivery.py prepare \
            --source "$SOURCE_SHA" --build-run "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --pull-request "$PR_NUMBER" --artifact-id "$CANDIDATE_ARTIFACT_ID" --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --candidate candidate/dist --runtime proofs/runtime/runtime --host-compile proofs/host \
            --android proofs/android --update proofs/update --metadata proofs/publication-metadata \
            --facts proofs/final/C4-CANDIDATE-FACTS.json --build-contracts proofs/contracts \
            --native-evidence proofs/native --native-source native-source --learning-audit proofs/learning --authorities proofs/authorities --out delivery
      - name: Preserve the complete verified 2021 ARM64 delivery bundle without publication
        id: upload-delivery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-integrated-2021-delivery-bundle
          path: delivery/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve original verification evidence even when bundle preparation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-integrated-2021-delivery-verification
          path: |
            delivery/audit/
            delivery/publication-plan.json
            delivery/assets/C4-DELIVERY-FACTS.json
            delivery/assets/PUBLISH-VERIFICATION.json
            proofs/publication-metadata/
            proofs/learning/
            proofs/authorities/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
