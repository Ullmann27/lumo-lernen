name: LUMO complete 2021 signed Android candidate
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: lumo-integrated-2021-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  nextgen-authorities:
    name: Nextgen ${{ matrix.activity }} actual authority
    if: >-
      github.repository == 'Ullmann27/lumo-lernen' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'integration/lumo-complete-apk-20261114-7a1'
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    strategy:
      fail-fast: false
      matrix:
        activity: [english, quiz, memory]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: host-source
      - name: Resolve the exact candidate Host and configured Native commits
        id: sources
        env:
          EXPECTED_HOST: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY_SOURCES'
          import json, os, re, subprocess
          from pathlib import Path
          host = subprocess.check_output(['git', '-C', 'host-source', 'rev-parse', 'HEAD'], text=True).strip()
          assert host == os.environ['EXPECTED_HOST'] and re.fullmatch('[a-f0-9]{40}', host)
          pin = json.loads(Path('host-source/config/godot-source.json').read_text())
          assert pin['repository'] == 'https://github.com/Ullmann27/lumo-godot.git'
          assert pin['engine'] == '4.6.3' and re.fullmatch('[a-f0-9]{40}', pin['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('native=' + pin['revision'] + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('HOST_SOURCE=' + host + '\n')
          PY_SOURCES
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: Ullmann27/lumo-godot
          ref: ${{ steps.sources.outputs.native }}
          path: native-source
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install the exact verified Godot and actual software renderer
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Record exact sources and import the complete original native project
        id: import_source
        env:
          EXPECTED_NATIVE: ${{ steps.sources.outputs.native }}
        run: |
          set -euo pipefail
          mkdir -p authority-evidence
          test "$(git -C native-source rev-parse HEAD)" = "$EXPECTED_NATIVE"
          test "$(git -C host-source rev-parse HEAD)" = "$HOST_SOURCE"
          git -C native-source rev-parse HEAD > authority-evidence/NATIVE-SOURCE.txt
          git -C native-source rev-parse 'HEAD^{tree}' > authority-evidence/NATIVE-TREE.txt
          git -C host-source rev-parse HEAD > authority-evidence/HOST-SOURCE.txt
          git -C host-source rev-parse 'HEAD^{tree}' > authority-evidence/HOST-TREE.txt
          godot --version > authority-evidence/godot-version.txt
          dart --version > authority-evidence/dart-version.txt 2>&1
          python3 native-source/tools/validate_project.py 2>&1 | tee authority-evidence/project-validation.log
          godot --headless --path native-source --editor --import --quit 2>&1 | tee authority-evidence/import.log
          if grep -qE 'SCRIPT ERROR|Parse Error|ERROR:' authority-evidence/import.log; then exit 1; fi
      - name: Resolve the pinned existing host dependencies
        id: host_dependencies
        working-directory: host-source
        run: flutter pub get --enforce-lockfile
      - name: Exercise the actual authority for this activity
        working-directory: host-source
        env:
          ACTIVITY: ${{ matrix.activity }}
        run: |
          set -euo pipefail
          case "$ACTIVITY" in
            english)
              dart run tool/check_native_english_activity.dart --out ../authority-evidence/english-activity.json 2>&1 | tee ../authority-evidence/english-authority.log
              ;;
            quiz)
              dart run tools/android_qa/quiz_round_contract.dart 2>&1 | tee ../authority-evidence/quiz-authority-contract.log
              ;;
            memory)
              dart tools/android_qa/memory_round_contract.dart 2>&1 | tee ../authority-evidence/memory-authority-contract.log
              dart tools/android_qa/memory_turn_scheduler_contract.dart 2>&1 | tee ../authority-evidence/memory-scheduler-contract.log
              ;;
            *) exit 1 ;;
          esac
      - name: Exercise English meshes with actual host producer output
        if: ${{ matrix.activity == 'english' }}
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/lumo-english-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/lumo-english-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/lumo-english-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          python3 native-source/tools/run_godot_probe.py \
            --log authority-evidence/english-render.log --timeout 900 --required LEARNING_ENGLISH_PASS -- \
            xvfb-run -a -s '-screen 0 2560x2560x24' godot --path native-source \
            --rendering-method gl_compatibility --audio-driver Dummy --disable-vsync \
            --script res://scripts/tests/learning_english_regression.gd -- --capture \
            --output="$GITHUB_WORKSPACE/authority-evidence/english-native" \
            --task-fixtures="$GITHUB_WORKSPACE/authority-evidence/english-activity.json"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          folder = Path('authority-evidence')
          report = json.loads((folder / 'english-native/learning-english-report.json').read_text())
          assert report['fixture_kind'] == 'actual_dart_producer_report'
          assert report['task_fixture_sha256'] == hashlib.sha256((folder / 'english-activity.json').read_bytes()).hexdigest()
          assert report['failures'] == [] and report['renderer'] != 'headless'
          assert len(list((folder / 'english-native').glob('*.png'))) == 17
          PY
      - name: Play all twenty Quiz questions through the real Dart and Godot processes
        if: ${{ !cancelled() && matrix.activity == 'quiz' && steps.import_source.outcome == 'success' && steps.host_dependencies.outcome == 'success' }}
        env:
          EXPECTED_NATIVE: ${{ steps.sources.outputs.native }}
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2560x2560x24' python3 native-source/tools/run_quiz_native_authority.py \
            --native native-source --host host-source \
            --expected-native "$EXPECTED_NATIVE" --expected-host "$HOST_SOURCE" \
            --output authority-evidence/quiz-pair --capture
      - name: Reject inconsistent Memory pair evidence
        if: ${{ matrix.activity == 'memory' }}
        run: python3 -m unittest discover -s native-source/tools/tests -p test_memory_native_pair_evidence.py -v
      - name: Render the actual Memory geometry and touch layouts
        if: ${{ matrix.activity == 'memory' }}
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/lumo-memory-view-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/lumo-memory-view-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/lumo-memory-view-cache"
          export LUMO_MEMORY_CAPTURE_DIR="$GITHUB_WORKSPACE/authority-evidence/memory-view"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          python3 native-source/tools/run_godot_probe.py \
            --log authority-evidence/memory-view.log --timeout 900 --required MEMORY_VIEW_PASS -- \
            xvfb-run -a -s '-screen 0 2560x2560x24' godot --path native-source \
            --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --disable-vsync \
            --script res://scripts/tests/memory_table_regression.gd -- --capture
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path('authority-evidence/memory-view')
          report = json.loads((folder / 'memory-view-result.json').read_text())
          assert report['status'] == 'PASS' and report['errors'] == [] and report['capture'] is True
          assert len(report['captures']) == 8 and len(list(folder.glob('*.png'))) == 8
          PY
      - name: Play Memory through the actual Dart and Godot processes
        if: ${{ !cancelled() && matrix.activity == 'memory' && steps.import_source.outcome == 'success' && steps.host_dependencies.outcome == 'success' }}
        env:
          EXPECTED_NATIVE: ${{ steps.sources.outputs.native }}
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 2560x2560x24' python3 native-source/tools/run_memory_native_authority.py \
            --native native-source --host host-source \
            --expected-native "$EXPECTED_NATIVE" --expected-host "$HOST_SOURCE" \
            --output authority-evidence/memory-pair --capture
      - name: Verify both tracked source trees remain unchanged
        if: always()
        run: |
          set -euo pipefail
          git -C native-source diff --exit-code HEAD --
          git -C host-source diff --exit-code HEAD --
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-integrated-2021-nextgen-authority-${{ matrix.activity }}
          path: |
            authority-evidence/
            !authority-evidence/**/user/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  connect-four-runtime:
    if: >-
      github.repository == 'Ullmann27/lumo-lernen' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'integration/lumo-complete-apk-20261114-7a1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      native-revision: ${{ steps.pin.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Bind the approved 2021 host and exact native source
        id: pin
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PYCODE'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from verify_legacy_release_pin import verify
          build, native = verify(Path('pubspec.yaml').read_text(), Path('config/godot-source.json').read_text())
          assert build == 2021, 'Only the explicit 2021 C4 candidate is accepted'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + native + '\n')
          PYCODE
      - uses: actions/checkout@v4
        with:
          repository: Ullmann27/lumo-godot
          ref: ${{ steps.pin.outputs.revision }}
          path: native-source
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Prepare genuine desktop renderer dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0 fonts-noto-color-emoji
          python3 -m venv .c4-python
          .c4-python/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0
          flutter pub get --enforce-lockfile
          command -v xvfb-run
      - name: Install the actual pinned Godot engine
        run: bash scripts/install_godot_for_build.sh
      - name: Import the exact configured native source in its own directory
        env:
          NATIVE_REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git -C native-source rev-parse HEAD)" = "$NATIVE_REVISION"
          mkdir -p c4-runtime
          export XDG_DATA_HOME="$RUNNER_TEMP/c4-import/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/c4-import/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/c4-import/cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          (cd native-source && timeout 300s godot --headless --audio-driver Dummy --editor --import) 2>&1 | tee c4-runtime/original-import.log
          if grep -En 'ERROR:|SCRIPT ERROR:|Parse Error:' c4-runtime/original-import.log; then
            echo 'Actual C4 source import failed' >&2
            exit 1
          fi
      - name: Retry the acknowledged native exit after a transient Android refusal
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/c4-return/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/c4-return/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/c4-return/cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          timeout 60s godot --headless --audio-driver Dummy --path native-source --script res://scripts/tests/connect_four_return_regression.gd 2>&1 | tee c4-runtime/return-recovery.log
          if grep -En 'ERROR:|SCRIPT ERROR:|Parse Error:|Assertion failed' c4-runtime/return-recovery.log; then
            echo 'The actual native return regression reported an engine or script failure' >&2
            exit 1
          fi
          test "$(grep -Fxc 'CONNECT_FOUR_RETURN_PASS checks=21' c4-runtime/return-recovery.log)" = 1
      - name: Require the additional pinned native Treasure wisp regression
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/c4-wisps/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/c4-wisps/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/c4-wisps/cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          (cd native-source && python3 tools/run_godot_probe.py --log "$GITHUB_WORKSPACE/c4-runtime/wisps.log" --timeout 180 --required '[TreasureWisp] PASS' -- godot --headless --path . --audio-driver Dummy --script scripts/tests/treasure_wisp_regression.gd)
          test "$(grep -Fxc '[TreasureWisp] PASS checks=14' c4-runtime/wisps.log)" = 1
      - name: Require the actual production Dart and rendered Godot two-process gate
        run: |
          set -euo pipefail
          .c4-python/bin/python scripts/run_connect_four_runtime.py --host "$GITHUB_WORKSPACE" --native "$GITHUB_WORKSPACE/native-source" --output "$GITHUB_WORKSPACE/c4-runtime/runtime"
      - name: Preserve every original C4 runtime result and rendered frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-integrated-2021-desktop-runtime
          path: c4-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  android-host-compile:
    if: >-
      github.repository == 'Ullmann27/lumo-lernen' &&
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'integration/lumo-complete-apk-20261114-7a1')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Compile actual current Android host before native release pin approval
        run: bash scripts/compile_android_host.sh
      - name: Bind actual compiled C4 Activity bridge and Binder bytecode
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, subprocess
          from pathlib import Path
          classes = {}
          for name in ('ConnectFourGameActivity', 'ConnectFourAuthorityService', 'ConnectFourBridge'):
              paths = sorted(Path('build/app').rglob(name + '.class'))
              assert paths, 'Actual current C4 bytecode missing: ' + name
              classes[name] = []
              for path in paths:
                  data = path.read_bytes()
                  assert data.startswith(bytes.fromhex('cafebabe')), 'Invalid actual C4 class'
                  classes[name].append({'path':str(path), 'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()})
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          Path('host-compile-evidence/connect-four-classes.json').write_text(json.dumps(
              {'status':'PASS','source':source,'classes':classes}, indent=2) + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-integrated-2021-android-host-compile
          path: host-compile-evidence/
          if-no-files-found: error
          retention-days: 30

  verify-and-build:
    needs: [android-host-compile, connect-four-runtime, nextgen-authorities]
    if: >-
      github.repository == 'Ullmann27/lumo-lernen' &&
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'integration/lumo-complete-apk-20261114-7a1')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      candidate-artifact-id: ${{ steps.upload-candidate.outputs.artifact-id }}
      candidate-artifact-digest: ${{ steps.upload-candidate.outputs.artifact-digest }}
    env:
      LUMO_SPLIT_PER_ABI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Save source identity and validate exact Godot integration pin
        run: |
          set -euo pipefail
          mkdir -p dist
          git rev-parse HEAD | tee dist/BUILD-SOURCE.txt
          cat config/godot-source.json | tee dist/GODOT-SOURCE.json
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from verify_legacy_release_pin import verify
          build, native = verify(Path("pubspec.yaml").read_text(), Path("config/godot-source.json").read_text())
          assert build == 2021, "C4 test workflow requires build 2021"
          from release_pipeline_gates import parse_pubspec_version
          assert parse_pubspec_version(Path("pubspec.yaml").read_text())[1] == 2021, "Wrong C4 test candidate version"
          config=json.load(open("config/godot-source.json"))
          assert config["repository"]=="https://github.com/Ullmann27/lumo-godot.git", "Unexpected Godot repository"
          assert isinstance(config["revision"], str) and re.fullmatch(r"[0-9a-f]{40}", config["revision"]), "Godot source must be an immutable 40-character Git SHA"
          assert config["engine"]=="4.6.3", "Unexpected Godot engine"
          # Historical bad sources remain rejected on this separate candidate.
          # Actual rendered review exposed native menu geometry defects.
          # This workflow revision rejects the measured candidates on every run.
          # It cannot alter historical workflow revisions used by older runs.
          rejected_android_layout_sources = {
              "0aa89cdea3a07d0c2bc0a31a153737a1fee41454":
                  "Android 2400x1080: header/tab overlap and landing model occlusion",
              "f04e580ec0d7d8f70e8be269523fabedd15b0766":
                  "Android 2400x1080: selected kart card exceeds visible scroll viewport",
          }
          assert config["revision"] not in rejected_android_layout_sources, (
              "Rejected Android menu layout: " + rejected_android_layout_sources.get(config["revision"], "")
          )
          # scripts/export_embedded_game.py subsequently fetches/checks out this
          # exact SHA, then compares its HEAD before packaging the native PCK.
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install real system emoji for ABC screenshots and Flutter test suite
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y fonts-noto-color-emoji
          test -s /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
      - name: Resolve immutable Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Audit every exact current-grade learning family on this candidate
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          audit_dir="$GITHUB_WORKSPACE/.ci-results/learning-curriculum-audit"
          mkdir -p "$audit_dir"
          dart run tools/audit_learning_tasks_all_grades.dart "$audit_dir" 2> "$audit_dir/audit.stderr.log" | tee "$audit_dir/audit.stdout.log"
          python3 scripts/verify_integrated_delivery.py bind-learning-audit --directory "$audit_dir" --source "$SOURCE_SHA" --build-run "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve the original current-source learning family audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-integrated-2021-learning-curriculum-audit
          path: .ci-results/learning-curriculum-audit/
          if-no-files-found: error
          retention-days: 30
      - name: Flutter static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Real widget tests for premium quiz and 3D learning islands
        run: |
          flutter test --no-pub --reporter=expanded --timeout=60s --concurrency=2 \
            test/quiz_premium_stage_layout_test.dart \
            test/quiz_premium_stage_visual_capture_test.dart \
            test/home_navigation_progress_test.dart \
            test/home_subject_islands_premium_test.dart \
            test/academy_grade_3_4_visible_navigation_test.dart \
            test/lumo_scene_art_panel_test.dart \
            test/learning_lab_runtime_test.dart \
            test/parents/parent_school_grade_progression_test.dart
      - name: Save genuine rendered Quizshow screenshots for reference comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-1983-quiz-studio-captures
          path: .ci-results/quiz-premium-stage/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Full Flutter regression suite including every capture
        env:
          REQUIRE_ALL_TESTS: 'true'
        run: |
          set -euo pipefail
          if [ "$REQUIRE_ALL_TESTS" = true ]; then
            python3 scripts/run_full_flutter_acceptance.py --output .ci-results/full-acceptance
          else
            flutter test --no-pub --reporter=expanded --timeout=60s --concurrency=2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-candidate-all-flutter-tests-and-captures
          path: .ci-results/full-acceptance/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Capture and verify actual 2001 tutor, transfer and daily-plan routes
        if: hashFiles('test/design/lumo_tutor_brain_capture_test.dart') != ''
        env:
          LUMO_TUTOR_BRAIN_CAPTURES: .ci-results/tutor-2001
        run: flutter test --no-pub --reporter=expanded test/design/lumo_tutor_brain_capture_test.dart
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.ci-results/tutor-2001/*.png') != ''
        with:
          name: lumo-tutor-2001-actual-flutter-captures
