name: Lumo inspect original APK 280 proof

on:
  push:
    branches: ['codex/lumo-unified-android-2026-10-03']
    paths: ['.github/workflows/lumo-inspect-proof-280.yml']

# GitHub requires draft-authoring access to read unpublished release assets.
# This workflow performs only GET requests and an Actions artifact upload.
permissions:
  contents: write
  actions: read

jobs:
  original-proof:
    if: contains(github.event.head_commit.message, '[lumo-inspect-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read original evidence without running or changing app code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-proof
          git archive --format=zip --output=original-proof/lumo-source.zip HEAD
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import zipfile

          repository = os.environ['GITHUB_REPOSITORY']
          if repository != 'Ullmann27/lumo-lernen':
              raise RuntimeError('Unexpected repository')
          run_id = 37174626790
          release_id = 402540673
          expected_name = f'android-api35-qa-{run_id}-1.zip'
          def api(endpoint):
              result = subprocess.run(['gh', 'api', endpoint], capture_output=True,
                                      text=True, timeout=60)
              if result.returncode:
                  raise RuntimeError(f'GET {endpoint}: {result.stderr.strip()}')
              return json.loads(result.stdout)

          run = api(f'repos/{repository}/actions/runs/{run_id}')
          if run['status'] != 'completed':
              raise RuntimeError('The selected original QA run is not complete')
          release = api(f'repos/{repository}/releases/{release_id}')
          if release['tag_name'] != 'unified-build-280' or not release['draft']:
              raise RuntimeError('Unexpected release or publication state')
          assets = []
          for page in range(1, 21):
              batch = api(f'repos/{repository}/releases/{release_id}/assets?per_page=100&page={page}')
              assets.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError('Release asset pagination did not finish')
          matches = [asset for asset in assets if asset['name'] == expected_name]
          if len(matches) != 1:
              raise RuntimeError('The exact original proof asset is missing or ambiguous')
          asset = matches[0]
          if not 0 < asset['size'] < 250_000_000:
              raise RuntimeError('Unexpected proof size')
          destination = Path('original-proof') / expected_name
          with destination.open('wb') as output:
              subprocess.run(['gh', 'api', f'repos/{repository}/releases/assets/{asset["id"]}',
                              '-H', 'Accept: application/octet-stream'],
                             check=True, stdout=output, timeout=180)
          if destination.stat().st_size != asset['size']:
              raise RuntimeError('Downloaded proof size does not match GitHub')
          checksum = hashlib.sha256(destination.read_bytes()).hexdigest()
          if asset.get('digest') and asset['digest'] != 'sha256:' + checksum:
              raise RuntimeError('Downloaded proof digest does not match GitHub')
          identity = {'original_run_id': run_id, 'original_run_commit': run['head_sha'],
                      'original_run_conclusion': run['conclusion'], 'release_id': release_id,
                      'release_draft': release['draft'], 'asset_id': asset['id'],
                      'asset_name': asset['name'], 'bytes': asset['size'], 'sha256': checksum,
                      'apk_exported': False, 'app_changed': False, 'release_published': False}
          Path('original-proof/identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          print('ORIGINAL_PROOF_IDENTITY=' + json.dumps(identity), flush=True)
          with zipfile.ZipFile(destination) as archive:
              if archive.testzip() is not None:
                  raise RuntimeError('Original proof ZIP failed its CRC check')
              names = archive.namelist()
              Path('original-proof/entries.json').write_text(json.dumps(names, indent=2) + '\n')
              print('ORIGINAL_PROOF_ENTRIES=' + json.dumps(names), flush=True)
              selected = [name for name in names if Path(name).name in
                          {'result.json', 'flutter-proof.json', 'emulator-version-proof.json'}]
              selected += [name for name in names if name.endswith('.xml') and
                           ('local-help' in name or 'local-task-help' in name or 'usage-check-failure' in name)][-6:]
              for name in selected:
                  info = archive.getinfo(name)
                  if info.file_size > 100_000:
                      continue
                  text = archive.read(name).decode('utf-8', errors='replace')
                  print('ORIGINAL_PROOF_FILE=' + json.dumps({'name': name, 'content': text}), flush=True)
          PY
      - name: Preserve unchanged evidence and public source for download
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-original-proof-37174626790
          path: original-proof/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
