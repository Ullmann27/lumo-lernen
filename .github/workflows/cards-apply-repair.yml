name: Apply exact Cards repair

on:
  push:
    branches: [chatgpt/cards-resume-safety-2026-10-06]
    paths:
      - tools/cards_session_repair.patch
      - .github/workflows/cards-apply-repair.yml

permissions:
  contents: write

concurrency:
  group: cards-exact-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Ullmann27/lumo-lernen' && github.ref == 'refs/heads/chatgpt/cards-resume-safety-2026-10-06'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: lib/features/games/lumo_cards/lumo_cards_screen.dart
      BRANCH: chatgpt/cards-resume-safety-2026-10-06
      BEFORE: 243608db94bf4efbf85467a8a3e291a414669283
      AFTER: 1ff6ac48fe6852ed87353741d1b4513b7842161e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate exact input, patch and output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-repair
          git rev-parse HEAD > ci-repair/base-sha.txt
          test "$(git hash-object "$TARGET")" = "$BEFORE"
          git apply --check tools/cards_session_repair.patch
          git apply tools/cards_session_repair.patch
          test "$(git hash-object "$TARGET")" = "$AFTER"
          test "$(git diff --name-only)" = "$TARGET"
          git diff --check
          git diff -- "$TARGET" > ci-repair/applied.patch
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Format only newly owned tests and avatar dialog
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/games/lumo_cards/widgets/lumo_avatar_picker.dart \
            test/lumo_cards_controller_lifecycle_test.dart \
            test/lumo_cards_session_ui_test.dart test/lumo_cards_session_visual_test.dart
          python3 - <<'PY'
          import subprocess
          allowed = {
              'lib/features/games/lumo_cards/lumo_cards_screen.dart',
              'lib/features/games/lumo_cards/widgets/lumo_avatar_picker.dart',
              'test/lumo_cards_controller_lifecycle_test.dart',
              'test/lumo_cards_session_ui_test.dart',
              'test/lumo_cards_session_visual_test.dart',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          if not changed.issubset(allowed):
              raise SystemExit('Unexpected writes: ' + repr(changed - allowed))
          PY
      - name: Analyze and test Cards, complete rounds and responsive UI
        shell: bash
        run: |
          set -euo pipefail
          flutter --version | tee ci-repair/flutter-version.txt
          flutter pub get 2>&1 | tee ci-repair/dependencies.log
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ci-repair/analysis.log
          mapfile -t tests < <(find test -type f -name '*cards*test.dart' | sort)
          flutter test --no-pub --reporter=expanded --timeout=45s --concurrency=2 \
            "${tests[@]}" test/games/game_round_regression_test.dart \
            test/games/games_screen_flow_test.dart 2>&1 | tee ci-repair/tests.log
      - name: Commit only the tested allowlisted files on own fresh branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$TARGET")" = "$AFTER"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          allowed = {
              'lib/features/games/lumo_cards/lumo_cards_screen.dart',
              'lib/features/games/lumo_cards/widgets/lumo_avatar_picker.dart',
              'test/lumo_cards_controller_lifecycle_test.dart',
              'test/lumo_cards_session_ui_test.dart',
              'test/lumo_cards_session_visual_test.dart',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          if not changed.issubset(allowed) or 'lib/features/games/lumo_cards/lumo_cards_screen.dart' not in changed:
              raise SystemExit('Unexpected diff: ' + repr(changed))
          for name in sorted(changed):
              subprocess.run(['git', 'add', '--', name], check=True)
          Path('ci-repair/changed-files.txt').write_text('\n'.join(sorted(changed)) + '\n')
          PY
          remote=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'Lumo verified repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cards): pause modal dialogs and cancel uncommitted card flights'
          git rev-parse HEAD | tee ci-repair/result-sha.txt
          git push origin "HEAD:refs/heads/$BRANCH"
          cp "$TARGET" ci-repair/screen.dart
      - name: Preserve repair, tests and preview captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-exact-repair-${{ github.run_id }}
          path: |
            ci-repair/
            ci-out/cards-visual/
          if-no-files-found: error
          retention-days: 7
