name: "Lumo Intelligence 2.0 – Integration und Android-Abnahme"
# Baut eine installierbare, signierte Test-APK aus genau diesem Integrationsstand
# Abgeleitet aus der erfolgreichen 2082-Pipeline;
# frühere APKs, main und die 2082-Pipeline bleiben unverändert.
# Ausgelöst nur durch config/intelligence-2-0-apk-request.json. Die signierte APK bleibt als Artefakt verfügbar.
# Paket bleibt dev.ullmann.lumo.lumo_lernen.coachpreview (prepare_android.py --side-by-side
# erzeugt genau diese bestehende App-ID), Schlüssel tools/lumo-debug.keystore wie 2078.
on:
  push:
    branches: [opus/lumo-intelligence-2-0-20261126, integration/lumo-final-release-20261126]
    paths:
      - config/intelligence-2-0-apk-request.json

permissions:
  contents: read

concurrency:
  group: lumo-intelligence-2-0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intelligence-tests:
    name: Echte Lernanalysen, Lernhilfe und Hausaufgaben prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Abhängigkeiten und neue Lernwege prüfen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p intelligence-proof
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            2>&1 | tee intelligence-proof/FLUTTER-ANALYSIS.txt
          flutter test --no-pub --reporter expanded --timeout=60s --concurrency=2 \
            test/domain/adaptive_practice_plan_test.dart \
            test/domain/learning_chart_data_test.dart \
            test/domain/assignment_evidence_2082_test.dart \
            test/domain/school_model_test.dart \
            test/features/teacher_flow_test.dart \
            test/features/assignment_evidence_2082_widget_test.dart \
            test/features/lumo_coach_profile_guard_2082_test.dart \
            test/domain/learning_analysis_independent_evidence_test.dart \
            test/features/learning_analysis_evidence_view_test.dart \
            test/domain/learning_analysis_extended_test.dart \
            test/domain/school_analysis_test.dart \
            test/learning_loop_restart_scenario_test.dart \
            test/features/report_screen_test.dart \
            test/parents \
            test/qa \
            test/tutoring \
            2>&1 | tee intelligence-proof/FLUTTER-FOCUSED-TESTS.txt
      - name: Tatsächliche Prüfergebnisse sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUMO-INTELLIGENCE-TESTS-${{ github.run_id }}
          path: intelligence-proof/
          if-no-files-found: warn

  apk:
    needs: intelligence-tests
    name: Signierte Test-APK bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      # Eine APK je Prozessorart: Handys brauchen nur ARM64. Das halbiert die
      # nativen Bibliotheken gegenüber einer Universal-APK.
      LUMO_SPLIT_PER_ABI: '1'
      LUMO_NDK_DISPOSABLE_RUNNER: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Quellstand und Godot-Pin festhalten
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/verify_legacy_release_pin.py
          mkdir -p build-proof
          python3 -m unittest discover -s scripts/tests -p test_verify_test_apk_candidate.py -v
          python3 -m unittest discover -s scripts/tests -p test_verify_native_start_diagnostics.py -v
          python3 -m unittest discover -s tools/android_qa/tests -p test_native_start_diagnostics.py -v
          python3 -m unittest discover -s tools/android_qa/tests -p test_intro_dialog.py -v
          python3 -m unittest discover -s tools/android_qa/tests -p test_local_backup_android_probe.py -v
          python3 -m unittest scripts.tests.test_prepare_android -v
          python3 -m unittest scripts.tests.test_export_embedded_game -v \
            2>&1 | tee build-proof/GODOT-EXPORT-CONTRACT-TESTS.txt
          python3 scripts/verify_test_apk_candidate.py source --expected-commit "$GITHUB_SHA" \
            --out build-proof/CANDIDATE-SOURCE.json
          git rev-parse HEAD > build-proof/FLUTTER-COMMIT.txt
          cp config/godot-source.json build-proof/GODOT-SOURCE.json
          cp config/test-apk-request.json build-proof/TEST-APK-REQUEST.json
          cp config/intelligence-2-0-apk-request.json build-proof/INTELLIGENCE-2-0-APK-REQUEST.json
      - name: Android- und Godot-Werkzeuge einrichten
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y fonts-noto-color-emoji
          bash scripts/install_ndk_for_build.sh build-proof/ndk
          bash scripts/install_godot_for_build.sh
      - name: Native Sprache, Lerndialog und Datensicherung – JVM-Verträge
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            -o "$RUNNER_TEMP/lumo-contract-gradle.zip"
          printf '%s  %s\n' a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806 \
            "$RUNNER_TEMP/lumo-contract-gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lumo-contract-gradle.zip" -d "$RUNNER_TEMP/lumo-contract-gradle"
          export LUMO_KOTLIN_LIB_DIR="$RUNNER_TEMP/lumo-contract-gradle/gradle-9.1.0/lib"
          python3 -m unittest scripts.tests.test_english_lesson_speech \
            scripts.tests.test_speech_envelope_contract scripts.tests.test_learning_dialog_logic \
            scripts.tests.test_studio_learning_contract \
            scripts.tests.test_local_backup_transaction -v \
            2>&1 | tee build-proof/NATIVE-SPEECH-DIALOG-TESTS.txt
      - name: Flutter – Analyse und vollständige Testsuite
        shell: bash
        env:
          LUMO_ROOM_SCREENSHOT_DIR: build-proof/room
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            | tee build-proof/FLUTTER-ANALYSIS.txt
          flutter test --no-pub --reporter expanded --timeout=60s --concurrency=2 \
            | tee build-proof/FLUTTER-CORE-TESTS.txt
      - name: Godot – gepinnter Spielstand startet und besteht seine Kernprüfungen
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(python3 -c 'import json; print(json.load(open("config/godot-source.json"))["revision"])')"
          git clone --filter=blob:none https://github.com/Ullmann27/lumo-godot.git build/lumo-godot-qa
          git -C build/lumo-godot-qa checkout --detach "$SOURCE"
          python3 scripts/verify_kart_fleet_mirror.py build/lumo-godot-qa
          # Der Erstimport stürzt in Godot 4.6.3 auf vollen CI-Rechnern ab, wenn
          # Szenen-Benachrichtigungen aus Arbeits-Threads kommen. Wie im Bauskript
          # läuft der Importer deshalb mit --single-threaded-scene; zusätzlich
          # wird der idempotente Import genau einmal wiederholt.
          godot --headless --single-threaded-scene --path build/lumo-godot-qa --editor --import --quit \
            || godot --headless --single-threaded-scene --path build/lumo-godot-qa --editor --import --quit
          # Gleiche strenge Aufruf- und Zeitgrenzen wie der separate native Prüflauf.
          for probe in table_turn_flow_regression cards_rules_regression chess_rules_regression; do
            python3 build/lumo-godot-qa/tools/run_godot_probe.py \
              --timeout 900 --required PASS --log "build-proof/GODOT-${probe}.txt" -- \
              godot --headless --single-threaded-scene --audio-driver Dummy \
              --path build/lumo-godot-qa --script "res://scripts/tests/${probe}.gd"
          done
          python3 build/lumo-godot-qa/tools/run_godot_probe.py \
            --timeout 1200 --required CARDS_TABLE_RUNTIME_PASS \
            --log build-proof/GODOT-cards_table_regression.txt -- \
            godot --headless --single-threaded-scene --audio-driver Dummy \
            --path build/lumo-godot-qa --script res://scripts/tests/cards_table_regression.gd
          python3 build/lumo-godot-qa/tools/run_godot_probe.py \
            --timeout 1800 --required CHESS_TABLE_PASS \
            --log build-proof/GODOT-chess_table_regression.txt -- \
            godot --headless --single-threaded-scene --audio-driver Dummy \
            --path build/lumo-godot-qa --script res://scripts/tests/chess_table_regression.gd -- --scene=chess
          for probe in kart_neon_home_regression kart_garage_landscape_regression kart_race_kinds_regression \
            kart_result_reachability_regression native_table_boot_regression \
            learning_android_host_capability_regression native_learning_boot_regression; do
            echo "::group::$probe"
            timeout 600 godot --headless --path build/lumo-godot-qa \
              --script "res://scripts/tests/$probe.gd" | tee "build-proof/GODOT-${probe}.txt"
            echo "::endgroup::"
          done
          for probe in lumo_kart_production_driver_regression lumo_opponent_roster_regression \
            kart_extra_drivers_regression \
            learning_holo_lesson_regression lumo_run_stunt_relay_regression \
            kart_arena_battle_regression parcours_menu_entry_regression parcours_race_regression \
            lumo_run_regression lumo_run_flow_regression quiz_studio_escape_regression; do
            echo "::group::$probe"
            # Der Lauf-Test spielt 30 ganze Dschungelherz-Läufe mit den echten
            # Teilschritten des Spiels (rund 18 s je Lauf im CI): 600 s reichten nur
            # bis Lauf 24 (Lauf 44551761545, Abbruch mit 124 ohne Fehlschlag).
            limit=600
            if [ "$probe" = lumo_run_regression ]; then limit=1500; fi
            timeout "$limit" godot --headless --path build/lumo-godot-qa \
              --script "res://scripts/tests/$probe.gd" | tee "build-proof/GODOT-${probe}.txt"
            echo "::endgroup::"
          done
          echo "::group::learning_tutor_regression (validation, invalid, return, voice)"
          timeout 600 godot --headless --path build/lumo-godot-qa \
            --script res://scripts/tests/learning_tutor_regression.gd -- \
            --part=validation,invalid,return,voice | tee build-proof/GODOT-learning_tutor_regression.txt
          echo "::endgroup::"
      - name: World – integrierte Missionen, Kart, Figuren und Spielstand
        shell: bash
        run: |
          set -euo pipefail
          for probe in lumo_world_quest_integrity_regression lumo_world_first_entry_regression \
            lumo_world_kart_ground_regression lumo_world_open_world_integration_regression \
            lumo_world_kart_persistence_regression lumo_world_routines_regression \
            lumo_world_routines_integration_regression lumo_world_waldheim_regression \
            lumo_world_sternenstadt_regression; do
            XDG_DATA_HOME="$RUNNER_TEMP/lumo-world-$probe" \
              python3 build/lumo-godot-qa/tools/run_godot_probe.py \
                --timeout 600 --required "PASS" --log "build-proof/GODOT-${probe}.txt" -- \
                godot --headless --path build/lumo-godot-qa \
                --script "res://scripts/tests/${probe}.gd"
          done
      - name: Intelligence 2.0 – neue Strecken, Spiele und Welt (gepinnter Godot-Stand)
        shell: bash
        run: |
          set -euo pipefail
          # Team B1: drei Signatur-Strecken. Vertrag und Welt (alle Grafikprofile) headless.
          for probe in kart_track_contract kart_signature_world_regression; do
            python3 build/lumo-godot-qa/tools/run_godot_probe.py \
              --timeout 1200 --required PASS --log "build-proof/GODOT-${probe}.txt" -- \
              godot --headless --path build/lumo-godot-qa \
              --script "res://scripts/tests/${probe}.gd"
          done
          # Ganzes Rennen je Strecke: zwei Runden, fünf erkennbare KI-Rivalen, nur sichtbare Bedienung.
          for track in vulkanexpress_3100 wolkensturm_3300 kristallflut_2800; do
            python3 build/lumo-godot-qa/tools/run_godot_probe.py \
              --timeout 1500 --required '[SignatureRace] PASS' \
              --log "build-proof/GODOT-kart_signature_race-${track}.txt" -- \
              godot --headless --path build/lumo-godot-qa \
              --script res://scripts/tests/kart_signature_race_regression.gd -- --track="$track"
          done
      - name: Rivalen, Tunnel und Produktionsfahrzeuge in den reparierten Spielpfaden prüfen
        shell: bash
        run: |
          set -euo pipefail
          for probe in kart_adventure_regression kart_production_vehicle_regression kart_fleet_regression; do
            XDG_DATA_HOME="$RUNNER_TEMP/lumo-release-$probe" \
              python3 build/lumo-godot-qa/tools/run_godot_probe.py \
                --timeout 900 --required PASS --log "build-proof/GODOT-$probe.txt" -- \
                godot --headless --single-threaded-scene --audio-driver Dummy --resolution 1280x720 \
                --path build/lumo-godot-qa --script "res://scripts/tests/$probe.gd"
          done
          XDG_DATA_HOME="$RUNNER_TEMP/lumo-release-rival-ai" \
            python3 build/lumo-godot-qa/tools/run_godot_probe.py \
              --timeout 1500 --required '[KartRivalAI] PASS' --log build-proof/GODOT-kart_rival_ai_regression.txt -- \
              godot --headless --single-threaded-scene --audio-driver Dummy --resolution 1280x720 \
              --path build/lumo-godot-qa --script res://scripts/tests/kart_rival_ai_regression.gd \
              -- --tracks=jungle_emerald_3600,jungle_temple
      - name: Fold-Steuerung, Streckendetails, Kartenrunde und Grafikwahl prüfen
        shell: bash
        run: |
          set -euo pipefail
          for entry in kart_hud_controls_regression:KART_HUD_CONTROLS_OK \
            kart_detail_layer_regression:PASS kart_racecraft_regression:PASS \
            cards_punktlandung_reveal_regression:PASS kart_quality_persistence_regression:PASS; do
            probe="${entry%:*}"
            required="${entry#*:}"
            XDG_DATA_HOME="$RUNNER_TEMP/lumo-fold-$probe" \
              python3 build/lumo-godot-qa/tools/run_godot_probe.py \
                --timeout 1200 --required "$required" --log "build-proof/GODOT-$probe.txt" -- \
                godot --headless --single-threaded-scene --audio-driver Dummy --resolution 1280x720 \
                --path build/lumo-godot-qa --script "res://scripts/tests/$probe.gd"
          done
      - name: Elternlautstärke bei Neustart und Bauteilklang prüfen
        shell: bash
        run: |
          set -euo pipefail
          for action in mute unmute; do
            XDG_DATA_HOME="$RUNNER_TEMP/lumo-parent-audio" \
              python3 build/lumo-godot-qa/tools/run_godot_probe.py \
                --timeout 120 --required '[ParentMuteRestart] PASS' --log "build-proof/GODOT-parent-$action.txt" -- \
                godot --headless --single-threaded-scene --audio-driver Dummy --path build/lumo-godot-qa \
                --script res://scripts/tests/parent_mute_restart_regression.gd -- "--$action"
          done
          XDG_DATA_HOME="$RUNNER_TEMP/lumo-workshop-audio" \
            python3 build/lumo-godot-qa/tools/run_godot_probe.py \
              --timeout 120 --required '[WorkshopMotorVoices] PASS' --log build-proof/GODOT-workshop-motors.txt -- \
              godot --headless --single-threaded-scene --audio-driver Dummy --path build/lumo-godot-qa \
              --script res://scripts/tests/kart_workshop_motor_voices.gd
      - name: Eine signierte Flutter-Godot-APK bauen
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_unified_apk.sh
          test -s dist/Lumo-Lernen-Neu.apk
          # Both ABI builds are complete. Release the build JVM before the PCK runtime probe.
          (cd android && ./gradlew --stop)
          python3 scripts/verify_test_apk_candidate.py packages --expected-commit "$GITHUB_SHA" \
            --extract-pck "$RUNNER_TEMP/lumo-pck-runtime/lumo_game.pck" \
            --out build-proof/SPLIT-APK-IDENTITY.json
          # Separate processes release the asset audit's resources before the full race scene.
          # Both phases are mandatory and inspect the same PCK extracted from the ARM64 APK.
          for phase in assets race; do
            probe_arguments=("$phase")
            if [ "$phase" = assets ]; then probe_arguments+=(--console-assets); fi
            timeout 90 godot --headless --path "$RUNNER_TEMP/lumo-pck-runtime" \
              --main-pack "$RUNNER_TEMP/lumo-pck-runtime/lumo_game.pck" \
              --script "$PWD/.github/probes/lumo_kart_driver_package_probe.gd" -- "${probe_arguments[@]}" \
              | tee "build-proof/KART-DRIVER-PCK-${phase}.txt"
          done
          python3 build/lumo-godot-qa/tools/run_godot_probe.py \
            --timeout 120 --required '[Intelligence2083Pack] PASS' --log build-proof/GODOT-RUNTIME-DATA-PCK.txt -- \
            godot --headless --path "$RUNNER_TEMP/lumo-pck-runtime" \
            --main-pack "$RUNNER_TEMP/lumo-pck-runtime/lumo_game.pck" \
            --script "$PWD/.github/probes/lumo_2083_pack_probe.gd" -- --console-world
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk --abi arm64-v8a > build-proof/APK-VERIFICATION.json
          test -s dist/BUILD-PROVENANCE.json
          VERSION="$(grep '^version:' pubspec.yaml | cut -d' ' -f2)"
          NAME="Lumo-Lernen-Test-${VERSION/+/-}.apk"
          mkdir -p release
          cp dist/Lumo-Lernen-Neu.apk "release/$NAME"
          cp dist/BUILD-PROVENANCE.json release/BUILD-PROVENANCE.json
          cp build-proof/APK-VERIFICATION.json release/APK-VERIFICATION.json
          cp build-proof/SPLIT-APK-IDENTITY.json release/SPLIT-APK-IDENTITY.json
          cp build-proof/SPLIT-APK-IDENTITY.json dist/x86_64/SPLIT-APK-IDENTITY.json
          python3 - <<'PY_EVIDENCE'
          from pathlib import Path
          import zipfile

          required_documents = [
              Path('docs/integration/2026-11-26/INTELLIGENCE-2-0.md'),
              Path('docs/integration/2026-11-25/INTELLIGENCE-2082.md'),
              Path('docs/integration/2026-11-22/INTEGRATION.md'),
              Path('docs/integration/2026-11-24/INTEGRATION-2081.json'),
              Path('docs/handover/BUILD_2081_FLUTTER_COVERAGE_20261124.md'),
              Path('docs/handover/BUILD_2081_RECOGNITION_VOICE_20261124.md'),
              Path('build/lumo-godot-qa/docs/handoffs/LUMO_2081_NATIVE_INTEGRATION_20261124.md'),
              Path('docs/integration/2026-11-22/LEARNING-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/UPLOAD-ABGLEICH.md'),
              Path('docs/integration/2026-11-22/CUSTOM-REWARDS-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/PARENT-TASKS-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/BACKUP-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/LUMO-ROOM-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/ACHIEVEMENTS-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/RECOGNITION-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/flutter-branch-inventory.json'),
              Path('build/lumo-godot-qa/docs/integration/2026-11-22/GODOT_INTEGRATION.md'),
              Path('build/lumo-godot-qa/docs/integration/2026-11-22/godot-branch-inventory.json'),
          ]
          for path in required_documents:
              if not path.is_file():
                  raise FileNotFoundError(f'Missing integration evidence: {path}')
          sources = {
              'intelligence-2-0': Path('docs/integration/2026-11-26'),
              'intelligence-2082': Path('docs/integration/2026-11-25'),
              'flutter': Path('docs/integration/2026-11-22'),
              'flutter-2081': Path('docs/integration/2026-11-24'),
              'flutter-2081-tests': Path('docs/evidence/build-2081-flutter-20261124'),
              'flutter-2082-focused': Path('docs/evidence/intelligence-2082-focused-20261125'),
              'godot-2082-tables': Path('docs/evidence/intelligence-2082-native-tables-20261125'),
              'godot-2081-tests': Path('build/lumo-godot-qa/docs/evidence/integration-2081-20261124'),
              'godot': Path('build/lumo-godot-qa/docs/integration/2026-11-22'),
          }
          proof = sorted(Path('build-proof').glob('*.txt')) + sorted(Path('build-proof').glob('*.json'))
          with zipfile.ZipFile('release/LUMO-INTEGRATIONSBELEGE.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in (Path('docs/handover/BUILD_2081_FLUTTER_COVERAGE_20261124.md'),
                           Path('docs/handover/BUILD_2081_RECOGNITION_VOICE_20261124.md'),
                           Path('build/lumo-godot-qa/docs/handoffs/LUMO_2081_NATIVE_INTEGRATION_20261124.md')):
                  archive.write(path, '2081-handoffs/' + path.name)
              for label, directory in sources.items():
                  for path in sorted(directory.rglob('*')):
                      if path.is_file() and path.suffix in {'.md', '.json', '.txt', '.log', '.png', '.gz'}:
                          archive.write(path, f'{label}/{path.relative_to(directory)}')
              for path in proof:
                  archive.write(path, 'build-proof/' + path.name)
              for label, directory in {
                  'room': Path('build-proof/room'),
                  'achievements': Path('.ci-results/achievements'),
              }.items():
                  for path in sorted(directory.glob('*.png')):
                      archive.write(path, f'widget-previews/{label}/{path.name}')
          PY_EVIDENCE
          (cd release && sha256sum "$NAME" > SHA256SUMS.txt)
          echo "LUMO_APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "LUMO_APK_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: APK für den Android-Emulator sichern
        uses: actions/upload-artifact@v4
        with:
          name: LUMO-EMULATOR-APK-${{ github.run_id }}
          path: dist/x86_64/
          if-no-files-found: error
          compression-level: 0
      - name: Paketname und Signaturzertifikat gegen die installierte 2082 prüfen
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          APK="release/$LUMO_APK_NAME"
          "$BT/aapt" dump badging "$APK" | head -1 | tee build-proof/APK-BADGING.txt
          PKG="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" build-proof/APK-BADGING.txt)"
          VC="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" build-proof/APK-BADGING.txt)"
          "$BT/apksigner" verify --print-certs "$APK" | tee build-proof/APK-SIGNER.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build-proof/APK-SIGNER.txt)"
          EXPECTED_CERT=a6b1ef61bf59db4e0794c742aeb3b5506d130f4d21175c9975140e6acdb80702
          test "$PKG" = dev.ullmann.lumo.lumo_lernen.coachpreview
          test "$CERT" = "$EXPECTED_CERT"
          EXPECTED_VC="$(python3 -c 'import json; print(json.load(open("build-proof/CANDIDATE-SOURCE.json"))["versionCode"])')"
          test "$VC" -eq "$EXPECTED_VC"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c %s "$APK")"
          printf 'package=%s\nversionCode=%s\ncert_sha256=%s\napk=%s\napk_sha256=%s\napk_bytes=%s\n' "$PKG" "$VC" "$CERT" "$LUMO_APK_NAME" "$SHA" "$SIZE" | tee build-proof/APK-IDENTITY-ABSCHLUSS.txt
          cat build-proof/APK-IDENTITY-ABSCHLUSS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: APK und Belege als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUMO-TEST-APK-${{ github.run_id }}
          # Nur die APK und die kleinen Belege; die APK ist bereits komprimiert.
          path: |
            release/
            build-proof/*.txt
            build-proof/*.json
            build-proof/room/*.png
            .ci-results/achievements/*.png
          if-no-files-found: warn
          compression-level: 0

  android-tour:
    name: Installierte APK im Android-Emulator prüfen
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LUMO-EMULATOR-APK-${{ github.run_id }}
          path: candidate/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: LUMO-EMULATOR-APK-45569841812
          run-id: 45569841812
          github-token: ${{ github.token }}
          path: baseline/x86_64
      - name: Emulator und Prüftools vorbereiten
        run: |
          set -euo pipefail
          mkdir -p tour
          cp candidate/x86_64/SPLIT-APK-IDENTITY.json tour/SPLIT-APK-IDENTITY.json
          sudo chmod a+rw /dev/kvm
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr-deu tesseract-ocr-eng
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          awk '{print $1 "  dist/x86_64/Lumo-Lernen-Neu.apk"}' candidate/x86_64/SHA256SUMS.txt > candidate/ANDROID-TOUR-SHA256SUMS.txt
      - name: Mesa-Software-Anzeige für das Emulator-GL starten
        # SwiftShader (swiftshader_indirect) linkt Godots gl_compatibility-Shader nicht
        # ("Fragment shader active uniforms exceed GL_MAX_FRAGMENT_UNIFORM_VECTORS (261)",
        # Lauf 44473804677): Godot zeigte nur die Clear-Farbe, die Tour fand keine Knöpfe.
        # -gpu host über Mesa llvmpipe ist der Weg der übrigen Android-Touren.
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > tour/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > tour/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -Fi 'llvmpipe' tour/mesa-renderer.txt
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
          LUMO_NATIVE_START_DIAGNOSTICS: '1'
          LUMO_NATIVE_START_WAIT: '35'
          LUMO_NATIVE_START_BUDGET: '1200'
          LUMO_ANDROID_SKYPOST_PROBE: '1'
          LUMO_CANDIDATE_SOURCE_SHA: ${{ github.sha }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-build: '14472402'
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            .probe-venv/bin/python .github/probes/modernization_android_tour.py --apk candidate/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/x86_64/BUILD-PROVENANCE.json --sums candidate/ANDROID-TOUR-SHA256SUMS.txt --out tour
            .probe-venv/bin/python .github/probes/lumo_parent_insight_android_probe.py --apk candidate/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/x86_64/BUILD-PROVENANCE.json --sums candidate/ANDROID-TOUR-SHA256SUMS.txt --out tour/parent-insight || echo "Elternkennzahlen-Probe nicht bestanden (erste Emulatorausführung, nicht blockierend; siehe tour/parent-insight)"
            .probe-venv/bin/python .github/probes/lumo_local_backup_android_probe.py --apk candidate/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/x86_64/BUILD-PROVENANCE.json --sums candidate/ANDROID-TOUR-SHA256SUMS.txt --out tour/local-backup
            # This runner holds only fictional profiles made by the preceding probes.
            test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" = 1
            adb uninstall dev.ullmann.lumo.lumo_lernen.coachpreview
            .probe-venv/bin/python .github/probes/lumo_intelligence_update_android_probe.py --baseline baseline/x86_64/Lumo-Lernen-Neu.apk --candidate candidate/x86_64/Lumo-Lernen-Neu.apk --out tour/update
      - name: Beobachtete native Spielstarts verbindlich prüfen
        run: python3 scripts/verify_native_start_diagnostics.py tour/native-starts.json --out tour/NATIVE-GAME-STARTS.json
      - name: Abgeschlossene Android-Prüfbelege zum selben Kandidaten bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_ANDROID_EVIDENCE'
          import json
          import os
          from pathlib import Path
          import zipfile

          backup = json.loads(Path('tour/local-backup/backup-result.json').read_text())
          if backup.get('status') != 'PASS':
              raise RuntimeError('The real Android backup roundtrip has not passed')
          required = {'apk-identity', 'fictional-profile', 'saf-export', 'export-archive',
                      'changed-setting', 'saf-review', 'process-closed', 'restore-and-preservation'}
          passed = {row['step'] for row in backup.get('steps', []) if row.get('ok') is True}
          if not required <= passed:
              raise RuntimeError('Incomplete Android backup evidence')
          update = json.loads(Path('tour/update/update-result.json').read_text())
          if update.get('status') != 'PASS' or update.get('offline') is not True:
              raise RuntimeError('The in-place upgrade and offline checks did not pass')
          if not Path('tour/NATIVE-GAME-STARTS.json').is_file():
              raise RuntimeError('Missing mandatory native game gate evidence')
          # Elternkennzahlen (Intelligence 2.0): erste echte Emulatorausführung.
          # Ergebnis wird immer ausgewiesen, blockiert diesen Lauf aber noch nicht.
          insight = Path('tour/parent-insight/parent-insight-result.json')
          status = json.loads(insight.read_text()).get('status') if insight.is_file() else 'FEHLT'
          print(f'Elternkennzahlen-Probe: {status}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Elternkennzahlen-Probe (Emulator): {status}\n')
          with zipfile.ZipFile('LUMO-ANDROID-PRUEFBELEGE.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('tour').rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path))
          PY_ANDROID_EVIDENCE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LUMO-ANDROID-TOUR-${{ github.run_id }}
          path: |
            tour/
            LUMO-ANDROID-PRUEFBELEGE.zip


  publish:
    name: Abgenommenen ARM64-Build veröffentlichen
    needs: [apk, android-tour]
    if: github.repository == 'Ullmann27/lumo-lernen' && github.ref_name == 'integration/lumo-final-release-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Veröffentlichungsauftrag lesen
        id: order
        run: |
          set -euo pipefail
          jq -r '"publish=" + ((.publish == true) | tostring)' \
            config/intelligence-2-0-apk-request.json >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.order.outputs.publish == 'true'
        with:
          name: LUMO-TEST-APK-${{ github.run_id }}
          path: candidate
      - name: Unveränderte APK aus diesem Lauf veröffentlichen und öffentlich nachprüfen
        if: steps.order.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd candidate/release
          VERSION="$(jq -r '.version' ../../config/intelligence-2-0-apk-request.json)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]
          APK="Lumo-Lernen-Test-${VERSION/+/-}.apk"
          TAG="lumo-test-${VERSION/+/-}-$GITHUB_RUN_ID"
          sha256sum --check --strict SHA256SUMS.txt
          DIGEST="$(sha256sum "$APK" | cut -d ' ' -f1)"
          test "$DIGEST" = "$(jq -r .sha256 BUILD-PROVENANCE.json)"
          test "$GITHUB_SHA" = "$(jq -r .flutter_source_commit BUILD-PROVENANCE.json)"
          test "$(jq -r .revision ../../config/godot-source.json)" = "$(jq -r .godot.revision BUILD-PROVENANCE.json)"
          test "$VERSION" = "$(jq -r '.versionName + "+" + (.versionCode | tostring)' BUILD-PROVENANCE.json)"
          test "$(stat -c %s "$APK")" = "$(jq -r .bytes BUILD-PROVENANCE.json)"
          test "$(jq -r '.abis | join(",")' BUILD-PROVENANCE.json)" = arm64-v8a
          test "$(jq -r .package BUILD-PROVENANCE.json)" = dev.ullmann.lumo.lumo_lernen.coachpreview
          test "$(jq -r .signingCertificateSha256 BUILD-PROVENANCE.json)" = a6b1ef61bf59db4e0794c742aeb3b5506d130f4d21175c9975140e6acdb80702
          gh release create "$TAG" "$APK" SHA256SUMS.txt APK-VERIFICATION.json \
            BUILD-PROVENANCE.json SPLIT-APK-IDENTITY.json LUMO-INTEGRATIONSBELEGE.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lumo Test-APK $VERSION" \
            --notes "Signierte ARM64-Test-APK. Abnahme und Herkunft: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --prerelease --latest=false
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK"
          curl --fail --silent --show-error --location --retry 4 "$URL" -o "$RUNNER_TEMP/lumo-public.apk"
          test "$(sha256sum "$RUNNER_TEMP/lumo-public.apk" | cut -d ' ' -f1)" = "$DIGEST"
          printf '[Android-Download](%s) · SHA-256 `%s`\n' "$URL" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
