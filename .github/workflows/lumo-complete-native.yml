name: Lumo creative games Android update and runtime
on:
  push:
    branches: [chatgpt/lumo-complete-games-2026-10-07]
    paths: [.github/workflows/lumo-complete-native.yml, .github/probes/creative_android_probe.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumo-complete-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37576067479
          name: lumo-install-candidate-37576067479
          path: baseline/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37617936184
          name: lumo-complete-apk-37617936184
          path: candidate/
      - name: Prepare isolated UI reader and screenshot OCR
        run: |
          mkdir -p native-proof
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep tesseract-ocr tesseract-ocr-deu xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          .probe-venv/bin/python -m pip freeze > native-proof/dependencies.txt
          python3 -m py_compile .github/probes/creative_android_probe.py
          cp candidate/BUILD-PROVENANCE.json candidate/APK-VERIFICATION.json native-proof/
      - name: Enable accelerated disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Start verified Mesa software display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > native-proof/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > native-proof/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          rg -i 'OpenGL renderer string:.*llvmpipe' native-proof/mesa-renderer.txt
      - name: Update without data clearing and exercise actual native games offline
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: .probe-venv/bin/python .github/probes/creative_android_probe.py --baseline baseline/Lumo-Lernen-Neu.apk --candidate candidate/Lumo-Lernen-Neu.apk --out native-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-complete-native-evidence-${{ github.run_id }}
          path: native-proof/
          if-no-files-found: error
          retention-days: 14
