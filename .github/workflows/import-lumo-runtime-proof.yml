name: Archive actual six-track Lumo runtime screenshot
on:
  push:
    branches: [codex/lumo-reference-assets-2026-10-10]
    paths: ['.github/workflows/import-lumo-runtime-proof.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify user-supplied actual Godot capture collage
        shell: bash
        run: |
          set -euo pipefail
          dest=docs/design/2026-10-10-lumo-games/references
          mkdir -p "$dest"
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JBiq3Q9vttoZVrKhdbYLuTHXre/33adde91-7030-473a-8b3a-0bc5fc64b7e1.png' -o "$dest/KART_RUNTIME_6_TRACKS_2026-10-10.png"
          echo '7a7e87559ca49effdab520b7ad49c568d88395b378581d910627eb5d311a1e63  '$dest'/KART_RUNTIME_6_TRACKS_2026-10-10.png' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest/KART_RUNTIME_6_TRACKS_2026-10-10.png"
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: archive six actual gameplay screenshots as visual baseline'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
