# Arbeitsumgebung fuer den GitHub-Copilot-Agenten.
# GitHub fuehrt diesen Job aus, bevor Copilot arbeitet. So hat Copilot Flutter
# und kann selbst `flutter analyze`, `flutter test` und Golden-Screenshots
# ausfuehren, statt ungeprueften Code zu pushen.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Der Job muss genau so heissen, sonst nutzt Copilot ihn nicht.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Flutter-Abhaengigkeiten holen und pruefen
        run: |
          flutter --version
          flutter pub get
          # Nur zur Information; Fehler hier duerfen die Umgebung nicht blockieren.
          flutter analyze --no-fatal-infos --no-fatal-warnings || true
