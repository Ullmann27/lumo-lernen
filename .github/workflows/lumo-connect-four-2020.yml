name: LUMO Connect Four 2020 signed test candidate
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: lumo-connect-four-2020-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  connect-four-runtime:
    if: >-
      github.repository == 'Ullmann27/lumo-lernen' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref == 'integration/lumo-c4-connections-20261114' ||
      github.head_ref == 'work/lumo-play-quality-20261114')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      native-revision: ${{ steps.pin.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Bind the approved 2020 host and exact native source
        id: pin
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PYCODE'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from verify_legacy_release_pin import verify
          build, native = verify(Path('pubspec.yaml').read_text(), Path('config/godot-source.json').read_text())
          assert build == 2020, 'Only the explicit 2020 C4 candidate is accepted'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + native + '\n')
          PYCODE
      - uses: actions/checkout@v4
        with:
          repository: Ullmann27/lumo-godot
          ref: ${{ steps.pin.outputs.revision }}
          path: native-source
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Prepare genuine desktop renderer dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0 fonts-noto-color-emoji
          python3 -m venv .c4-python
          .c4-python/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0
          flutter pub get --enforce-lockfile
          command -v xvfb-run
      - name: Install the actual pinned Godot engine
        run: bash scripts/install_godot_for_build.sh
      - name: Import the exact configured native source in its own directory
        env:
          NATIVE_REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git -C native-source rev-parse HEAD)" = "$NATIVE_REVISION"
          mkdir -p c4-runtime
          export XDG_DATA_HOME="$RUNNER_TEMP/c4-import/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/c4-import/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/c4-import/cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          (cd native-source && timeout 300s godot --headless --audio-driver Dummy --editor --import) 2>&1 | tee c4-runtime/original-import.log
          if grep -En 'ERROR:|SCRIPT ERROR:|Parse Error:' c4-runtime/original-import.log; then
            echo 'Actual C4 source import failed' >&2
            exit 1
          fi
      - name: Require the actual production Dart and rendered Godot two-process gate
        run: |
          set -euo pipefail
          .c4-python/bin/python scripts/run_connect_four_runtime.py --host "$GITHUB_WORKSPACE" --native "$GITHUB_WORKSPACE/native-source" --output "$GITHUB_WORKSPACE/c4-runtime/runtime"
      - name: Preserve every original C4 runtime result and rendered frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-connect-four-2020-desktop-runtime
          path: c4-runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  android-host-compile:
    if: >-
      github.repository == 'Ullmann27/lumo-lernen' &&
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref == 'integration/lumo-c4-connections-20261114' ||
      github.head_ref == 'work/lumo-play-quality-20261114'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Compile actual current Android host before native release pin approval
        run: bash scripts/compile_android_host.sh
      - name: Bind actual compiled C4 Activity bridge and Binder bytecode
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, subprocess
          from pathlib import Path
          classes = {}
          for name in ('ConnectFourGameActivity', 'ConnectFourAuthorityService', 'ConnectFourBridge'):
              paths = sorted(Path('build/app').rglob(name + '.class'))
              assert paths, 'Actual current C4 bytecode missing: ' + name
              classes[name] = []
              for path in paths:
                  data = path.read_bytes()
                  assert data.startswith(bytes.fromhex('cafebabe')), 'Invalid actual C4 class'
                  classes[name].append({'path':str(path), 'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()})
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          Path('host-compile-evidence/connect-four-classes.json').write_text(json.dumps(
              {'status':'PASS','source':source,'classes':classes}, indent=2) + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-connect-four-2020-android-host-compile
          path: host-compile-evidence/
          if-no-files-found: error
          retention-days: 30

  verify-and-build:
    needs: [android-host-compile, connect-four-runtime]
    if: >-
      github.repository == 'Ullmann27/lumo-lernen' &&
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref == 'integration/lumo-c4-connections-20261114' ||
      github.head_ref == 'work/lumo-play-quality-20261114'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      candidate-artifact-id: ${{ steps.upload-candidate.outputs.artifact-id }}
      candidate-artifact-digest: ${{ steps.upload-candidate.outputs.artifact-digest }}
    env:
      LUMO_SPLIT_PER_ABI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Save source identity and validate exact Godot integration pin
        run: |
          set -euo pipefail
          mkdir -p dist
          git rev-parse HEAD | tee dist/BUILD-SOURCE.txt
          cat config/godot-source.json | tee dist/GODOT-SOURCE.json
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from verify_legacy_release_pin import verify
          build, native = verify(Path("pubspec.yaml").read_text(), Path("config/godot-source.json").read_text())
          assert build == 2020, "C4 test workflow requires build 2020"
          from release_pipeline_gates import parse_pubspec_version
          assert parse_pubspec_version(Path("pubspec.yaml").read_text())[1] == 2020, "Wrong C4 test candidate version"
          config=json.load(open("config/godot-source.json"))
          assert config["repository"]=="https://github.com/Ullmann27/lumo-godot.git", "Unexpected Godot repository"
          assert isinstance(config["revision"], str) and re.fullmatch(r"[0-9a-f]{40}", config["revision"]), "Godot source must be an immutable 40-character Git SHA"
          assert config["engine"]=="4.6.3", "Unexpected Godot engine"
          # Historical bad sources remain rejected on this separate candidate.
          # Actual rendered review exposed native menu geometry defects.
          # This workflow revision rejects the measured candidates on every run.
          # It cannot alter historical workflow revisions used by older runs.
          rejected_android_layout_sources = {
              "0aa89cdea3a07d0c2bc0a31a153737a1fee41454":
                  "Android 2400x1080: header/tab overlap and landing model occlusion",
              "f04e580ec0d7d8f70e8be269523fabedd15b0766":
                  "Android 2400x1080: selected kart card exceeds visible scroll viewport",
          }
          assert config["revision"] not in rejected_android_layout_sources, (
              "Rejected Android menu layout: " + rejected_android_layout_sources.get(config["revision"], "")
          )
          # scripts/export_embedded_game.py subsequently fetches/checks out this
          # exact SHA, then compares its HEAD before packaging the native PCK.
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install real system emoji for ABC screenshots and Flutter test suite
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y fonts-noto-color-emoji
          test -s /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
      - name: Resolve immutable Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Audit every exact current-grade learning family on this candidate
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          audit_dir="$GITHUB_WORKSPACE/.ci-results/learning-curriculum-audit"
          mkdir -p "$audit_dir"
          dart run tools/audit_learning_tasks_all_grades.dart "$audit_dir" 2> "$audit_dir/audit.stderr.log" | tee "$audit_dir/audit.stdout.log"
          python3 scripts/verify_connect_four_delivery.py bind-learning-audit --directory "$audit_dir" --source "$SOURCE_SHA" --build-run "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve the original current-source learning family audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-connect-four-2020-learning-curriculum-audit
          path: .ci-results/learning-curriculum-audit/
          if-no-files-found: error
          retention-days: 30
      - name: Flutter static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Real widget tests for premium quiz and 3D learning islands
        run: |
          flutter test --no-pub --reporter=expanded --timeout=60s --concurrency=2 \
            test/quiz_premium_stage_layout_test.dart \
            test/quiz_premium_stage_visual_capture_test.dart \
            test/home_navigation_progress_test.dart \
            test/home_subject_islands_premium_test.dart \
            test/academy_grade_3_4_visible_navigation_test.dart \
            test/lumo_scene_art_panel_test.dart \
            test/learning_lab_runtime_test.dart \
            test/parents/parent_school_grade_progression_test.dart
      - name: Save genuine rendered Quizshow screenshots for reference comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-1983-quiz-studio-captures
          path: .ci-results/quiz-premium-stage/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Full Flutter regression suite including every capture
        env:
          REQUIRE_ALL_TESTS: 'true'
        run: |
          set -euo pipefail
          if [ "$REQUIRE_ALL_TESTS" = true ]; then
            python3 scripts/run_full_flutter_acceptance.py --output .ci-results/full-acceptance
          else
            flutter test --no-pub --reporter=expanded --timeout=60s --concurrency=2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-candidate-all-flutter-tests-and-captures
          path: .ci-results/full-acceptance/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Capture and verify actual 2001 tutor, transfer and daily-plan routes
        if: hashFiles('test/design/lumo_tutor_brain_capture_test.dart') != ''
        env:
          LUMO_TUTOR_BRAIN_CAPTURES: .ci-results/tutor-2001
        run: flutter test --no-pub --reporter=expanded test/design/lumo_tutor_brain_capture_test.dart
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.ci-results/tutor-2001/*.png') != ''
        with:
          name: lumo-tutor-2001-actual-flutter-captures
          path: .ci-results/tutor-2001/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Capture spatial reading, answer retry and subject cards on phone and Fold
        env:
          LUMO_SPATIAL_CAPTURES: visual-evidence/1988/spatial-reading
        run: flutter test --no-pub --reporter=expanded test/design/lumo_spatial_reading_capture_test.dart
      - name: Install actual app-script verification dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y ripgrep ffmpeg
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0
          command -v rg
          command -v ffmpeg
          command -v ffprobe
          .ci-python/bin/python -c 'from PIL import Image; print("App-script image verification ready")'
      - name: Install verified Gradle for the real build-contract probe
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-9.1.0-bin.zip -o "$RUNNER_TEMP/lumo-gradle.zip"
          printf '%s  %s\n' a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806 "$RUNNER_TEMP/lumo-gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lumo-gradle.zip" -d "$RUNNER_TEMP/lumo-verified-gradle"
          echo "$RUNNER_TEMP/lumo-verified-gradle/gradle-9.1.0/bin" >> "$GITHUB_PATH"
      - name: Verify all build and preservation contracts
        env:
          REQUIRE_ALL_TESTS: 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci-results
          .ci-python/bin/python -m unittest discover -s scripts/tests -v 2>&1 | tee .ci-results/build-contracts.log
          if [ "$REQUIRE_ALL_TESTS" = true ] && grep -Eq '^OK \(skipped=|^FAILED.*skipped=' .ci-results/build-contracts.log; then
            echo 'Build acceptance rejects skipped contract tests.' >&2
            exit 1
          fi
      - name: Preserve the complete original script contracts for PCM delivery replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-connect-four-2020-build-contracts
          path: .ci-results/build-contracts.log
          if-no-files-found: error
          retention-days: 30
      - name: Code-level Android probe regression with verified image dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y tesseract-ocr tesseract-ocr-deu
          .ci-python/bin/python -c 'from PIL import Image; print("Pillow ready", Image.__version__ if hasattr(Image, "__version__") else "ok")'
          .ci-python/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_*.py' -v
      - name: Reject unreadable Ahem-font captures before issuing visual proof
        run: |
          set -euo pipefail
          .ci-python/bin/python -m unittest discover -s tools/qa/tests -p 'test_verify_capture_fonts.py' -v
          .ci-python/bin/python tools/qa/verify_capture_fonts.py visual-evidence
      - name: Verify pin-scoped Godot GLB JPEG cleanup and preserve-source safety
        run: python3 -m unittest discover -s scripts/tests -p 'test_export_embedded_game.py' -v
      - name: Render actual premium lessons on phone and Fold
        env:
          LUMO_LESSON_CAPTURES: visual-evidence/1978/lessons
        run: flutter test --no-pub --reporter=expanded test/design/lesson_premium_capture_test.dart
      - name: Render actual app sections on phone and Fold
        env:
          LUMO_TOUR_DIR: visual-evidence/1978/tour
          LUMO_TOUR_CAPTURE_SCALE: '1'
        run: flutter test --no-pub --reporter=expanded test/design/app_tour_capture_test.dart
      - name: Render playable Connect Four on five real layout sizes
        env:
          LUMO_CONNECT_CAPTURES: visual-evidence/1978/connect_four
        run: flutter test --no-pub --reporter=expanded test/design/connect_four_visual_test.dart
      - name: Render genuine offline atelier on phone and Fold
        env:
          LUMO_LAB_CAPTURES: visual-evidence/1981/atelier
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter=expanded --timeout=60s test/design/learning_lab_visual_capture_test.dart
          for device in phone fold-open fold-cover-large-text; do
            for phase in example build; do
              test -s "visual-evidence/1981/atelier/${device}-${phase}.png"
            done
          done
      - name: Archive only verified readable Flutter captures
        uses: actions/upload-artifact@v4
        with:
          name: lumo-1981-real-flutter-captures
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Install Godot 4.6.3 for the exact pinned Kart source
        run: bash scripts/install_godot_for_build.sh
      - name: Require actual gameplay gates on the exact pinned native source
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          REQUIRE_TECHNICAL_ART: 'true'
          REQUIRE_ACTION_STAGE: 'true'
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri libglx-mesa0 ffmpeg
          export PATH="$GITHUB_WORKSPACE/.ci-python/bin:$PATH"
          native_revision="$(python3 -c 'import json; print(json.load(open("config/godot-source.json"))["revision"])')"
          native_source="$RUNNER_TEMP/lumo-native-acceptance"
          native_logs="$GITHUB_WORKSPACE/acceptance-native"
          mkdir -p "$native_logs/user-data/godot/app_userdata/Lumo 3D"
          git init "$native_source"
          git -C "$native_source" remote add origin https://github.com/Ullmann27/lumo-godot.git
          git -C "$native_source" fetch --depth 1 origin "$native_revision"
          git -C "$native_source" checkout --detach FETCH_HEAD
          test "$(git -C "$native_source" rev-parse HEAD)" = "$native_revision"
          printf '%s\n' "$native_revision" > "$native_logs/source-sha.txt"
          export XDG_DATA_HOME="$native_logs/user-data"
          export XDG_CONFIG_HOME="$native_logs/user-config"
          export XDG_CACHE_HOME="$native_logs/user-cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          cd "$native_source"
          python3 -c 'from PIL import Image; print("Pinned-native raster verification ready")'
          python3 tools/validate_project.py 2>&1 | tee "$native_logs/project.log"
          bash tools/validate_project.sh 2>&1 | tee "$native_logs/legacy-gameplay.log"
          LUMO_2014_LOG_DIR="$native_logs/2014" bash tools/validate_2014.sh
          if [ "$REQUIRE_TECHNICAL_ART" = true ]; then
            LUMO_ART_LOG_DIR="$native_logs/technical-art" bash tools/validate_technical_art.sh
          fi
          if [ "$REQUIRE_ACTION_STAGE" = true ]; then
            LUMO_ACTION_LOG_DIR="$native_logs/action-stage" bash tools/validate_action_stage.sh
          fi
          LUMO_NEXTGEN_LOG_DIR="$native_logs/nextgen" bash tools/validate_nextgen.sh 2>&1 | tee "$native_logs/nextgen-runner.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-candidate-pinned-native-gameplay
          path: acceptance-native/
          if-no-files-found: warn
          retention-days: 30
      - name: Build unified real Android APK
        run: bash scripts/build_unified_apk.sh
      - name: Verify APK archive and collect reproducible source hashes
        run: |
          set -euo pipefail
          test -s dist/Lumo-Lernen-Neu.apk
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk --abi arm64-v8a
          sha256sum dist/Lumo-Lernen-Neu.apk | tee dist/APK-SHA256.txt
          test -s dist/APK-VERIFICATION.json
          test -s dist/BUILD-PROVENANCE.json
          python3 scripts/verify_unified_apk.py dist/x86_64/Lumo-Lernen-Neu.apk --abi x86_64
          sha256sum dist/x86_64/Lumo-Lernen-Neu.apk > dist/ANDROID-TOUR-SHA256SUMS.txt
          grep '^version:' pubspec.yaml | tee dist/APP-VERSION.txt
      - name: Upload exact candidate (no release or synthetic screenshots)
        id: upload-candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-connect-four-2020-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Deliver verified ARM64 APK separately for direct download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-connect-four-2020-arm64-verified
          path: |
            dist/Lumo-Lernen-Neu.apk
            dist/APK-SHA256.txt
            dist/APK-VERIFICATION.json
            dist/BUILD-PROVENANCE.json
            dist/GODOT-SOURCE.json
            dist/APP-VERSION.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  android-c4:
    needs: [verify-and-build, android-host-compile, connect-four-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      NATIVE_REVISION: ${{ needs.connect-four-runtime.outputs.native-revision }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify-and-build.outputs.candidate-artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
          merge-multiple: true
          path: candidate/dist/
      - name: Live UI reader
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p tour
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          command -v tesseract
          tesseract --list-langs 2>&1 | tee tour/tesseract-installed-languages.txt
          grep -Fxq 'deu' tour/tesseract-installed-languages.txt
          grep -Fxq 'eng' tour/tesseract-installed-languages.txt
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          python3 -m py_compile .github/probes/modernization_android_tour.py .github/probes/lumo_connect_four_android_probe.py
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_nextgen*.py' -v
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_studio*.py' -v
          sha256sum candidate/dist/x86_64/Lumo-Lernen-Neu.apk | tee tour/tested-apk-sha256.txt
      - name: Enable accelerated disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Software display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > tour/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > tour/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -i 'OpenGL renderer string' tour/mesa-renderer.txt
      - name: Read current original run jobs and exact upload metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tour/metadata
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > tour/metadata/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > tour/metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > tour/metadata/artifacts.json
      - name: Install and tour the exact APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          LUMO_NATIVE_STAGE_MENU: '1'
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell getprop ro.build.version.sdk > tour/android-sdk.txt
            adb shell getprop ro.build.version.release > tour/android-release.txt
            "$ANDROID_HOME/emulator/emulator" -version > tour/android-emulator-version.txt 2>&1
            .probe-venv/bin/python .github/probes/modernization_android_tour.py --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/dist/x86_64/BUILD-PROVENANCE.json --sums candidate/dist/ANDROID-TOUR-SHA256SUMS.txt --out tour/main
            .probe-venv/bin/python .github/probes/lumo_connect_four_android_probe.py --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/dist/x86_64/BUILD-PROVENANCE.json --sums candidate/dist/ANDROID-TOUR-SHA256SUMS.txt --prior-tour tour/main/tour-result.json --metadata-dir tour/metadata --expected-source "$SOURCE_SHA" --expected-native "$NATIVE_REVISION" --build-run "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --artifact-id "$CANDIDATE_ARTIFACT_ID" --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" --out tour/c4
      - name: Preserve complete actual main-tour and C4 Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-connect-four-2020-android-c4
          path: tour/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  update-2020-from-2017:
    # Independent emulator and original baseline; the complete update remains
    # mandatory before this test candidate receives its verification report.
    needs: [verify-and-build]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
          merge-multiple: true
          path: candidate/dist/
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13948686178'
          merge-multiple: true
          path: baseline/dist/
          run-id: 43220602252
          github-token: ${{ github.token }}
      - name: Live UI reader
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p tour
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          command -v tesseract
          tesseract --list-langs 2>&1 | tee tour/tesseract-installed-languages.txt
          grep -Fxq 'deu' tour/tesseract-installed-languages.txt
          grep -Fxq 'eng' tour/tesseract-installed-languages.txt
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          python3 -m py_compile .github/probes/lumo_2003_update_android_probe.py .github/probes/lumo_2020_update_android_probe.py
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_update*preservation.py' -v
          sha256sum candidate/dist/x86_64/Lumo-Lernen-Neu.apk | tee tour/tested-apk-sha256.txt
      - name: Enable accelerated disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Software display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > tour/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > tour/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -i 'OpenGL renderer string' tour/mesa-renderer.txt
      - name: Preserve actual 2017 learning through an in-place 2020 upgrade
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
          LUMO_CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: .probe-venv/bin/python .github/probes/lumo_2020_update_android_probe.py --baseline baseline/dist/x86_64/Lumo-Lernen-Neu.apk --candidate candidate/dist/x86_64/Lumo-Lernen-Neu.apk --out tour
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-connect-four-2020-in-place-update-proof
          path: tour/
          retention-days: 30

  verify-c4-candidate:
    needs: [verify-and-build, android-host-compile, connect-four-runtime, android-c4, update-2020-from-2017]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify-and-build.outputs.candidate-artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install actual signature manifest and raster verification tools
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          python3 -m venv .c4-verify
          .c4-verify/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
          merge-multiple: true
          path: candidate/dist/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-desktop-runtime
          path: proofs/runtime/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-android-host-compile
          path: proofs/host/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-android-c4
          path: proofs/android/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-in-place-update-proof
          path: proofs/update/
      - name: Bind final original jobs and immutable candidate upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p proofs/metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > proofs/metadata/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > proofs/metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > proofs/metadata/artifacts.json
      - name: Reverify both signed APKs and every mandatory current C4 and update proof
        run: |
          set -euo pipefail
          .c4-verify/bin/python scripts/verify_connect_four_candidate.py --source "$SOURCE_SHA" --build-run "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --artifact-id "$CANDIDATE_ARTIFACT_ID" --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" --candidate candidate/dist --runtime proofs/runtime/runtime --host-compile proofs/host --android proofs/android --update proofs/update --metadata proofs/metadata --out C4-CANDIDATE-FACTS.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-connect-four-2020-candidate-verification
          path: |
            C4-CANDIDATE-FACTS.json
            proofs/metadata/
          if-no-files-found: error
          retention-days: 30

  prepare-c4-delivery:
    needs: [verify-and-build, android-host-compile, connect-four-runtime, android-c4, update-2020-from-2017, verify-c4-candidate]
    if: >-
      github.repository == 'Ullmann27/lumo-lernen' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref == 'integration/lumo-c4-connections-20261114' ||
      github.head_ref == 'work/lumo-play-quality-20261114') &&
      needs.verify-and-build.result == 'success' &&
      needs.android-host-compile.result == 'success' &&
      needs.connect-four-runtime.result == 'success' &&
      needs.android-c4.result == 'success' &&
      needs.update-2020-from-2017.result == 'success' &&
      needs.verify-c4-candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      delivery-artifact-id: ${{ steps.upload-delivery.outputs.artifact-id }}
      delivery-artifact-digest: ${{ steps.upload-delivery.outputs.artifact-digest }}
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      NATIVE_REVISION: ${{ needs.connect-four-runtime.outputs.native-revision }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify-and-build.outputs.candidate-artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Ullmann27/lumo-godot
          ref: ${{ needs.connect-four-runtime.outputs.native-revision }}
          path: native-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Prepare actual APK signature and original raster verification
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0'
          python3 -m venv .c4-delivery
          .c4-delivery/bin/python -m pip install --disable-pip-version-check Pillow==12.3.0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-and-build.outputs.candidate-artifact-id }}
          merge-multiple: true
          path: candidate/dist/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-desktop-runtime
          path: proofs/runtime/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-android-host-compile
          path: proofs/host/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-android-c4
          path: proofs/android/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-in-place-update-proof
          path: proofs/update/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-candidate-verification
          path: proofs/final/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-build-contracts
          path: proofs/contracts/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-candidate-pinned-native-gameplay
          path: proofs/native/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-connect-four-2020-learning-curriculum-audit
          path: proofs/learning/
      - name: Read exact current original acceptance and release catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p proofs/publication-metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > proofs/publication-metadata/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > proofs/publication-metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > proofs/publication-metadata/artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > proofs/publication-metadata/pull.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > proofs/publication-metadata/releases.json
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/coachpreview-build-2020" > proofs/publication-metadata/tags.json
      - name: Reverify actual current APKs C4 update PCM and complete native originals
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C native-source rev-parse HEAD)" = "$NATIVE_REVISION"
          .c4-delivery/bin/python scripts/verify_connect_four_delivery.py prepare \
            --source "$SOURCE_SHA" --build-run "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --pull-request "$PR_NUMBER" --artifact-id "$CANDIDATE_ARTIFACT_ID" --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --candidate candidate/dist --runtime proofs/runtime/runtime --host-compile proofs/host \
            --android proofs/android --update proofs/update --metadata proofs/publication-metadata \
            --facts proofs/final/C4-CANDIDATE-FACTS.json --build-contracts proofs/contracts \
            --native-evidence proofs/native --native-source native-source --learning-audit proofs/learning --out delivery
      - name: Preserve the complete verified 2020 ARM64 delivery bundle without publication
        id: upload-delivery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-connect-four-2020-delivery-bundle
          path: delivery/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve original verification evidence even when bundle preparation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-connect-four-2020-delivery-verification
          path: |
            delivery/audit/
            delivery/publication-plan.json
            delivery/assets/C4-DELIVERY-FACTS.json
            delivery/assets/PUBLISH-VERIFICATION.json
            proofs/publication-metadata/
            proofs/learning/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
