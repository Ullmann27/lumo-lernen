# QA-only acceptance: no application compilation or source mutation.
name: LUMO 2018 exact a31 Android recovery and delivery
'on':
  pull_request:
    branches:
    - chatgpt/lumo-nextgen-20261113
permissions:
  contents: read
  actions: read
concurrency:
  group: lumo-2018-android-recovery-${{ github.head_ref }}
  cancel-in-progress: true
env:
  APP_SOURCE_SHA: a31c0070a9c1e9dfbea08f123d7ed77e5f0a8ad9
  QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
defaults:
  run:
    working-directory: app
jobs:
  verify-reused-source:
    if: github.event_name == 'pull_request' && github.repository == 'Ullmann27/lumo-lernen' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/lumo-2018-android-acceptance-20261113' && github.base_ref == 'chatgpt/lumo-nextgen-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ env.APP_SOURCE_SHA }}
        path: app
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ env.QA_SOURCE_SHA }}
        path: acceptance
    - name: Install required real OCR and image test dependencies
      run: |
        set -euo pipefail
        sudo apt-get -o Acquire::Retries=2 update -qq
        sudo apt-get -o Acquire::Retries=2 install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
        tesseract --list-langs 2>&1 | tee "$RUNNER_TEMP/lumo-recovery-languages.txt"
        grep -Fxq deu "$RUNNER_TEMP/lumo-recovery-languages.txt"
        grep -Fxq eng "$RUNNER_TEMP/lumo-recovery-languages.txt"
        python3 -m venv "$GITHUB_WORKSPACE/.qa-python"
        "$GITHUB_WORKSPACE/.qa-python/bin/python" -m pip install --disable-pip-version-check Pillow==12.3.0
        mkdir -p recovery
    - name: Test recovery identities and every Android probe without skips
      working-directory: acceptance
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/.qa-python/bin/python" -m unittest scripts.tests.test_nextgen_retest -v 2>&1 | tee "$GITHUB_WORKSPACE/app/recovery/recovery-contracts.log"
        "$GITHUB_WORKSPACE/.qa-python/bin/python" -m unittest discover -s tools/android_qa/tests -p 'test_*.py' -v 2>&1 | tee "$GITHUB_WORKSPACE/app/recovery/all-probe-contracts.log"
        if grep -Eq '^OK \(skipped=|^FAILED.*skipped=' "$GITHUB_WORKSPACE/app/recovery/"*contracts.log; then
          echo 'Recovery acceptance rejects skipped tests.' >&2
          exit 1
        fi
    - name: Verify original successful jobs, actual archives and unchanged product sources
      env: &id001
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/.qa-python/bin/python" "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" preflight --app "$GITHUB_WORKSPACE/app" --qa "$GITHUB_WORKSPACE/acceptance" --out recovery
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lumo-2018-recovery-prerequisites
        path: app/recovery/
        if-no-files-found: error
        retention-days: 30
  android-tour:
    needs:
    - verify-reused-source
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ env.APP_SOURCE_SHA }}
        path: app
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ env.QA_SOURCE_SHA }}
        path: acceptance
    - name: Verify current source and download exact immutable evidence bytes
      env: *id001
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" download-current --kind prerequisites --qa "$GITHUB_WORKSPACE/acceptance" --out recovery --evidence acquisition
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" identity --app "$GITHUB_WORKSPACE/app" --qa "$GITHUB_WORKSPACE/acceptance" --receipt recovery/RETEST-IDENTITY.json --out acquisition/current-source
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" download --kind candidate --out candidate/dist --evidence acquisition
    - name: Live UI reader
      timeout-minutes: 8
      run: |
        set -euo pipefail
        mkdir -p tour
        cp recovery/RETEST-IDENTITY.json tour/RECOVERY-IDENTITY.json
        sudo apt-get -o Acquire::Retries=2 update -qq
        sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
        command -v tesseract
        tesseract --list-langs 2>&1 | tee tour/tesseract-installed-languages.txt
        grep -Fxq 'deu' tour/tesseract-installed-languages.txt
        grep -Fxq 'eng' tour/tesseract-installed-languages.txt
        python3 -m venv .probe-venv
        .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
        python3 -m py_compile .github/probes/modernization_android_tour.py "$GITHUB_WORKSPACE/acceptance/.github/probes/lumo_nextgen_surfaces_android_probe.py"
        .probe-venv/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/acceptance/tools/android_qa/tests" -p 'test_nextgen*.py' -v
        sha256sum candidate/dist/x86_64/Lumo-Lernen-Neu.apk | tee tour/tested-apk-sha256.txt
    - name: Enable accelerated disposable emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo udevadm settle
        sudo chmod a+rw /dev/kvm
    - name: Software display
      env:
        DISPLAY: :99
        LIBGL_ALWAYS_SOFTWARE: 'true'
        GALLIUM_DRIVER: llvmpipe
        LP_NUM_THREADS: '2'
      run: |
        Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > tour/xvfb.log 2>&1 &
        for attempt in $(seq 1 20); do
          if glxinfo -B > tour/mesa-renderer.txt 2>&1; then break; fi
          sleep 0.25
        done
        grep -i 'OpenGL renderer string' tour/mesa-renderer.txt
    - name: Install and tour the exact APK
      uses: reactivecircus/android-emulator-runner@v2
      env:
        LUMO_NATIVE_STAGE_MENU: '1'
        DISPLAY: :99
        LIBGL_ALWAYS_SOFTWARE: 'true'
        GALLIUM_DRIVER: llvmpipe
        LP_NUM_THREADS: '2'
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_5
        emulator-build: '14472402'
        ram-size: 3072M
        heap-size: 512M
        disable-animations: true
        emulator-boot-timeout: 300
        emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
        script: |
          .probe-venv/bin/python .github/probes/modernization_android_tour.py --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/dist/x86_64/BUILD-PROVENANCE.json --sums candidate/dist/ANDROID-TOUR-SHA256SUMS.txt --out tour
          .probe-venv/bin/python "$GITHUB_WORKSPACE/acceptance/.github/probes/lumo_nextgen_surfaces_android_probe.py" --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/dist/x86_64/BUILD-PROVENANCE.json --sums candidate/dist/ANDROID-TOUR-SHA256SUMS.txt --prior-tour tour/tour-result.json --out tour/nextgen
        working-directory: app
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lumo-2018-recovery-android-tour
        path: app/tour/
        retention-days: 30
  update-2018-from-2017:
    needs:
    - verify-reused-source
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ env.APP_SOURCE_SHA }}
        path: app
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ env.QA_SOURCE_SHA }}
        path: acceptance
    - name: Verify current source and download exact immutable evidence bytes
      env: *id001
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" download-current --kind prerequisites --qa "$GITHUB_WORKSPACE/acceptance" --out recovery --evidence acquisition
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" identity --app "$GITHUB_WORKSPACE/app" --qa "$GITHUB_WORKSPACE/acceptance" --receipt recovery/RETEST-IDENTITY.json --out acquisition/current-source
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" download --kind candidate --out candidate/dist --evidence acquisition
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" download --kind baseline --out baseline/dist --evidence acquisition
    - name: Live UI reader
      timeout-minutes: 8
      run: |
        set -euo pipefail
        mkdir -p tour
        cp recovery/RETEST-IDENTITY.json tour/RECOVERY-IDENTITY.json
        sudo apt-get -o Acquire::Retries=2 update -qq
        sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
        command -v tesseract
        tesseract --list-langs 2>&1 | tee tour/tesseract-installed-languages.txt
        grep -Fxq 'deu' tour/tesseract-installed-languages.txt
        grep -Fxq 'eng' tour/tesseract-installed-languages.txt
        python3 -m venv .probe-venv
        .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
        python3 -m py_compile .github/probes/lumo_2003_update_android_probe.py .github/probes/lumo_2018_update_android_probe.py
        .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p test_update_preservation.py -v
        sha256sum candidate/dist/x86_64/Lumo-Lernen-Neu.apk | tee tour/tested-apk-sha256.txt
    - name: Enable accelerated disposable emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo udevadm settle
        sudo chmod a+rw /dev/kvm
    - name: Software display
      env:
        DISPLAY: :99
        LIBGL_ALWAYS_SOFTWARE: 'true'
        GALLIUM_DRIVER: llvmpipe
        LP_NUM_THREADS: '2'
      run: |
        Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > tour/xvfb.log 2>&1 &
        for attempt in $(seq 1 20); do
          if glxinfo -B > tour/mesa-renderer.txt 2>&1; then break; fi
          sleep 0.25
        done
        grep -i 'OpenGL renderer string' tour/mesa-renderer.txt
    - name: Preserve actual 2017 learning through an in-place 2018 upgrade
      uses: reactivecircus/android-emulator-runner@v2
      env:
        DISPLAY: :99
        LIBGL_ALWAYS_SOFTWARE: 'true'
        GALLIUM_DRIVER: llvmpipe
        LP_NUM_THREADS: '2'
        LUMO_CANDIDATE_SOURCE_SHA: ${{ env.APP_SOURCE_SHA }}
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_5
        emulator-build: '14472402'
        ram-size: 3072M
        heap-size: 512M
        disable-animations: true
        emulator-boot-timeout: 300
        emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
        script: .probe-venv/bin/python .github/probes/lumo_2018_update_android_probe.py --baseline baseline/dist/x86_64/Lumo-Lernen-Neu.apk --candidate candidate/dist/x86_64/Lumo-Lernen-Neu.apk --out tour
        working-directory: app
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lumo-2018-recovery-update-proof
        path: app/tour/
        retention-days: 30
  publish-reviewed-2018:
    name: Publish exact a31 Build 2018 after all recovery gates
    needs:
    - verify-reused-source
    - android-tour
    - update-2018-from-2017
    if: github.event_name == 'pull_request' && github.repository == 'Ullmann27/lumo-lernen' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/lumo-2018-android-acceptance-20261113' && github.base_ref == 'chatgpt/lumo-nextgen-20261113' && needs.verify-reused-source.result == 'success' && needs.android-tour.result == 'success' && needs.update-2018-from-2017.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ env.APP_SOURCE_SHA }}
        path: app
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ env.QA_SOURCE_SHA }}
        path: acceptance
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        packages: platform-tools
    - name: Install APK signature and manifest verification tools
      run: sdkmanager 'build-tools;36.0.0'
    - name: Verify current source and download exact immutable evidence bytes
      env: *id001
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" download-current --kind prerequisites --qa "$GITHUB_WORKSPACE/acceptance" --out recovery --evidence acquisition
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" identity --app "$GITHUB_WORKSPACE/app" --qa "$GITHUB_WORKSPACE/acceptance" --receipt recovery/RETEST-IDENTITY.json --out acquisition/current-source
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" download --kind arm64 --out dist --evidence acquisition
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" download --kind compile --out proofs/host --evidence acquisition
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" download-current --kind tour --qa "$GITHUB_WORKSPACE/acceptance" --out proofs/tour --evidence acquisition
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" download-current --kind update --qa "$GITHUB_WORKSPACE/acceptance" --out proofs/update --evidence acquisition
    - name: Fetch the exact reviewed native artifact and acceptance identity
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import json
        from pathlib import Path
        receipt = json.loads(Path('config/nextgen-2018-visual-review.json').read_text())
        assert receipt['status'] == 'approved', 'Publication requires completed visual review'
        for name in ('native_workflow_run_id', 'native_artifact_id'):
            value = receipt[name]
            assert type(value) is int and value > 0
            Path('proofs/' + name + '.txt').write_text(str(value))
        PYCODE
        reviewed_run="$(cat proofs/native_workflow_run_id.txt)"
        reviewed_artifact="$(cat proofs/native_artifact_id.txt)"
        curl --fail --location --retry 3 "https://api.github.com/repos/Ullmann27/lumo-godot/actions/artifacts/$reviewed_artifact" --output proofs/native-artifact.json
        curl --fail --location --retry 3 "https://api.github.com/repos/Ullmann27/lumo-godot/actions/runs/$reviewed_run" --output proofs/native-run.json
        curl --fail --location --retry 3 "https://api.github.com/repos/Ullmann27/lumo-godot/actions/runs/$reviewed_run/jobs?per_page=100" --output proofs/native-jobs.json
    - name: Reverify actual ARM64 bytes and bind all live proofs to the reviewed 2018 source
      env:
        SOURCE_SHA: ${{ env.APP_SOURCE_SHA }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        python3 scripts/verify_legacy_release_pin.py
        sha256sum -c dist/APK-SHA256.txt
        python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk --abi arm64-v8a > dist/PUBLISH-VERIFICATION.json
        python3 scripts/verify_nextgen_delivery.py --source-sha "$SOURCE_SHA"
        cp config/nextgen-2018-visual-review.json dist/VISUAL-REVIEW.json
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" authorize-publication --app "$GITHUB_WORKSPACE/app" --qa "$GITHUB_WORKSPACE/acceptance" --receipt recovery/RETEST-IDENTITY.json --facts dist/RELEASE-FACTS.json --out proofs/recovery
    - name: Preserve existing releases and select create-or-verify
      id: release-state
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SOURCE_SHA: ${{ env.APP_SOURCE_SHA }}
      run: |
        set -euo pipefail
        gh api --paginate --slurp 'repos/Ullmann27/lumo-lernen/releases?per_page=100' > dist/RELEASE-PAGES.json
        gh api 'repos/Ullmann27/lumo-lernen/git/matching-refs/tags/coachpreview-build-2018' > dist/EXISTING-TAGS.json
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        pages = json.loads(Path('dist/RELEASE-PAGES.json').read_text())
        assert isinstance(pages, list) and all(isinstance(page, list) for page in pages)
        releases = [release for page in pages for release in page]
        existing = [release for release in releases if release['tag_name'] == 'coachpreview-build-2018']
        refs = json.loads(Path('dist/EXISTING-TAGS.json').read_text())
        assert isinstance(refs, list)
        exact_refs = [ref for ref in refs if ref['ref'] == 'refs/tags/coachpreview-build-2018']
        mode = 'create'
        if existing or exact_refs:
            assert len(existing) == 1 and len(exact_refs) == 1, 'Incomplete or conflicting immutable version already exists'
            release, ref = existing[0], exact_refs[0]
            assert release['draft'] is False and release['prerelease'] is True
            assert ref['object']['type'] == 'commit' and ref['object']['sha'] == os.environ['SOURCE_SHA'], 'Existing tag belongs to another source'
            assets = [asset for asset in release['assets'] if asset['name'] == 'Lumo-Lernen-Neu.apk']
            assert len(assets) == 1 and assets[0]['state'] == 'uploaded', 'Existing release has no completed APK'
            mode = 'verify-existing'
        Path('dist/RELEASES.json').write_text(json.dumps(releases))
        Path('dist/RELEASE-STATE.json').write_text(json.dumps({'mode': mode}) + '\n')
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write(f'mode={mode}\n')
        PY
        if [ "$(python3 -c 'import json; print(json.load(open("dist/RELEASE-STATE.json"))["mode"])')" = create ]; then
          python3 scripts/release_pipeline_gates.py --pubspec pubspec.yaml --verification dist/PUBLISH-VERIFICATION.json --apk dist/Lumo-Lernen-Neu.apk --releases-json dist/RELEASES.json
        else
          echo 'Existing release is preserved. Only public byte/source verification will run.'
        fi
    - name: Publish the tested file once under the installed family update channel
      if: steps.release-state.outputs.mode == 'create'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SOURCE_SHA: ${{ env.APP_SOURCE_SHA }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        {
          echo 'Lumo Lernen + Lumo Kart Build 2018, ARM64 test APK.'
          echo
          cat dist/RELEASE-FACTS.json
          echo
          cat proofs/recovery/RECOVERY-AUTHORIZATION.json
          echo
          echo "Acceptance workflow: $RUN_URL"
          echo 'The original workflow 43381440720 remains failed; only its verified successful build/Flutter/native/host jobs are reused. This independent recovery run repeats all live Android and update gates on the unchanged APK.'
          echo 'Full Flutter/native gates, reviewed original renderer images, actual learning/Cards Android surfaces, and the in-place 2017→2018 learning-preservation upgrade passed before publication.'
          echo 'Install as an update without uninstalling the existing family app.'
          echo 'Signed with the unchanged public Lumo TEST key. This is not Google Play signing.'
          echo 'Physical Samsung/Fold7 performance and 60 FPS have not been measured.'
          echo 'Older APKs, releases and the production main branch remain unchanged.'
        } > dist/RELEASE-NOTES.txt
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" authorize-publication --app "$GITHUB_WORKSPACE/app" --qa "$GITHUB_WORKSPACE/acceptance" --receipt recovery/RETEST-IDENTITY.json --facts dist/RELEASE-FACTS.json --out proofs/recovery
        gh release create coachpreview-build-2018 \
          dist/Lumo-Lernen-Neu.apk \
          dist/Lumo-Lernen-Neu.apk.sha256 \
          dist/BUILD-PROVENANCE.json \
          dist/GODOT-SOURCE.json \
          dist/PUBLISH-VERIFICATION.json \
          dist/RELEASE-FACTS.json \
          dist/VISUAL-REVIEW.json \
          proofs/recovery/RECOVERY-AUTHORIZATION.json \
          --repo Ullmann27/lumo-lernen \
          --target "$SOURCE_SHA" \
          --title 'Lumo 2018 Android ARM64 Test-APK' \
          --notes-file dist/RELEASE-NOTES.txt \
          --prerelease --latest=false
    - name: Verify the published release, immutable tag and unauthenticated Chrome APK bytes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SOURCE_SHA: ${{ env.APP_SOURCE_SHA }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/acceptance/scripts/verify_nextgen_retest.py" authorize-publication --app "$GITHUB_WORKSPACE/app" --qa "$GITHUB_WORKSPACE/acceptance" --receipt recovery/RETEST-IDENTITY.json --facts dist/RELEASE-FACTS.json --out proofs/recovery
        gh api repos/Ullmann27/lumo-lernen/releases/tags/coachpreview-build-2018 > dist/PUBLISHED-RELEASE.json
        gh api repos/Ullmann27/lumo-lernen/git/ref/tags/coachpreview-build-2018 > dist/PUBLISHED-TAG.json
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        release = json.loads(Path('dist/PUBLISHED-RELEASE.json').read_text())
        tag = json.loads(Path('dist/PUBLISHED-TAG.json').read_text())
        facts = json.loads(Path('dist/RELEASE-FACTS.json').read_text())
        assert release['draft'] is False and release['prerelease'] is True
        assert release['tag_name'] == 'coachpreview-build-2018'
        assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_SHA']
        assets = [asset for asset in release['assets'] if asset['name'] == 'Lumo-Lernen-Neu.apk']
        assert len(assets) == 1 and assets[0]['state'] == 'uploaded'
        assert assets[0]['size'] == facts['apkBytes'] > 0
        url = 'https://github.com/Ullmann27/lumo-lernen/releases/download/coachpreview-build-2018/Lumo-Lernen-Neu.apk'
        assert assets[0]['browser_download_url'] == url
        Path('dist/DIRECT-APK-URL.txt').write_text(url + '\n')
        PY
        curl --fail --location --retry 3 --max-time 600 \
          "$(cat dist/DIRECT-APK-URL.txt)" --output "$RUNNER_TEMP/lumo-public-2018.apk"
        python3 - "$RUNNER_TEMP/lumo-public-2018.apk" <<'PY'
        import hashlib
        import json
        import sys
        from pathlib import Path
        apk = Path(sys.argv[1])
        facts = json.loads(Path('dist/RELEASE-FACTS.json').read_text())
        assert apk.stat().st_size == facts['apkBytes']
        assert hashlib.sha256(apk.read_bytes()).hexdigest() == facts['apkSha256'], 'Public download bytes differ'
        print('Verified public Chrome APK:', Path('dist/DIRECT-APK-URL.txt').read_text().strip())
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
