name: Stage verified Lumo asset bundle

on:
  push:
    branches:
      - chatgpt/lumo-asset-delivery-2026-10-04
    paths:
      - .github/workflows/lumo-asset-staging.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumo-asset-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: Verify and publish immutable asset bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned public bundle
        shell: bash
        env:
          ASSET_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3JBiq3Q9vttoZVrKhdbYLuTHXre/3f6109fb-0429-4acc-9ef0-22219252239a.zip
          EXPECTED_SHA256: e32a2d6e78d1af8d51c4e27b6b66c5a87d2c2da252a5f61a3e7da0d76a5ffe20
          EXPECTED_BYTES: "24962269"
          EXPECTED_ENTRIES: "170"
        run: |
          set -euo pipefail
          mkdir -p staging
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "$ASSET_URL" --output staging/Lumo_Assetpaket_Einzelbilder_2026-10-04.zip

          actual_bytes="$(stat -c%s staging/Lumo_Assetpaket_Einzelbilder_2026-10-04.zip)"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" \
            staging/Lumo_Assetpaket_Einzelbilder_2026-10-04.zip | sha256sum --check --strict

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, stat, zipfile

          p = Path("staging/Lumo_Assetpaket_Einzelbilder_2026-10-04.zip")
          expected_sha = os.environ["EXPECTED_SHA256"]
          expected_bytes = int(os.environ["EXPECTED_BYTES"])
          expected_entries = int(os.environ["EXPECTED_ENTRIES"])
          root = "Lumo_Assetpaket_Einzelbilder_2026-10-04"

          data = p.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          if len(data) != expected_bytes or digest != expected_sha:
              raise SystemExit("Pinned byte/hash verification failed")

          expanded = 0
          with zipfile.ZipFile(p) as z:
              infos = z.infolist()
              if len(infos) != expected_entries:
                  raise SystemExit(f"Unexpected archive entry count: {len(infos)}")
              if z.testzip() is not None:
                  raise SystemExit("ZIP CRC verification failed")
              seen = set()
              for info in infos:
                  parts = PurePosixPath(info.filename).parts
                  mode = stat.S_IFMT(info.external_attr >> 16)
                  if (not parts or parts[0] != root or info.filename.startswith("/")
                          or "\\" in info.filename or ".." in parts
                          or mode not in (0, stat.S_IFREG, stat.S_IFDIR)
                          or info.flag_bits & 1):
                      raise SystemExit(f"Unsafe archive member: {info.filename}")
                  key = info.filename.rstrip("/").casefold()
                  if key in seen:
                      raise SystemExit(f"Duplicate archive member: {info.filename}")
                  seen.add(key)
                  expanded += info.file_size
                  if expanded > 50_000_000:
                      raise SystemExit("Archive expands beyond expected budget")

          receipt = {
              "status": "VERIFIED_FOR_GITHUB_STAGING",
              "source_url": os.environ["ASSET_URL"],
              "bytes": len(data),
              "sha256": digest,
              "archive_entries": expected_entries,
              "expanded_bytes": expanded,
              "source_commit": os.environ.get("GITHUB_SHA"),
              "repo_files_changed_by_job": False,
              "runtime_app_tested": False
          }
          Path("staging/receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload verified bundle as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumo-asset-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            staging/Lumo_Assetpaket_Einzelbilder_2026-10-04.zip
            staging/receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
