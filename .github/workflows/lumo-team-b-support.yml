name: LUMO support team — Pfotenpfad and World checks
on:
  push:
    branches: [support/logic-world-team-b-20261123]
    paths:
      - '.github/workflows/lumo-team-b-support.yml'
      - 'lib/**'
      - 'test/**'
      - 'config/team-b-support.json'
permissions:
  contents: read
concurrency:
  group: lumo-team-b-support-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      LUMO_TRAIL_CAPTURES: ${{ github.workspace }}/team-b-proof/trail
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Record exact source and resolve locked packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p team-b-proof/trail
          git rev-parse HEAD > team-b-proof/FLUTTER-COMMIT.txt
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          python3 -m unittest discover -s scripts/tests -p test_jvm_test_dependencies.py -v
      - name: Analyze integrated source and tests
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            lib/domain/logic/trail_puzzle.dart lib/features/games/logic \
            lib/app/app_state.dart lib/domain/backup/local_backup.dart \
            test/domain/trail_puzzle_test.dart test/features/trail_progress_store_test.dart \
            test/features/trail_profile_lifecycle_test.dart \
            test/games/trail_puzzle_screen_test.dart test/games/trail_puzzle_capture_test.dart \
            2>&1 | tee team-b-proof/flutter-analysis.log
      - name: Exercise game, persistence, profile reset and actual UI
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 --reporter expanded \
            test/domain/trail_puzzle_test.dart \
            test/features/trail_progress_store_test.dart \
            test/features/trail_profile_lifecycle_test.dart \
            test/games/trail_puzzle_screen_test.dart \
            test/games/trail_puzzle_capture_test.dart \
            test/domain/logic_games_test.dart \
            test/features/logic_progress_store_test.dart \
            test/features/logic_profile_lifecycle_test.dart \
            2>&1 | tee team-b-proof/flutter-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-team-b-flutter-${{ github.run_id }}
          path: team-b-proof/
          if-no-files-found: error
  world:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '2'
      LUMO_NATIVE_SHA: 'e0460c0b3eda9d42e9d963eb2236dc8d9c7b5913'
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ullmann27/lumo-godot
          ref: 'e0460c0b3eda9d42e9d963eb2236dc8d9c7b5913'
          path: native
          persist-credentials: false
      - name: Install the project's pinned Godot engine and offscreen renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lumo-team-b-godot" team-b-proof
          test "$(git rev-parse HEAD)" = "$LUMO_NATIVE_SHA"
          git rev-parse HEAD > team-b-proof/GODOT-COMMIT.txt
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/lumo-team-b-godot/engine.zip"
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 \
            "$RUNNER_TEMP/lumo-team-b-godot/engine.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lumo-team-b-godot/engine.zip" -d "$RUNNER_TEMP/lumo-team-b-godot"
          mv "$RUNNER_TEMP/lumo-team-b-godot/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/lumo-team-b-godot/godot"
          echo "$RUNNER_TEMP/lumo-team-b-godot" >> "$GITHUB_PATH"
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! test -f /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so; then
            sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
            sudo timeout 180 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y xvfb xauth libgl1-mesa-dri
          fi
      - name: Import the complete current project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --single-threaded-scene --path . --editor --import --quit \
            > team-b-proof/import.log 2>&1
      - name: Run original World and additional support regressions
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for probe in lumo_world_regression lumo_world_errands_regression lumo_world_errands_controller_regression lumo_world_support_integration_regression lumo_world_hud_regression; do
            if ! timeout 600 godot --headless --verbose --single-threaded-scene --path . \
              --script "res://scripts/tests/$probe.gd" > "team-b-proof/$probe.log" 2>&1; then
              cat "team-b-proof/$probe.log"
              status=1
            fi
            if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|\] FAIL ' "team-b-proof/$probe.log"; then
              cat "team-b-proof/$probe.log"
              status=1
            fi
            if ! grep -E '\] PASS [0-9]+ checks' "team-b-proof/$probe.log"; then
              status=1
            fi
          done
          exit "$status"
      - name: Render and exercise the actual World atlas
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          LUMO_WORLD_MAP_CAPTURE="$PWD/team-b-proof/world-map.png" \
            timeout 180 xvfb-run -a -s "-screen 0 1280x900x24" \
              godot --single-threaded-scene --path . --rendering-method gl_compatibility --audio-driver Dummy \
                --script res://scripts/tests/lumo_world_map_regression.gd \
                > team-b-proof/world-map-renderer.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:|\] FAIL ' team-b-proof/world-map-renderer.log; then
            exit 1
          fi
          grep -E '\[WorldMap\] PASS [0-9]+ checks' team-b-proof/world-map-renderer.log
          test -s team-b-proof/world-map.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-team-b-world-${{ github.run_id }}
          path: native/team-b-proof/
          if-no-files-found: error
