name: LUMO 2078 reviewed original APK publisher
# Inactive until a separately reviewed request JSON is ADDED on this support branch.
on:
  push:
    branches: [support/lumo-2078-reviewed-publish]
    paths: [config/lumo-2078-reviewed-publish.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: lumo-2078-reviewed-publication-45365478105
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Ullmann27/lumo-lernen'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/lumo_2078_reviewed_publish.py
            /scripts/lumo_team_b_reviewed_publish.py
            /scripts/verify_native_start_diagnostics.py
            /scripts/tests/test_lumo_2078_reviewed_publish.py
            /tools/nextgen/public_learning_download.py
            /docs/releases/lumo-2078-original-evidence/
            /config/lumo-2078-reviewed-publish.json
      - name: Run focused publication guards
        run: python3 -m unittest discover -s scripts/tests -p test_lumo_2078_reviewed_publish.py
      - name: Bind the original quality passes, failures and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lumo_2078_reviewed_publish.py prepare
      - name: Download only the original artifact
        uses: actions/download-artifact@v4
        with:
          repository: Ullmann27/lumo-lernen
          run-id: '45365478105'
          artifact-ids: '14908418202'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: reviewed-2078/source
      - name: Verify every original file and the source-bound evidence
        run: python3 scripts/lumo_2078_reviewed_publish.py verify
      - name: Publish with the provisioned owner identity and verify public bytes
        env:
          LUMO_RELEASE_PUBLISH_TOKEN: ${{ secrets.LUMO_RELEASE_PUBLISH_TOKEN }}
        run: env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/lumo_2078_reviewed_publish.py publish
      - name: Preserve the actual publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUMO-2078-REVIEWED-PUBLICATION-${{ github.run_id }}-${{ github.run_attempt }}
          path: reviewed-2078/proof/
          if-no-files-found: warn
          retention-days: 30
