name: Sulafat voice API tests
on:
  push:
    branches:
      - chatgpt/lumo-sulafat-everywhere-2026-10-10
    paths:
      - .github/workflows/lumo-sulafat-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-voice-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test complete child-safe proxy and Sulafat endpoint
        run: |
          set -euo pipefail
          cd server/lumo-ai-proxy
          node --test test/*.test.js
      - name: No accidental dynamic voice fallback in Flutter
        run: |
          set -euo pipefail
          ! grep -R -n -E 'import .*flutter_tts|FlutterTts\\(' lib
          ! grep -n 'flutter_tts:' pubspec.yaml
          grep -q "voiceName: SULAFAT_VOICE" server/lumo-ai-proxy/src/sulafatTts.js
          grep -q "bool _cloudVoiceEnabled = false" lib/core/lumo_voice.dart
          grep -q "cloudVoiceEnabled = false" lib/core/app_settings.dart
