name: Check unified Android APK in KVM

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build saved source in this runner, or test an existing draft APK'
        required: true
        type: choice
        default: build
        options:
          - build
          - download
      releaseTag:
        description: 'Existing draft: empty for build mode; cached candidate or final APK for download'
        required: true
        type: string
      apkSha:
        description: 'Required in download mode; full SHA-256 of the existing draft APK'
        required: false
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: android-integration-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMO_QA_DIR: ${{ github.workspace }}/android-qa-evidence
      RELEASE_TAG: ${{ inputs.releaseTag }}
      APK_SHA: ${{ inputs.apkSha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: inputs.mode == 'build'
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install OCR and Android SDK tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0
          python3 -m pip install Pillow
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-36'
      - name: Check the saved source and empty draft before building
        if: inputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$LUMO_QA_DIR"
          python3 tools/android_qa/prepare_built_apk.py --repository "$GITHUB_REPOSITORY" --release-tag "$RELEASE_TAG" --out "$LUMO_QA_DIR" --preflight 2>&1 | tee "$LUMO_QA_DIR/build-preflight.log"
      - name: Install the matching pinned Godot engine
        if: inputs.mode == 'build'
        run: bash scripts/install_godot_for_build.sh
      - name: Build the saved source and pinned Godot into one release APK
        if: inputs.mode == 'build'
        run: bash scripts/build_unified_apk.sh 2>&1 | tee "$LUMO_QA_DIR/build.log"
      - name: Verify and freeze the runner-built APK bytes
        id: built
        if: inputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/android_qa/prepare_built_apk.py --repository "$GITHUB_REPOSITORY" --release-tag "$RELEASE_TAG" --out "$LUMO_QA_DIR" 2>&1 | tee "$LUMO_QA_DIR/freeze-build.log"
          cp dist/APK-VERIFICATION.json dist/BUILD-PROVENANCE.json "$LUMO_QA_DIR/"
      - name: Cache the exact verified bytes and provenance as an unpublished candidate
        if: inputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/android_qa/cache_built_apk.py --repository "$GITHUB_REPOSITORY" --release-tag "$RELEASE_TAG" --evidence "$LUMO_QA_DIR" 2>&1 | tee "$LUMO_QA_DIR/candidate-cache.log"
      - name: Download and verify the supplied APK bytes
        id: downloaded
        if: inputs.mode == 'download'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$LUMO_QA_DIR"
          python3 tools/android_qa/download_apk.py --repository "$GITHUB_REPOSITORY" --release-tag "$RELEASE_TAG" --sha256 "$APK_SHA" --out "$LUMO_QA_DIR" 2>&1 | tee "$LUMO_QA_DIR/download-check.log"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$LUMO_QA_DIR/tested.apk" > "$LUMO_QA_DIR/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$LUMO_QA_DIR/tested.apk" > "$LUMO_QA_DIR/apk-badging.txt"
      - name: Record the selected APK hash and signature
        env:
          VERIFIED_SHA: ${{ steps.built.outputs.sha256 || steps.downloaded.outputs.sha256 }}
        run: |
          test -n "$VERIFIED_SHA"
          echo "APK_SHA=$VERIFIED_SHA" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$LUMO_QA_DIR/tested.apk" > "$LUMO_QA_DIR/signature.txt"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Start and verify the Mesa software OpenGL display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp +extension GLX > "$LUMO_QA_DIR/xvfb.log" 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > "$LUMO_QA_DIR/mesa-renderer.txt" 2>&1; then
              break
            fi
            sleep 0.25
          done
          cat "$LUMO_QA_DIR/mesa-renderer.txt"
          grep -Ei 'OpenGL renderer string:.*llvmpipe' "$LUMO_QA_DIR/mesa-renderer.txt"
      - name: Install the verified APK and exercise the actual user flow
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # Official stable 36.3.10 archive; avoid the observed 37.2.12
          # gfxstream context loss while testing the identical frozen APK.
          emulator-build: '14472402'
          disable-animations: true
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: >-
            bash -e -o pipefail -c 'python3 tools/android_qa/emulator_diagnostics.py --out "$LUMO_QA_DIR" --verify-emulator; python3 tools/android_qa/run_ui_checks.py --apk "$LUMO_QA_DIR/tested.apk" --sha256 "$APK_SHA" --out "$LUMO_QA_DIR" 2>&1 | tee "$LUMO_QA_DIR/ui-check-run.log"'
      - name: Preserve host kernel and emulator crash diagnostics
        if: always()
        run: python3 tools/android_qa/emulator_diagnostics.py --out "$LUMO_QA_DIR"
      - name: Upload and re-download the same successfully tested APK into the existing draft
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/android_qa/upload_tested_apk.py --repository "$GITHUB_REPOSITORY" --release-tag "$RELEASE_TAG" --evidence "$LUMO_QA_DIR" 2>&1 | tee "$LUMO_QA_DIR/upload-apk-check.log"
      - name: Save proof ZIP to the existing draft without publishing or changing APK bytes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/android_qa/upload_proof.py --repository "$GITHUB_REPOSITORY" --release-tag "$RELEASE_TAG" --evidence "$LUMO_QA_DIR" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
