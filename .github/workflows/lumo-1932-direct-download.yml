name: Lumo 1932 private draft download, same verified ZIP, no build
on:
  push:
    branches: [sol/lumo-1932-download-2026-10-12]
    paths: [.github/workflows/lumo-1932-direct-download.yml]
permissions:
  actions: read
  contents: write
jobs:
  private-download:
    if: github.repository == 'Ullmann27/lumo-lernen'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Ullmann27/lumo-lernen
      RELEASE_ID: '410060824'
      RELEASE_TAG: lumo-0.12.25-1932-download-draft
      SOURCE: d20501476243e3a016c2574a9016c07e2ebe8f85
      ZIP_NAME: Lumo-Lernen-Neu-0.12.25-1932-Direkt.zip
      ZIP_SHA: 1e7ced68aa0b2418d920c29f76301b57b6420c8264b823122d9d6df0eb5c1174
    steps:
      - name: Require the existing unpublished owner-only draft
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > draft.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('draft.json'))
          assert r['draft'] is True and r['published_at'] is None
          assert r['prerelease'] is True
          assert r['tag_name'] == os.environ['RELEASE_TAG']
          assert r['target_commitish'] == os.environ['SOURCE']
          assert not r['assets'], 'Do not overwrite existing parallel uploads'
          print('Existing unpublished draft verified; no publishing operation is permitted.')
          PY
      - name: Fetch the exact already verified complete ZIP, without rebuilding
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GH_REPO/actions/artifacts/11722582392/zip" \
            --output "$ZIP_NAME"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          p = Path(os.environ['ZIP_NAME'])
          digest = hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()
          assert digest == os.environ['ZIP_SHA']
          assert p.stat().st_size == 315810786
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert 'Lumo-Lernen-Neu.apk' in z.namelist()
              assert not any(n.lower().endswith('.zip') for n in z.namelist())
              assert hashlib.sha256(z.read('Lumo-Lernen-Neu.apk')).hexdigest() == '82dc9d34d28fbf011d1dba20582e3702e5918f55f392d18ed65e32f49657e991'
          Path('DOWNLOAD-VERIFIED.json').write_text(json.dumps({
              'file': p.name, 'bytes': p.stat().st_size, 'sha256': digest,
              'crc': 'PASS', 'source': os.environ['SOURCE'],
              'apk_unchanged': True, 'publicly_published': False,
          }, indent=2) + '\n')
          print('Exact complete ZIP and embedded APK verified; no new APK.')
          PY
      - name: Upload only to the existing unpublished draft
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$ZIP_NAME" DOWNLOAD-VERIFIED.json
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > uploaded-draft.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('uploaded-draft.json'))
          assert r['draft'] is True and r['published_at'] is None
          a = next(a for a in r['assets'] if a['name'] == os.environ['ZIP_NAME'])
          assert a['state'] == 'uploaded' and a['size'] == 315810786
          assert a['digest'] == 'sha256:' + os.environ['ZIP_SHA']
          print('Unpublished draft upload verified:', r['html_url'])
          print('ZIP asset:', a['browser_download_url'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-1932-private-download-proof-${{ github.run_id }}
          path: |
            draft.json
            uploaded-draft.json
            DOWNLOAD-VERIFIED.json
          if-no-files-found: error
          retention-days: 30
