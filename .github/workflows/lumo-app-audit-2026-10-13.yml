name: Lumo app audit 2026-10-13
# revision: shell-navigation-and-topic-content

on:
  push:
    branches:
      - sol/lumo-app-audit-2026-10-13
    paths:
      - .github/workflows/lumo-app-audit-2026-10-13.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prove source
        run: |
          set -euo pipefail
          git log --oneline -4
          git merge-base --is-ancestor 4417eb55f217bdc0bb9f49ace1a6d8c51b7cfa30 HEAD

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Audit learning navigation and modules
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter=expanded --timeout=90s \
            test/akademie_all_areas_navigation_test.dart \
            test/app_shell_learning_area_transition_test.dart \
            test/learning_module_registry_smoke_test.dart \
            test/akademie_subject_navigation_test.dart \
            test/curriculum_integrity_test.dart \
            test/fallback_topic_curriculum_test.dart \
            test/story_learning_path_test.dart \
            test/story_persistence_race_test.dart \
            test/home_lumo_meister_entry_test.dart \
            test/games/lumo_meister_portal_test.dart \
            test/quiz_show_meister_test.dart \
            test/lumo_meister_reward_alignment_test.dart \
            test/ai_transport_regression_test.dart

      - name: Audit AI proxy contract
        working-directory: server/lumo-ai-proxy
        run: npm test
