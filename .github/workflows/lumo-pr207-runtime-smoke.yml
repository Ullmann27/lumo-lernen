name: Lumo PR207 Android diagnostic smoke

on:
  push:
    branches: [chatgpt/3d-launch-lifecycle-2026-10-07]
    paths:
      - .github/workflows/lumo-pr207-runtime-smoke.yml
      - scripts/probes/pr207_android_smoke.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lumo-pr207-android-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact built diagnostic package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37563101658
          name: lumo-pr207-apk-4a50e01-37563101658
          path: apk/
      - name: Verify input and preserve original provenance
        run: |
          mkdir -p runtime-evidence
          python3 -m py_compile scripts/probes/pr207_android_smoke.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('apk/Lumo-Lernen-Neu.apk')
          expected = 'a2ea35b952f3b2f9ee3d1fc2479d4df62d30d8d18e5fe9c6624e6ee6138bed00'
          if hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() != expected:
              raise RuntimeError('Wrong APK artifact')
          source = json.loads(Path('apk/BUILD-PROVENANCE.json').read_text())
          if source['flutter_source_commit'] != '4a50e01410d5dee3816e1c4fa283dfdf3629b079':
              raise RuntimeError('Wrong candidate source')
          Path('runtime-evidence/BUILD-PROVENANCE.json').write_text(json.dumps(source, indent=2) + '\n')
          Path('runtime-evidence/README.txt').write_text(
              'Diagnostic baseline APK: default Flutter launcher icon and tracked_source_clean=false are known gaps.\n'
              'A smoke PASS is not a production, visual, race, persistence or physical Fold approval.\n')
          PY
      - name: Enable emulator acceleration on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, start offline, resize and restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/probes/pr207_android_smoke.py --apk apk/Lumo-Lernen-Neu.apk --sha256 a2ea35b952f3b2f9ee3d1fc2479d4df62d30d8d18e5fe9c6624e6ee6138bed00 --out runtime-evidence
      - name: Upload real runtime evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-pr207-runtime-${{ github.run_id }}
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 14
