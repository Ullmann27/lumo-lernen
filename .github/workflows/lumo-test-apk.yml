name: "Lumo Test-APK (Flutter + Godot)"
# Baut eine installierbare, signierte Test-APK aus genau diesem Stand.
# Ausgelöst nur durch eine Änderung an config/test-apk-request.json, damit nicht
# jeder Push einen einstündigen Bau startet. Kein Merge, kein Store-Release:
# das Ergebnis ist eine Vorabversion zum Testen auf dem Handy.
on:
  push:
    branches: [ccr-54af69f2-4uged4, delivery/lumo-2051-completion, repair/lumo-quiz-run-kart-20261119, integration/lumo-complete-20261122]
    paths:
      - config/test-apk-request.json
      - .github/workflows/lumo-test-apk.yml
      - .github/probes/native_start_diagnostics.py

permissions:
  contents: write

concurrency:
  group: lumo-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Signierte Test-APK bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      # Eine APK je Prozessorart: Handys brauchen nur ARM64. Das halbiert die
      # nativen Bibliotheken gegenüber einer Universal-APK.
      LUMO_SPLIT_PER_ABI: '1'
      LUMO_NDK_DISPOSABLE_RUNNER: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Quellstand und Godot-Pin festhalten
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/verify_legacy_release_pin.py
          mkdir -p build-proof
          python3 -m unittest discover -s scripts/tests -p test_verify_test_apk_candidate.py -v
          python3 -m unittest discover -s scripts/tests -p test_verify_native_start_diagnostics.py -v
          python3 -m unittest discover -s tools/android_qa/tests -p test_native_start_diagnostics.py -v
          python3 -m unittest discover -s tools/android_qa/tests -p test_local_backup_android_probe.py -v
          python3 -m unittest scripts.tests.test_prepare_android -v
          python3 scripts/verify_test_apk_candidate.py source --expected-commit "$GITHUB_SHA" \
            --out build-proof/CANDIDATE-SOURCE.json
          git rev-parse HEAD > build-proof/FLUTTER-COMMIT.txt
          cp config/godot-source.json build-proof/GODOT-SOURCE.json
          cp config/test-apk-request.json build-proof/TEST-APK-REQUEST.json
      - name: Android- und Godot-Werkzeuge einrichten
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          bash scripts/install_ndk_for_build.sh build-proof/ndk
          bash scripts/install_godot_for_build.sh
      - name: Native Sprache, Lerndialog und Datensicherung – JVM-Verträge
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-9.1.0-bin.zip \
            -o "$RUNNER_TEMP/lumo-contract-gradle.zip"
          printf '%s  %s\n' a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806 \
            "$RUNNER_TEMP/lumo-contract-gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lumo-contract-gradle.zip" -d "$RUNNER_TEMP/lumo-contract-gradle"
          export LUMO_KOTLIN_LIB_DIR="$RUNNER_TEMP/lumo-contract-gradle/gradle-9.1.0/lib"
          python3 -m unittest scripts.tests.test_english_lesson_speech \
            scripts.tests.test_speech_envelope_contract scripts.tests.test_learning_dialog_logic \
            scripts.tests.test_studio_learning_contract \
            scripts.tests.test_local_backup_transaction -v \
            2>&1 | tee build-proof/NATIVE-SPEECH-DIALOG-TESTS.txt
      - name: Flutter – Analyse und Kernprüfungen
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            | tee build-proof/FLUTTER-ANALYSIS.txt
          flutter test --no-pub --reporter expanded --concurrency=2 \
            test/games/memory_native_entry_test.dart \
            test/games/memory_screen_test.dart \
            test/games/memory_result_frame_test.dart \
            test/quiz_native_roundtrip_lifecycle_test.dart \
            test/quiz_show_meister_test.dart \
            test/home_3d_workshop_entry_test.dart \
            test/learning/lab_native_entry_test.dart \
            test/learning/remaining_native_entry_test.dart \
            test/tutoring/native_english_activity_test.dart \
            test/learning/lab_native_model_contract_test.dart \
            test/profile_target_layout_test.dart \
            test/smoke_main_screens_test.dart \
            test/learning/math_explanation_film_test.dart \
            test/math_explanation_facts_test.dart \
            test/language_example_board_test.dart \
            test/tutoring/lumo_nachhilfe_test.dart \
            test/tutoring/lumo_nachhilfe_entry_test.dart \
            test/tutoring/lumo_nachhilfe_3d_test.dart \
            test/lumo_learning_dialogue_contract_test.dart \
            test/lumo_context_conversation_test.dart \
            test/learning/core_conversation_route_test.dart \
            test/learning/nextgen_answer_payload_test.dart \
            test/learning/nextgen_lab_bus_integration_test.dart \
            test/learning/nextgen_task_quality_test.dart \
            test/learning/nextgen_task_hint_precision_test.dart \
            test/learning/module_frame_practical_links_test.dart \
            test/tutoring/guided_coach_binding_test.dart \
            test/parent_task_repository_test.dart \
            test/parent_task_flow_test.dart \
            test/learning_answer_reward_test.dart \
            test/local_backup_format_test.dart \
            test/local_backup_flow_test.dart \
            test/learning_profile_isolation_test.dart \
            test/profile_fail_closed_regression_test.dart \
            test/rewards/custom_reward_repository_test.dart \
            test/rewards/reward_shop_redemption_test.dart \
            test/rewards/custom_rewards_flow_test.dart \
            test/reward_wallet_transaction_test.dart \
            test/reward_wallet_dedup_confirmation_test.dart \
            test/reward_wallet_queue_zone_test.dart \
            test/state_persistence_regression_test.dart \
            test/restart_regression_test.dart \
            test/pin_free_access_test.dart \
            | tee build-proof/FLUTTER-CORE-TESTS.txt
      - name: Godot – gepinnter Spielstand startet und besteht seine Kernprüfungen
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(python3 -c 'import json; print(json.load(open("config/godot-source.json"))["revision"])')"
          git clone --filter=blob:none https://github.com/Ullmann27/lumo-godot.git build/lumo-godot-qa
          git -C build/lumo-godot-qa checkout --detach "$SOURCE"
          python3 scripts/verify_kart_fleet_mirror.py build/lumo-godot-qa
          # Der Erstimport stürzt in Godot 4.6.3 auf vollen CI-Rechnern ab, wenn
          # Szenen-Benachrichtigungen aus Arbeits-Threads kommen. Wie im Bauskript
          # läuft der Importer deshalb mit --single-threaded-scene; zusätzlich
          # wird der idempotente Import genau einmal wiederholt.
          godot --headless --single-threaded-scene --path build/lumo-godot-qa --editor --import --quit \
            || godot --headless --single-threaded-scene --path build/lumo-godot-qa --editor --import --quit
          for probe in kart_neon_home_regression kart_garage_landscape_regression kart_race_kinds_regression \
            kart_result_reachability_regression native_table_boot_regression \
            learning_android_host_capability_regression native_learning_boot_regression; do
            echo "::group::$probe"
            timeout 600 godot --headless --path build/lumo-godot-qa \
              --script "res://scripts/tests/$probe.gd" | tee "build-proof/GODOT-${probe}.txt"
            echo "::endgroup::"
          done
          for probe in lumo_kart_production_driver_regression lumo_opponent_roster_regression \
            kart_extra_drivers_regression \
            learning_holo_lesson_regression lumo_run_stunt_relay_regression \
            kart_arena_battle_regression parcours_menu_entry_regression parcours_race_regression \
            lumo_run_regression lumo_run_flow_regression quiz_studio_escape_regression; do
            echo "::group::$probe"
            # Der Lauf-Test spielt 30 ganze Dschungelherz-Läufe mit den echten
            # Teilschritten des Spiels (rund 18 s je Lauf im CI): 600 s reichten nur
            # bis Lauf 24 (Lauf 44551761545, Abbruch mit 124 ohne Fehlschlag).
            limit=600
            if [ "$probe" = lumo_run_regression ]; then limit=1500; fi
            timeout "$limit" godot --headless --path build/lumo-godot-qa \
              --script "res://scripts/tests/$probe.gd" | tee "build-proof/GODOT-${probe}.txt"
            echo "::endgroup::"
          done
          echo "::group::learning_tutor_regression (validation, invalid, return, voice)"
          timeout 600 godot --headless --path build/lumo-godot-qa \
            --script res://scripts/tests/learning_tutor_regression.gd -- \
            --part=validation,invalid,return,voice | tee build-proof/GODOT-learning_tutor_regression.txt
          echo "::endgroup::"
      - name: Eine signierte Flutter-Godot-APK bauen
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_unified_apk.sh
          test -s dist/Lumo-Lernen-Neu.apk
          # Both ABI builds are complete. Release the build JVM before the PCK runtime probe.
          (cd android && ./gradlew --stop)
          python3 scripts/verify_test_apk_candidate.py packages --expected-commit "$GITHUB_SHA" \
            --extract-pck "$RUNNER_TEMP/lumo-pck-runtime/lumo_game.pck" \
            --out build-proof/SPLIT-APK-IDENTITY.json
          # Separate processes release the asset audit's resources before the full race scene.
          # Both phases are mandatory and inspect the same PCK extracted from the ARM64 APK.
          for phase in assets race; do
            timeout 90 godot --headless --path "$RUNNER_TEMP/lumo-pck-runtime" \
              --main-pack "$RUNNER_TEMP/lumo-pck-runtime/lumo_game.pck" \
              --script "$PWD/.github/probes/lumo_kart_driver_package_probe.gd" -- "$phase" \
              | tee "build-proof/KART-DRIVER-PCK-${phase}.txt"
          done
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk --abi arm64-v8a > build-proof/APK-VERIFICATION.json
          test -s dist/BUILD-PROVENANCE.json
          VERSION="$(grep '^version:' pubspec.yaml | cut -d' ' -f2)"
          NAME="Lumo-Lernen-Test-${VERSION/+/-}.apk"
          mkdir -p release
          cp dist/Lumo-Lernen-Neu.apk "release/$NAME"
          cp dist/BUILD-PROVENANCE.json release/BUILD-PROVENANCE.json
          cp build-proof/APK-VERIFICATION.json release/APK-VERIFICATION.json
          cp build-proof/SPLIT-APK-IDENTITY.json release/SPLIT-APK-IDENTITY.json
          cp build-proof/SPLIT-APK-IDENTITY.json dist/x86_64/SPLIT-APK-IDENTITY.json
          python3 - <<'PY_EVIDENCE'
          from pathlib import Path
          import zipfile

          required_documents = [
              Path('docs/integration/2026-11-22/INTEGRATION.md'),
              Path('docs/integration/2026-11-22/LEARNING-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/UPLOAD-ABGLEICH.md'),
              Path('docs/integration/2026-11-22/CUSTOM-REWARDS-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/PARENT-TASKS-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/BACKUP-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/LUMO-ROOM-INTEGRATION.md'),
              Path('docs/integration/2026-11-22/flutter-branch-inventory.json'),
              Path('build/lumo-godot-qa/docs/integration/2026-11-22/GODOT_INTEGRATION.md'),
              Path('build/lumo-godot-qa/docs/integration/2026-11-22/godot-branch-inventory.json'),
          ]
          for path in required_documents:
              if not path.is_file():
                  raise FileNotFoundError(f'Missing integration evidence: {path}')
          sources = {
              'flutter': Path('docs/integration/2026-11-22'),
              'godot': Path('build/lumo-godot-qa/docs/integration/2026-11-22'),
          }
          proof = sorted(Path('build-proof').glob('*.txt')) + sorted(Path('build-proof').glob('*.json'))
          with zipfile.ZipFile('release/LUMO-INTEGRATIONSBELEGE.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for label, directory in sources.items():
                  for path in sorted(directory.rglob('*')):
                      if path.is_file() and path.suffix in {'.md', '.json', '.txt', '.log'}:
                          archive.write(path, f'{label}/{path.relative_to(directory)}')
              for path in proof:
                  archive.write(path, 'build-proof/' + path.name)
          PY_EVIDENCE
          (cd release && sha256sum "$NAME" > SHA256SUMS.txt)
          echo "LUMO_APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "LUMO_APK_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: APK für den Android-Emulator sichern
        uses: actions/upload-artifact@v4
        with:
          name: LUMO-EMULATOR-APK-${{ github.run_id }}
          path: dist/x86_64/
          if-no-files-found: error
          compression-level: 0
      - name: Test-APK als Vorabversion zum Herunterladen bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$(python3 -c 'import json;print(json.load(open("config/godot-source.json"))["revision"])')"
          cat > release/LIESMICH.txt <<EOF
          Lumo Lernen – Test-APK $LUMO_APK_VERSION
          App-Quellstand:   $GITHUB_SHA
          Spiel-Quellstand: $GODOT (Godot 4.6.3)
          Vollständige App-Quellen: https://github.com/Ullmann27/lumo-lernen/archive/$GITHUB_SHA.zip
          Vollständige Spiel-Quellen: https://github.com/Ullmann27/lumo-godot/archive/$GODOT.zip
          Integrationsberichte, Quelleninventuren und Bauprüfungen: LUMO-INTEGRATIONSBELEGE.zip
          Android-Rundgang: Ergebnis im nachfolgenden Job dieses Laufs:
          https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Diese vorab erzeugten Bau-Belege enthalten noch kein Ergebnis des Android-Rundgangs.
          Zweck: Testen auf dem Handy. Kein Store-Release, kein Merge nach main.
          Geprüft in diesem Lauf: Flutter-Analyse und Kernprüfungen, Start und
          Kernprüfungen des gepinnten Spielstands, APK-Aufbau und Signatur.
          Nicht geprüft: Bedienung auf einem echten Gerät, Fold, Bildrate, Ton.
          EOF
          TAG="lumo-test-${LUMO_APK_VERSION/+/-}-$GITHUB_RUN_ID"
          FILES=("release/$LUMO_APK_NAME" release/SHA256SUMS.txt release/APK-VERIFICATION.json
            release/BUILD-PROVENANCE.json release/SPLIT-APK-IDENTITY.json
            release/LUMO-INTEGRATIONSBELEGE.zip release/LIESMICH.txt)
          NOTES="Test-APK zum Ausprobieren auf dem Handy. Kein Store-Release. Details in LIESMICH.txt."
          # Eine Vorabversion legt ein Tag auf diesem Commit an. Verweigert GitHub
          # das dem Lauf-Token, bleibt der Entwurf: Er braucht kein Tag und ist
          # für die Eigentümer des Repos sichtbar und herunterladbar.
          RELEASE_ARGS=(--repo "$GITHUB_REPOSITORY"
            --title "Lumo Test-APK $LUMO_APK_VERSION" --notes "$NOTES"
            --prerelease --latest=false)
          if gh release create "$TAG" "${FILES[@]}" "${RELEASE_ARGS[@]}" --target "$GITHUB_SHA" ||
            {
              # Some installations allow the explicit ref but reject implicit
              # tag creation in the release endpoint. Never retag a candidate.
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null ||
                {
                  # Fall back to Git transport on the same exact checked-out commit.
                  gh auth setup-git --hostname github.com &&
                    git push origin "$GITHUB_SHA:refs/tags/$TAG"
                }
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$GITHUB_SHA" &&
                gh release create "$TAG" "${FILES[@]}" "${RELEASE_ARGS[@]}" --verify-tag
            }; then
            URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
            echo "Test-APK: $URL" >> "$GITHUB_STEP_SUMMARY"
          elif URL="$(gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lumo Test-APK $LUMO_APK_VERSION (Entwurf)" --notes "$NOTES" \
            --draft --prerelease)"; then
            echo "Test-APK (Entwurf, nur für Eigentümer sichtbar): $URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Entwurf angelegt: $URL"
          else
            echo "::warning::Die Vorabversion konnte nicht angelegt werden; die APK liegt im Actions-Artefakt dieses Laufs." >&2
            echo "Test-APK im Artefakt: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: APK und Belege als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUMO-TEST-APK-${{ github.run_id }}
          # Nur die APK und die kleinen Belege; die APK ist bereits komprimiert.
          path: |
            release/
            build-proof/*.txt
            build-proof/*.json
          if-no-files-found: warn
          compression-level: 0

  android-tour:
    name: Installierte APK im Android-Emulator prüfen
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LUMO-EMULATOR-APK-${{ github.run_id }}
          path: candidate/x86_64
      - name: Emulator und Prüftools vorbereiten
        run: |
          set -euo pipefail
          mkdir -p tour
          cp candidate/x86_64/SPLIT-APK-IDENTITY.json tour/SPLIT-APK-IDENTITY.json
          sudo chmod a+rw /dev/kvm
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr-deu tesseract-ocr-eng
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          awk '{print $1 "  dist/x86_64/Lumo-Lernen-Neu.apk"}' candidate/x86_64/SHA256SUMS.txt > candidate/ANDROID-TOUR-SHA256SUMS.txt
      - name: Mesa-Software-Anzeige für das Emulator-GL starten
        # SwiftShader (swiftshader_indirect) linkt Godots gl_compatibility-Shader nicht
        # ("Fragment shader active uniforms exceed GL_MAX_FRAGMENT_UNIFORM_VECTORS (261)",
        # Lauf 44473804677): Godot zeigte nur die Clear-Farbe, die Tour fand keine Knöpfe.
        # -gpu host über Mesa llvmpipe ist der Weg der übrigen Android-Touren.
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > tour/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > tour/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -Fi 'llvmpipe' tour/mesa-renderer.txt
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
          LUMO_NATIVE_START_DIAGNOSTICS: '1'
          LUMO_NATIVE_START_WAIT: '35'
          LUMO_NATIVE_START_BUDGET: '1200'
          LUMO_ANDROID_SKYPOST_PROBE: '1'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          emulator-build: '14472402'
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            .probe-venv/bin/python .github/probes/modernization_android_tour.py --apk candidate/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/x86_64/BUILD-PROVENANCE.json --sums candidate/ANDROID-TOUR-SHA256SUMS.txt --out tour
            .probe-venv/bin/python .github/probes/lumo_local_backup_android_probe.py --apk candidate/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/x86_64/BUILD-PROVENANCE.json --sums candidate/ANDROID-TOUR-SHA256SUMS.txt --out tour/local-backup
      - name: Beobachtete native Spielstarts verbindlich prüfen
        run: python3 scripts/verify_native_start_diagnostics.py tour/native-starts.json --out tour/NATIVE-GAME-STARTS.json
      - name: Abgeschlossene Android-Prüfbelege zum selben Kandidaten bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_ANDROID_EVIDENCE'
          import json
          from pathlib import Path
          import zipfile

          backup = json.loads(Path('tour/local-backup/backup-result.json').read_text())
          if backup.get('status') != 'PASS':
              raise RuntimeError('The real Android backup roundtrip has not passed')
          required = {'apk-identity', 'fictional-profile', 'saf-export', 'export-archive',
                      'changed-setting', 'saf-review', 'process-closed', 'restore-and-preservation'}
          passed = {row['step'] for row in backup.get('steps', []) if row.get('ok') is True}
          if not required <= passed:
              raise RuntimeError('Incomplete Android backup evidence')
          if not Path('tour/NATIVE-GAME-STARTS.json').is_file():
              raise RuntimeError('Missing mandatory native game gate evidence')
          with zipfile.ZipFile('LUMO-ANDROID-PRUEFBELEGE.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('tour').rglob('*')):
                  if path.is_file():
                      archive.write(path, str(path))
          PY_ANDROID_EVIDENCE
          VERSION="$(grep '^version:' pubspec.yaml | cut -d' ' -f2)"
          TAG="lumo-test-${VERSION/+/-}-$GITHUB_RUN_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$GITHUB_SHA"
          gh release upload "$TAG" LUMO-ANDROID-PRUEFBELEGE.zip --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LUMO-ANDROID-TOUR-${{ github.run_id }}
          path: |
            tour/
            LUMO-ANDROID-PRUEFBELEGE.zip

