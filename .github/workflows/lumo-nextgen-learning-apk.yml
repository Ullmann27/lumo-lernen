name: LUMO Next Generation – integrated learning APK

on:
  push:
    branches: [integration/lumo-nextgen-learning-20261115]
    paths: [config/nextgen-release.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumo-nextgen-learning-candidate
  cancel-in-progress: true

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  LUMO_SPLIT_PER_ABI: '1'
  LUMO_NDK_DISPOSABLE_RUNNER: '1'
  LUMO_PACKAGE: dev.ullmann.lumo.lumo_lernen.coachpreview
  LUMO_CERTIFICATE: a6b1ef61bf59db4e0794c742aeb3b5506d130f4d21175c9975140e6acdb80702

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      native: ${{ steps.source.outputs.native }}
      version: ${{ steps.source.outputs.version }}
      version_name: ${{ steps.source.outputs.version_name }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Verify exact source identity and protected learning modules
        id: source
        run: |
          set -euo pipefail
          mkdir -p evidence/validation
          git fetch --no-tags --depth=1 origin 6f4a8c4753f4d06d0b392da0789b8162b2faa71b
          python3 scripts/verify_legacy_release_pin.py
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          release = json.loads(Path('config/nextgen-release.json').read_text())
          native = json.loads(Path('config/godot-source.json').read_text())
          version = re.search(r'^version: (\S+)\+(\d+)$', Path('pubspec.yaml').read_text(), re.M)
          assert version and version.groups() == (release['versionName'], str(release['versionCode']))
          assert release['schemaVersion'] == 1 and release['versionCode'] >= 2027
          assert re.fullmatch(r'lumo-nextgen-learning-[0-9.]+-[0-9]+', release['releaseTag'])
          assert native['engine'] == '4.6.3' and re.fullmatch(r'[0-9a-f]{40}', native['revision'])
          coverage = json.loads(Path('docs/nextgen/COVERAGE.json').read_text())
          base = '6f4a8c4753f4d06d0b392da0789b8162b2faa71b'
          protected = []
          for entry in coverage['protectedSourceHashes']:
              path = entry['path']
              original = subprocess.check_output(['git', 'show', base + ':' + path])
              actual = Path(path).read_bytes()
              assert original == actual, 'Protected module changed: ' + path
              protected.append({'path': path, 'sha256': hashlib.sha256(actual).hexdigest()})
          assert len(protected) >= 18
          result = {'flutter': os.environ['GITHUB_SHA'], 'godot': native, 'release': release,
                    'protectedModules': protected, 'coverageIsAcceptance': False}
          Path('evidence/validation/source.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for key, value in {'native': native['revision'], 'version': release['versionCode'],
                                 'version_name': release['versionName'], 'tag': release['releaseTag']}.items():
                  stream.write(f'{key}={value}\n')
          PY
      - name: Prepare the exact native contract test dependencies
        run: |
          set -euo pipefail
          flutter precache --android
          mkdir -p "$RUNNER_TEMP/lumo-nextgen-test-tools"
          curl --fail --location --retry 3 \
            https://maven-central.storage-download.googleapis.com/maven2/org/json/json/20240303/json-20240303.jar \
            --output "$RUNNER_TEMP/lumo-nextgen-test-tools/json-20240303.jar"
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          libraries = Path(shutil.which('gradle')).resolve().parents[1] / 'lib'
          assert (libraries / 'kotlin-compiler-embeddable-2.0.20.jar').is_file()
          dependency = Path(os.environ['RUNNER_TEMP']) / 'lumo-nextgen-test-tools/json-20240303.jar'
          digest = hashlib.sha256(dependency.read_bytes()).hexdigest()
          assert digest == '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed'
          sdk = Path(os.environ.get('ANDROID_SDK_ROOT') or os.environ['ANDROID_HOME'])
          flutter = Path(shutil.which('flutter')).resolve().parents[1]
          assert (sdk / 'platforms/android-36/android.jar').is_file()
          assert (flutter / 'bin/cache/artifacts/engine/android-x64/flutter.jar').is_file()
          values = {'LUMO_KOTLIN_LIB_DIR': str(libraries), 'LUMO_JSON_JAR': str(dependency),
                    'LUMO_TEST_JSON_JAR': str(dependency), 'FLUTTER_ROOT': str(flutter)}
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key, value in values.items():
                  stream.write(f'{key}={value}\n')
          Path('evidence/validation/native-test-toolchain.json').write_text(
              json.dumps({'gradle': '8.11.1', 'kotlin': '2.0.20', 'jsonSha256': digest,
                          'androidApi': 36, 'paths': values}, indent=2) + '\n')
          PY
      - name: Locked dependencies, analysis and complete Flutter tests
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y fonts-noto-color-emoji
          test -f /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee evidence/validation/analyze.log
          flutter test --no-pub --reporter=expanded --timeout=120s --concurrency=2 2>&1 | tee evidence/validation/flutter-tests.log
          python3 -m unittest -v \
            scripts.tests.test_learning_conversation_contract \
            scripts.tests.test_learning_dialog_logic \
            scripts.tests.test_local_recognition_contract \
            scripts.tests.test_speech_envelope_contract \
            scripts.tests.test_studio_learning_contract \
            scripts.tests.test_game_return_contract \
            scripts.tests.test_prepare_android \
            tools.android_qa.tests.test_nextgen_learning_android_probe \
            2>&1 | tee evidence/validation/host-contracts.log
      - uses: actions/checkout@v4
        with:
          repository: Ullmann27/lumo-godot
          ref: ${{ steps.source.outputs.native }}
          path: native-source
          persist-credentials: false
      - name: Install the pinned Godot runtime for the next step
        run: bash scripts/install_godot_for_build.sh
      - name: Actual Godot asset import
        timeout-minutes: 15
        run: |
          set -euo pipefail
          godot --version | tee evidence/validation/godot-version.txt
          grep -F '4.6.3.stable.official' evidence/validation/godot-version.txt
          timeout --signal=TERM --kill-after=15s 12m godot --headless --path native-source --editor --import --quit 2>&1 | tee evidence/validation/godot-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' evidence/validation/godot-import.log; then exit 1; fi
      - name: Run the native learning regression suite
        timeout-minutes: 20
        run: |
          set -euo pipefail
          for script in learning_pattern_regression learning_world_regression learning_sharing_regression learning_host_payload_regression learning_generation_regression learning_companion_scope_regression learning_wonder_details_regression nextgen_avatar_contract_review nextgen_learning_route_review nextgen_learning_base_audio_regression; do
            printf 'Running native regression: %s\n' "$script"
            timeout --signal=TERM --kill-after=15s 3m godot --headless --path native-source --script "res://scripts/tests/$script.gd" 2>&1 | tee "evidence/validation/$script.log"
            if grep -F 'SCRIPT ERROR:' "evidence/validation/$script.log"; then exit 1; fi
          done
          timeout --signal=TERM --kill-after=15s 3m godot --headless --path native-source --script res://scripts/tests/learning_english_regression.gd \
            -- --output="$GITHUB_WORKSPACE/evidence/validation/learning-english" \
            2>&1 | tee evidence/validation/learning_english_regression.log
          if grep -F 'SCRIPT ERROR:' evidence/validation/learning_english_regression.log; then exit 1; fi
          timeout --signal=TERM --kill-after=15s 2m python3 native-source/tools/validate_project.py 2>&1 | tee evidence/validation/native-project.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-nextgen-validation
          path: evidence/validation/
          retention-days: 30

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      arm64_sha: ${{ steps.verify.outputs.arm64_sha }}
      x86_sha: ${{ steps.verify.outputs.x86_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Install the existing verified build toolchain
        run: |
          set -euo pipefail
          mkdir -p build-proof
          flutter pub get --enforce-lockfile
          bash scripts/install_ndk_for_build.sh build-proof/ndk
          bash scripts/install_godot_for_build.sh
      - name: Build the integrated signed Android application
        run: |
          set -euo pipefail
          bash scripts/build_unified_apk.sh 2>&1 | tee build-proof/build.log
      - name: Independently verify both produced artifacts
        id: verify
        run: |
          set -euo pipefail
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk --abi arm64-v8a > build-proof/VERIFY-arm64.json
          python3 scripts/verify_unified_apk.py dist/x86_64/Lumo-Lernen-Neu.apk --abi x86_64 > build-proof/VERIFY-x86.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for name, directory in [('arm64', Path('dist')), ('x86', Path('dist/x86_64'))]:
                  proof = json.loads((directory / 'BUILD-PROVENANCE.json').read_text())
                  with (directory / 'Lumo-Lernen-Neu.apk').open('rb') as apk:
                      digest = hashlib.file_digest(apk, 'sha256').hexdigest()
                  assert digest == proof['sha256']
                  assert proof['flutter_source_commit'] == os.environ['GITHUB_SHA']
                  assert proof['tracked_source_clean'] is True
                  assert proof['package'] == os.environ['LUMO_PACKAGE']
                  assert proof['signingCertificateSha256'] == os.environ['LUMO_CERTIFICATE']
                  stream.write(f'{name}_sha={digest}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-nextgen-arm64
          path: |
            dist/Lumo-Lernen-Neu.apk
            dist/BUILD-PROVENANCE.json
            dist/APK-VERIFICATION.json
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: lumo-nextgen-x86
          path: dist/x86_64/
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-nextgen-build-proof
          path: build-proof/
          retention-days: 30

  android:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: lumo-nextgen-x86
          path: candidate/x86
      - name: Prepare real Android UI capture
        run: |
          set -euo pipefail
          mkdir -p evidence/emulator
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 ffmpeg tesseract-ocr tesseract-ocr-deu
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          python3 -m py_compile .github/probes/lumo_nextgen_learning_android_probe.py .github/probes/lumo_nextgen_reference_android_probe.py .github/probes/lumo_nextgen_current_reference_android_probe.py tools/nextgen/prepare_current_learning_release.py
          .probe-venv/bin/python -m unittest -v tools.android_qa.tests.test_nextgen_learning_android_probe tools.android_qa.tests.test_nextgen_reference_android_probe tools.android_qa.tests.test_nextgen_current_candidate
      - name: Enable the disposable accelerated emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Start the software display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > evidence/emulator/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > evidence/emulator/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -i 'OpenGL renderer string' evidence/emulator/mesa-renderer.txt
      - name: Exercise the current learning scenes and retain real evidence
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
          LUMO_EXPECTED_SOURCE: ${{ github.sha }}
          LUMO_EXPECTED_NATIVE: ${{ needs.validate.outputs.native }}
          LUMO_EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          LUMO_EXPECTED_VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          LUMO_EXPECTED_SHA256: ${{ needs.build.outputs.x86_sha }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: bash .github/probes/run_lumo_nextgen_current_android.sh
      - name: Attach the actual emulator renderer information
        if: always()
        run: |
          mkdir -p evidence/android
          cp evidence/emulator/*.log evidence/emulator/*.txt evidence/android/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-nextgen-android-evidence
          path: evidence/android/
          retention-days: 30

  publish:
    needs: [validate, build, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lumo-nextgen-arm64
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: lumo-nextgen-android-evidence
          path: android-evidence/
      - name: Publish a new source-bound immutable test download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          VERSION_CODE: ${{ needs.validate.outputs.version }}
          ARM64_SHA: ${{ needs.build.outputs.arm64_sha }}
          X86_SHA: ${{ needs.build.outputs.x86_sha }}
          LUMO_EXPECTED_NATIVE: ${{ needs.validate.outputs.native }}
        run: |
          set -euo pipefail
          python3 tools/nextgen/prepare_current_learning_release.py
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release.' >&2
            exit 1
          fi
          tar -czf release/Android-Lernpruefung.tar.gz -C android-evidence .
          cp docs/nextgen/COVERAGE.json release/COVERAGE.json
          gh release create "$RELEASE_TAG" release/*.apk release/BUILD-PROVENANCE.json release/APK-VERIFICATION.json release/DELIVERY.json release/COVERAGE.json release/Android-Lernpruefung.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "LUMO Lernwelt $VERSION_NAME ($VERSION_CODE)" --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets > release/PUBLIC-DOWNLOAD.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-nextgen-public-download-proof
          path: release/PUBLIC-DOWNLOAD.json
          retention-days: 30
