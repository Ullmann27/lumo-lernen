name: Complete native Android runtime and Kart surface proof from exact APK
on:
  push:
    branches: [codex/lumo-android-surface-qa-2026-10-08]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumo-android-surface-qa-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
jobs:
  build-clean-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 22b221b2ebe5c85562f359e471c8ca2d44ee8354
          path: candidate-source
          persist-credentials: false
      - name: Verify preserved source checks and record the failed build attempt
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const args = {owner: context.repo.owner, repo: context.repo.repo, run_id: 37797365941};
            const run = (await github.rest.actions.getWorkflowRun(args)).data;
            if (run.head_sha !== '22b221b2ebe5c85562f359e471c8ca2d44ee8354' || run.status !== 'completed' || run.conclusion !== 'failure') throw new Error('Preserved run/source does not match');
            const jobs = (await github.rest.actions.listJobsForWorkflowRun({...args, per_page: 100})).data.jobs;
            const job = jobs.find(x => x.id === 113380203096 && x.name === 'verify-and-build');
            if (!job || job.conclusion !== 'failure') throw new Error('Preserved build job missing');
            for (let number = 1; number <= 19; number++) {
              if (!job.steps.some(x => x.number === number && x.conclusion === 'success')) throw new Error(`Preserved source/runtime check ${number} did not pass`);
            }
            if (!job.steps.some(x => x.number === 20 && x.conclusion === 'failure')) throw new Error('Original build failure must remain recorded');
            fs.mkdirSync('rebuild-proof', {recursive: true});
            fs.writeFileSync('rebuild-proof/preserved-source-checks.json', JSON.stringify({run, job, apk_source: run.head_sha, qa_workflow_source: context.sha, reason: 'Generated tracked test screenshot polluted the original working tree; build exact checked source in an isolated clean checkout.'}, null, 2));
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37797365941
          name: lumo-visual-app-evidence-37797365941
          path: preserved-proof/app/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37797365941
          name: lumo-visual-native-verification-37797365941
          path: preserved-proof/native/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37797365941
          name: lumo-visual-build-evidence-37797365941
          path: preserved-proof/failed-build/
      - name: Match preserved proof bytes to the exact clean source
        run: |
          set -euo pipefail
          test "$(cat preserved-proof/app/source-sha.txt)" = 22b221b2ebe5c85562f359e471c8ca2d44ee8354
          test "$(cat preserved-proof/native/fold-controls/source-sha.txt)" = 9f17cd2f7af652917a0c1290e506e1211a08fb3f
          test "$(cat preserved-proof/failed-build/source-sha.txt)" = 22b221b2ebe5c85562f359e471c8ca2d44ee8354
          test "$(git -C candidate-source rev-parse HEAD)" = 22b221b2ebe5c85562f359e471c8ca2d44ee8354
          test -z "$(git -C candidate-source status --porcelain --untracked-files=no)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          pin = json.loads(Path('candidate-source/config/godot-source.json').read_text())
          assert pin['revision'] == '9f17cd2f7af652917a0c1290e506e1211a08fb3f' and pin['engine'] == '4.6.3'
          assert 'version: 0.12.1+1902' in Path('candidate-source/pubspec.yaml').read_text()
          failed = Path('preserved-proof/failed-build/build.log').read_text()
          assert 'Build rejected: tracked source differs from the candidate commit.' in failed
          assert 'M\t.ci-results/onboarding-visual/age-360x800.png' in failed
          PY
          python3 -m unittest discover -s tools/android_qa/tests -p 'test_preserved_source_proof.py' -v
          python3 tools/android_qa/preserved_source_proof.py --app preserved-proof/app --native preserved-proof/native --failed-build preserved-proof/failed-build --output rebuild-proof/preserved-artifact-verification.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true
      - name: Install the matching Godot build engine
        working-directory: candidate-source
        timeout-minutes: 8
        run: |
          set -euo pipefail
          bash scripts/install_godot_for_build.sh
          godot --version | tee ../rebuild-proof/godot-version.txt
      - name: Build and verify immutable APK1902 from the clean checkout
        working-directory: candidate-source
        run: |
          set -euo pipefail
          git rev-parse HEAD > ../rebuild-proof/source-sha.txt
          bash scripts/build_unified_apk.sh 2>&1 | tee ../rebuild-proof/build.log
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk > ../rebuild-proof/verification.json
          cp ../preserved-proof/app/TEST-RESULTS.txt dist/TEST-RESULTS.txt
          printf '\nPASS 19 strict native render/gameplay/capture logs on source 9f17cd2f7af652917a0c1290e506e1211a08fb3f; original job steps1-19 success, build attempt failed and preserved.\n' >> dist/TEST-RESULTS.txt
          cp ../rebuild-proof/preserved-source-checks.json dist/PRESERVED-SOURCE-CHECKS.json
          cp ../rebuild-proof/preserved-artifact-verification.json dist/PRESERVED-ARTIFACT-VERIFICATION.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('dist/BUILD-PROVENANCE.json').read_text())
          assert proof['flutter_source_commit'] == '22b221b2ebe5c85562f359e471c8ca2d44ee8354'
          assert proof['tracked_source_clean'] is True
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lumo-visual-apk-${{ github.run_id }}
          path: candidate-source/dist/
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-clean-build-evidence-${{ github.run_id }}
          path: rebuild-proof/
          if-no-files-found: error
  android:
    needs: build-clean-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Exact APK source 22b221b; test every native game and Kart surface/recovery cycles.
        game: [build, kart, rhythm, puzzle, treasure]
        api: [35]
        include:
          - game: kart
            api: 36
    env:
      LUMO_EXPECT_SOURCE: 22b221b2ebe5c85562f359e471c8ca2d44ee8354
      LUMO_EXPECT_VERSION: '1902'
      LUMO_EXPECT_GODOT: 9f17cd2f7af652917a0c1290e506e1211a08fb3f
      LUMO_EXPECT_ANDROID_API: ${{ matrix.api }}
      LUMO_BASE_DIGEST: 82865962c7c00413c75bfc2e427a201bb957ab564d8c8eb944f2b798dfbf1511
      LUMO_FOLD_PROBE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: lumo-visual-apk-${{ github.run_id }}
          path: candidate/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37674457852
          name: lumo-visual-apk-37674457852
          path: baseline/dist/
      - name: Pin candidate and baseline before starting emulator
        run: |
          set -euo pipefail
          test -f baseline/dist/Lumo-Lernen-Neu.apk
          test -f candidate/Lumo-Lernen-Neu.apk
          test "$(python3 -c 'import json; print(json.load(open("config/godot-source.json"))["revision"])')" = "$LUMO_EXPECT_GODOT"
          echo "$LUMO_BASE_DIGEST  baseline/dist/Lumo-Lernen-Neu.apk" | sha256sum -c -
      - name: Prepare independent live UI and screenshot readers
        timeout-minutes: 8
        run: |
          mkdir -p native-proof
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ripgrep tesseract-ocr tesseract-ocr-deu xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          .probe-venv/bin/python -m pip freeze > native-proof/dependencies.txt
          python3 -m py_compile .github/probes/creative_android_probe.py
          python3 -m unittest discover -s tools/android_qa/tests -p 'test_rooted_emulator.py' -v
          .probe-venv/bin/python -m unittest discover -s tools/android_qa/tests -p 'test_native_ocr_tiles.py' -v
          cp candidate/BUILD-PROVENANCE.json candidate/APK-VERIFICATION.json native-proof/
      - name: Enable accelerated disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Start verified software display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > native-proof/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > native-proof/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          rg -i 'OpenGL renderer string:.*llvmpipe' native-proof/mesa-renderer.txt
      - name: Update exact APK and exercise actual offline native game
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            .probe-venv/bin/python .github/probes/creative_android_probe.py --baseline baseline/dist/Lumo-Lernen-Neu.apk --candidate candidate/Lumo-Lernen-Neu.apk --out native-proof --game-scope ${{ matrix.game }}
            if [ '${{ matrix.game }}' = kart ]; then .probe-venv/bin/python .github/probes/kart_complete_android_probe.py --candidate candidate/Lumo-Lernen-Neu.apk --out native-proof/full-race --timeout 1200; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-kart-stage2-android-${{ matrix.game }}-api${{ matrix.api }}-${{ github.run_id }}
          path: |
            native-proof/
            !native-proof/**/ocr-work.png
            !native-proof/*-ocr-input.png
          if-no-files-found: error
          retention-days: 14
