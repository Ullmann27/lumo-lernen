name: LUMO 2020 exact APK Android QA recovery
# Exact original signed APK from successful run; no rebuild or release.
# API 37 image is unavailable on GitHub runner: API 35 and 36 only.
on:
  push:
    branches: [chatgpt/lumo-2020-android-qa-recovery-20261113]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumo-2020-qa-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-tour:
    name: Actual Android API ${{ matrix.api }} tour
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 1f47a96116e22a4c0c1fab655d0db165c461736e
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '14062500309'
          run-id: 43470824583
          github-token: ${{ github.token }}
          merge-multiple: true
          path: candidate/
      - name: Live UI reader
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p tour
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          python3 -m py_compile .github/probes/modernization_android_tour.py
          sha256sum candidate/dist/x86_64/Lumo-Lernen-Neu.apk | tee tour/tested-apk-sha256.txt
      - name: Enable accelerated disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Software display
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > tour/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > tour/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -i 'OpenGL renderer string' tour/mesa-renderer.txt
      - name: Install and tour the exact APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: ${{ matrix.api == 35 && '14472402' || '' }}
          ram-size: ${{ matrix.api == 36 && '4096M' || '3072M' }}
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: .probe-venv/bin/python .github/probes/modernization_android_tour.py --apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk --provenance candidate/release-proof/BUILD-PROVENANCE-x86_64.json --sums candidate/release-proof/SHA256SUMS.txt --out tour
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-nextgen2020-recovery-android-${{ matrix.api }}-tour
          path: tour/
          retention-days: 30

  update-2017-to-2020:
    name: Real in-place Android 2017 to 2020 learning preservation
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 1f47a96116e22a4c0c1fab655d0db165c461736e
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '14062500309'
          run-id: 43470824583
          github-token: ${{ github.token }}
          merge-multiple: true
          path: candidate/
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13948686178'
          run-id: 43220602252
          github-token: ${{ github.token }}
          merge-multiple: true
          path: baseline/dist/
      - name: Prepare exact source and Android upgrade tools
        run: |
          set -euo pipefail
          mkdir -p upgrade-tour
          test -s baseline/dist/x86_64/Lumo-Lernen-Neu.apk
          test -s candidate/dist/x86_64/Lumo-Lernen-Neu.apk
          cp candidate/release-proof/BUILD-PROVENANCE-x86_64.json candidate/dist/x86_64/BUILD-PROVENANCE.json
          test "$(git rev-parse HEAD)" = '1f47a96116e22a4c0c1fab655d0db165c461736e'
          python3 scripts/verify_legacy_release_pin.py
          sudo apt-get -o Acquire::Retries=2 update -qq
          sudo apt-get -o Acquire::Retries=2 install -y xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0 tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          .probe-venv/bin/python -m py_compile .github/probes/lumo_2020_update_android_probe.py
          sha256sum baseline/dist/x86_64/Lumo-Lernen-Neu.apk candidate/dist/x86_64/Lumo-Lernen-Neu.apk > upgrade-tour/apk-sha256.txt
      - name: Enable isolated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Software renderer
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp +extension GLX > upgrade-tour/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > upgrade-tour/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          grep -i 'OpenGL renderer string' upgrade-tour/mesa-renderer.txt
      - name: Install existing 2017 then upgrade using the signed 2020 APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
          LUMO_CANDIDATE_SOURCE_SHA: 1f47a96116e22a4c0c1fab655d0db165c461736e
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: .probe-venv/bin/python .github/probes/lumo_2020_update_android_probe.py --baseline baseline/dist/x86_64/Lumo-Lernen-Neu.apk --candidate candidate/dist/x86_64/Lumo-Lernen-Neu.apk --out upgrade-tour
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-nextgen2020-recovery-update-proof
          path: upgrade-tour/
          retention-days: 30
