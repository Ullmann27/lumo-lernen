name: LUMO 2031 – publish immutable APK after complete fresh replay

on:
  push:
    branches: [delivery/lumo-nextgen-2031-replay-20261116]
    paths: [config/nextgen-2031-replay-publish.json]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: lumo-2031-immutable-publication
  cancel-in-progress: false

jobs:
  publish_verified_2031_replay:
    if: github.repository == 'Ullmann27/lumo-lernen' && github.ref_name == 'delivery/lumo-nextgen-2031-replay-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact original source, artifacts and complete successful replay
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/nextgen/prepare_2031_learning_replay_release.py
      - name: Publish a new immutable test release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          APK_SOURCE: ${{ steps.prepare.outputs.source }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/*.apk release/BUILD-PROVENANCE.json release/APK-VERIFICATION.json release/COVERAGE.json release/DELIVERY.json release/Android-Lernpruefung.tar.gz --repo "$GITHUB_REPOSITORY" --target "$APK_SOURCE" --prerelease --title "LUMO Lernwelt 0.13.19 (2031)" --notes-file release-notes.md
      - name: Verify exact public source, tag, metadata and anonymous APK bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/nextgen/prepare_2031_learning_replay_release.py verify-public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-nextgen-2031-publication-proof
          path: |
            publication-proof/*.json
            release/DELIVERY.json
            release-notes.md
          if-no-files-found: error
          retention-days: 30
