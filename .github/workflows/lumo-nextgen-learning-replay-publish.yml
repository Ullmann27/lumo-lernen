name: LUMO learning – publish exact APK after complete Android replay

on:
  push:
    branches: [delivery/lumo-nextgen-2027-replay-20261115]
    paths: [config/nextgen-replay-publish.json]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish_verified_replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare source-bound original APK and successful replay evidence
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/nextgen/prepare_learning_replay_release.py
      - name: Publish new immutable test release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          APK_SOURCE: ${{ steps.prepare.outputs.source }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/*.apk release/BUILD-PROVENANCE.json release/APK-VERIFICATION.json release/COVERAGE.json release/DELIVERY.json release/Android-Lernpruefung.tar.gz --repo "$GITHUB_REPOSITORY" --target "$APK_SOURCE" --prerelease --title "LUMO Lernwelt 0.13.15 (2027)" --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,assets > publication-proof/PUBLIC-DOWNLOAD.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-nextgen-replay-publication-proof
          path: |
            publication-proof/*.json
            release/DELIVERY.json
            release-notes.md
          if-no-files-found: error
          retention-days: 30
