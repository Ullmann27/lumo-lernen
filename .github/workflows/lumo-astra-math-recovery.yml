name: Lumo Astra math recovery QA

on:
  pull_request:
    paths:
      - lib/widgets/design/lumo_learning_module_frame.dart
      - lib/widgets/design/lumo_answer_crystal.dart
      - lib/widgets/design/lumo_math_stage.dart
      - lib/features/learning_modules/zahlen_bis_100/zahlen_bis_100_screen.dart
      - test/design/lumo_nextgen_math_recovery_test.dart
      - .github/workflows/lumo-astra-math-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-math:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact saved remote branch
        uses: actions/checkout@v4
      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - name: Resolve project dependencies
        run: flutter pub get
      - name: Analyze only changed math UI
        run: |
          flutter analyze --no-pub \
            lib/widgets/design/lumo_learning_module_frame.dart \
            lib/widgets/design/lumo_answer_crystal.dart \
            lib/widgets/design/lumo_math_stage.dart \
            lib/features/learning_modules/zahlen_bis_100/zahlen_bis_100_screen.dart \
            test/design/lumo_nextgen_math_recovery_test.dart
      - name: Test real math scene on phone and Fold
        run: |
          flutter test --no-pub --reporter expanded \
            test/design/lumo_nextgen_math_recovery_test.dart
      - name: Verify previously failing actual screen capture
        env:
          LUMO_LEARNING_CAPTURE_DIR: ${{ github.workspace }}/evidence
        run: |
          mkdir -p evidence
          flutter test --no-pub --reporter expanded \
            test/design/learning_adventure_capture_test.dart \
            --plain-name 'Real module capture zahlen-bis-100 phone-360x800'
          test -s evidence/zahlen-bis-100-phone-360x800.png
      - name: Preserve visual evidence without posting Chat screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-nextgen-math-recovery-evidence
          path: evidence/
          retention-days: 14
