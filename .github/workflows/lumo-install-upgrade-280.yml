name: Lumo 280 to 1400 update recheck
on:
  push:
    branches: [chatgpt/install-upgrade-2026-10-07]
    paths:
      - .github/workflows/lumo-install-upgrade-280.yml
      - scripts/probes/install_upgrade_280_20261007.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumo-update-280-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update280:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch exact verified 1400 APK
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37576067479
          name: lumo-install-candidate-37576067479
          path: candidate/
      - name: Fetch original build 280
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37566239982
          name: lumo-pr207-apk-37566239982
          path: previous/280/
      - name: Prepare isolated test-only adapter
        run: |
          mkdir -p upgrade280-evidence
          python3 -m py_compile scripts/probes/install_upgrade_280_20261007.py scripts/probes/install_upgrade_1321_20261007.py
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0
          .probe-venv/bin/python -m pip freeze > upgrade280-evidence/probe-dependencies.txt
          cp candidate/dist/BUILD-PROVENANCE.json upgrade280-evidence/new-provenance.json
          cp previous/280/BUILD-PROVENANCE.json upgrade280-evidence/old-provenance.json
      - name: Enable disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preserve original profile through actual update and reinstall
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: .probe-venv/bin/python scripts/probes/install_upgrade_280_20261007.py
      - name: Preserve actual update proof on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-install-from280-recheck-${{ github.run_id }}
          path: upgrade280-evidence/
          if-no-files-found: error
          retention-days: 14
