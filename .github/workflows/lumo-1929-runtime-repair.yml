name: Lumo 1929 runtime-only update and offline voice verification
on:
  push:
    branches: [computer/lumo-android-1929-runtime-repair-2026-10-11]
    paths: [.github/workflows/lumo-1929-runtime-repair.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: lumo-1929-runtime-repair-${{ github.ref }}
  cancel-in-progress: false
env:
  LUMO_EXPECT_SOURCE: e4756bbcb6890d5054b5eb14ac4ef3ecd2cafa94
  LUMO_EXPECT_APK_SHA: 5b5ec52f50c5491140d21051b559333b5dadc3fc4f47e31c9df25c339ae22e86
  LUMO_EXPECT_VERSION: '1929'
  LUMO_EXPECT_ANDROID_API: '36'
  LUMO_EXPECT_GODOT: '6063f56fd4ff13afef61509f52d1d4fdab012654'

jobs:
  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 12
      - name: Require the same successful build and unchanged application
        uses: actions/github-script@v7
        with:
          script: |
            const params = {owner: context.repo.owner, repo: context.repo.repo, run_id: 38132054824};
            const run = (await github.rest.actions.getWorkflowRun(params)).data;
            if (run.head_sha !== process.env.LUMO_EXPECT_SOURCE ||
                run.head_branch !== 'computer/lumo-education-excellence-2026-10-11' ||
                run.path !== '.github/workflows/lumo-free-voice-1929.yml') {
              throw new Error('Unexpected source build');
            }
            const jobs = (await github.rest.actions.listJobsForWorkflowRun({...params, per_page: 100})).data.jobs;
            if (!jobs.some(j => j.name === 'verify-build' && j.conclusion === 'success' &&
                                j.status === 'completed')) {
              throw new Error('The actual build/signature/package checks did not succeed');
            }
            const {execFileSync} = require('child_process');
            const changed = execFileSync('git', ['diff', '--name-only',
              process.env.LUMO_EXPECT_SOURCE, context.sha, '--'], {encoding: 'utf8'})
              .trim().split('\n').filter(Boolean);
            const allowed = new Set([
              '.github/probes/lumo_speech_android_probe.py',
              '.github/probes/lumo_free_voice_android_probe.py',
              '.github/probes/creative_android_probe.py',
              '.github/workflows/lumo-1929-runtime-repair.yml',
              'scripts/tests/test_android_parent_navigation.py',
              'scripts/tests/test_android_voice_scroll.py',
              'docs/education/2026-10-11-free-voice/ANDROID-1929-RUNTIME.md'
            ]);
            if (changed.some(path => !allowed.has(path))) {
              throw new Error('Application inputs changed; this runtime-only verification is invalid');
            }
            const fs = require('fs');
            fs.mkdirSync('android-proof', {recursive: true});
            fs.writeFileSync('android-proof/EXISTING-APK-SOURCE.json', JSON.stringify({
              build_run: run.id, build_url: run.html_url, build_source: run.head_sha,
              qa_source: context.sha, changed_files: changed,
              application_inputs_unchanged: true, rebuilt: false, published: false
            }, null, 2));
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38132054824
          artifact-ids: 11699692796
          merge-multiple: true
          path: candidate/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38097768063
          artifact-ids: 11686249017
          merge-multiple: true
          path: baseline/
      - name: Confirm artifact digests and prepare independent live readers
        run: |
          set -euo pipefail
          printf '%s  candidate/Lumo-Lernen-Neu.apk\n' "$LUMO_EXPECT_APK_SHA" | sha256sum -c -
          echo 'ce4a72cb2831067401799c7e15f0649057f487b89fb40a54c23db5f52b8d4dd7  baseline/Lumo-Lernen-Neu.apk' | sha256sum -c -
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
            ripgrep tesseract-ocr tesseract-ocr-deu xvfb mesa-utils libegl1 libgl1-mesa-dri libglx-mesa0 libpulse0
          python3 -m venv .probe-venv
          .probe-venv/bin/python -m pip install --disable-pip-version-check uiautomator2==3.7.0 Pillow==12.3.0
          .probe-venv/bin/python -m pip freeze > android-proof/dependencies.txt
          python3 -m py_compile .github/probes/lumo_free_voice_android_probe.py .github/probes/lumo_speech_android_probe.py
          python3 -m unittest discover -s scripts/tests -p test_android_parent_navigation.py -v 2>&1 | tee android-proof/parent-navigation-unit-tests.log
          python3 -m unittest discover -s scripts/tests -p test_android_voice_scroll.py -v 2>&1 | tee android-proof/voice-scroll-unit-tests.log
      - name: Enable disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
      - name: Start verified software renderer
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 2500x2200x24 -nolisten tcp +extension GLX > android-proof/xvfb.log 2>&1 &
          for attempt in $(seq 1 20); do
            if glxinfo -B > android-proof/mesa-renderer.txt 2>&1; then break; fi
            sleep 0.25
          done
          rg -i 'OpenGL renderer string:.*llvmpipe' android-proof/mesa-renderer.txt
      - name: Prepare existing Android 16 image
        timeout-minutes: 11
        run: python3 tools/android_qa/prepare_system_image.py --api 36 --out android-proof/system-image --timeout 600
      - name: Reach actual long parent view and verify offline playback without rebuilding
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
          LP_NUM_THREADS: '2'
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-build: '14472402'
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -accel on -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: .probe-venv/bin/python .github/probes/lumo_free_voice_android_probe.py --baseline baseline/Lumo-Lernen-Neu.apk --candidate candidate/Lumo-Lernen-Neu.apk --out android-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-1929-runtime-repair-${{ github.run_id }}
          path: android-proof/
          if-no-files-found: error
          retention-days: 30
