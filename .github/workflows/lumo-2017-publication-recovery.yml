name: Lumo 2017 publication-only recovery
on:
  push:
    branches: [chatgpt/lumo-2017-publication-recovery-20261112]
    paths: ['.github/workflows/lumo-2017-publication-recovery.yml']
permissions:
  contents: read
concurrency:
  group: lumo-2017-publication-recovery
  cancel-in-progress: false
jobs:
  publish-reviewed-2017:
    name: Publish unchanged accepted 2017 ARM64 APK
    if: github.repository == 'Ullmann27/lumo-lernen' && github.ref == 'refs/heads/chatgpt/lumo-2017-publication-recovery-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 47889f74a651b073965def70743417cf320b1eb9
      - name: Verify completed acceptance jobs and immutable source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p recovery
          gh api 'repos/Ullmann27/lumo-lernen/actions/runs/43220602252' > recovery/SOURCE-RUN.json
          gh api 'repos/Ullmann27/lumo-lernen/actions/runs/43220602252/jobs?filter=all&per_page=100' > recovery/SOURCE-JOBS.json
          gh api 'repos/Ullmann27/lumo-lernen/actions/runs/43220602252/artifacts?per_page=100' > recovery/SOURCE-ARTIFACTS.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = '47889f74a651b073965def70743417cf320b1eb9'
          run_id = 43220602252
          root = Path('recovery')
          run = json.loads((root / 'SOURCE-RUN.json').read_text())
          assert run['id'] == run_id and run['head_sha'] == source
          assert run['repository']['full_name'] == run['head_repository']['full_name'] == 'Ullmann27/lumo-lernen'
          assert run['event'] == 'pull_request' and run['head_branch'] == 'chatgpt/lumo-spielewelt-stage-20261112'
          assert run['path'] == '.github/workflows/lumo-unified-integration-2026.yml'
          assert run['workflow_id'] == 385610539 and run['run_attempt'] == 1
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          payload = json.loads((root / 'SOURCE-JOBS.json').read_text())
          jobs = payload['jobs']
          assert payload['total_count'] == len(jobs), 'Unexamined job page'
          required = {
              131192088702: 'verify-and-build',
              131213601865: 'android-tour',
              131220724878: 'update-2017-from-2015',
          }
          for job_id, name in required.items():
              matches = [job for job in jobs if job['id'] == job_id]
              assert len(matches) == 1, ('Missing acceptance job', job_id)
              job = matches[0]
              assert job['run_id'] == run_id and job['name'] == name
              assert job['status'] == 'completed' and job['conclusion'] == 'success', name
          failed = [job for job in jobs if job['conclusion'] == 'failure']
          assert len(failed) == 1 and failed[0]['id'] == 131228165197
          failures = [step for step in failed[0]['steps'] if step['conclusion'] == 'failure']
          assert len(failures) == 1 and failures[0]['name'] == 'Run android-actions/setup-android@v3'
          assert all(job['status'] == 'completed' for job in jobs)
          assert all(job['conclusion'] in ('success', 'skipped', 'failure') for job in jobs)
          payload = json.loads((root / 'SOURCE-ARTIFACTS.json').read_text())
          artifacts = payload['artifacts']
          assert payload['total_count'] == len(artifacts), 'Unexamined artifact page'
          expected = {
              13948157733: ('lumo-unified-arm64-verified', 318763874, '65ed0b01829b3672c4efaaa06cbda85f23817fd8e694eaf787ff0eb1a9925ed8'),
              13949562047: ('lumo-unified-android-tour', 73739822, '8e431a810812b785aea07e4d8f0370b8270d9c77bd15513628d44daf1a24c224'),
              13950971053: ('lumo-2017-in-place-update-proof', 97483052, 'c1793049a0fbac0dda68d8353a303fb46b75f3919c0abbb6afd9104b679c7288'),
          }
          for artifact_id, (name, size, digest) in expected.items():
              matches = [item for item in artifacts if item['name'] == name]
              assert len(matches) == 1, ('Ambiguous artifact', name)
              item = matches[0]
              assert item['id'] == artifact_id and item['expired'] is False
              assert item['size_in_bytes'] == size and item['digest'] == 'sha256:' + digest
              assert item['workflow_run']['id'] == run_id and item['workflow_run']['head_sha'] == source
              assert item['workflow_run']['repository_id'] == item['workflow_run']['head_repository_id'] == 1222433959
          (root / 'ACCEPTANCE-GATES.json').write_text(json.dumps({
              'status': 'PASS', 'sourceCommit': source, 'sourceRun': run_id,
              'requiredJobs': required, 'artifacts': expected,
              'recoveryScope': 'Publication-only SDK setup repair; existing APK and acceptance results unchanged',
          }, indent=2) + '\n')
          print('All three exact acceptance jobs and source artifacts verified')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install APK signature and manifest verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13948157733'
          merge-multiple: true
          run-id: 43220602252
          github-token: ${{ github.token }}
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13949562047'
          merge-multiple: true
          run-id: 43220602252
          github-token: ${{ github.token }}
          path: proofs/tour/
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13950971053'
          merge-multiple: true
          run-id: 43220602252
          github-token: ${{ github.token }}
          path: proofs/update/
      - name: Reverify actual ARM64 bytes and bind all successful proofs to build 2017
        env:
          SOURCE_SHA: 47889f74a651b073965def70743417cf320b1eb9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/verify_legacy_release_pin.py
          sha256sum -c dist/APK-SHA256.txt
          python3 scripts/verify_unified_apk.py dist/Lumo-Lernen-Neu.apk --abi arm64-v8a > dist/PUBLISH-VERIFICATION.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from verify_legacy_release_pin import verify

          source = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'Missing immutable Flutter source'
          build, native = verify(Path('pubspec.yaml').read_text(), Path('config/godot-source.json').read_text())
          assert build == 2017, 'Only the reviewed 2017 source may be published here'
          assert Path('dist/APP-VERSION.txt').read_text().strip() == 'version: 0.13.5+2017'
          apk = Path('dist/Lumo-Lernen-Neu.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert digest == 'bf3b884ec672831bd5b0470ef8bee0a1221058255a8338160cd375e1706f26a1'
          assert apk.stat().st_size == 318753461
          proof = json.loads(Path('dist/BUILD-PROVENANCE.json').read_text())
          verification = json.loads(Path('dist/APK-VERIFICATION.json').read_text())
          measured = json.loads(Path('dist/PUBLISH-VERIFICATION.json').read_text())
          pin = json.loads(Path('dist/GODOT-SOURCE.json').read_text())
          assert pin == json.loads(Path('config/godot-source.json').read_text()), 'Packaged source pin differs'
          assert proof['flutter_source_commit'] == source, 'Wrong Flutter candidate commit'
          assert proof['tracked_source_clean'] is True, 'Uncommitted source changes'
          package = 'dev.ullmann.lumo.lumo_lernen.coachpreview'
          certificate = 'a6b1ef61bf59db4e0794c742aeb3b5506d130f4d21175c9975140e6acdb80702'
          for info in (proof, verification, measured):
              assert info['versionCode'] == 2017 and info['versionName'] == '0.13.5', 'Wrong Android version'
              assert info['package'] == package, 'Wrong application ID'
              assert info['signingCertificateSha256'] == certificate, 'Wrong installed-family test certificate'
              assert info['abis'] == ['arm64-v8a'], 'Delivery must be the actual ARM64 APK'
              assert info['sha256'] == digest and info['bytes'] == apk.stat().st_size, 'APK bytes differ from proof'
              assert info['godot']['revision'] == native, 'Wrong embedded Godot source'
          update = json.loads(Path('proofs/update/update-result.json').read_text())
          tour = json.loads(Path('proofs/tour/tour-result.json').read_text())
          assert update['status'] == 'PASS' and tour['status'] == 'PASS', 'Live Android acceptance did not pass'
          assert update['candidate_source'] == source, 'Upgrade proof belongs to another commit'
          assert update['baseline']['versionCode'] == 2015, 'Wrong upgrade baseline version'
          assert update['baseline']['flutter_source_commit'] == '2718f405e69c193d0121c6f6447fe53769d7c803'
          assert update['baseline']['godot']['revision'] == 'b357b2f8decb4b11b0cc45e9fde2b8df5ec9cbe1'
          candidate = update['candidate']
          assert candidate['flutter_source_commit'] == source and candidate['tracked_source_clean'] is True
          assert candidate['versionCode'] == 2017 and candidate['versionName'] == '0.13.5'
          assert candidate['package'] == package and candidate['signingCertificateSha256'] == certificate
          assert candidate['abis'] == ['x86_64'] and candidate['godot']['revision'] == native
          identities = [step for step in tour['steps'] if step.get('step') == 'apk-identity']
          assert len(identities) == 1 and identities[0]['ok'] is True, 'Missing actual tour APK identity'
          identity = identities[0]
          assert identity['flutter_source_commit'] == source and identity['godot_revision'] == native
          assert identity['versionCode'] == 2017 and identity['versionName'] == '0.13.5'
          assert identity['signingCertificateSha256'] == certificate
          assert identity['apk_sha256'] == tour['apk_sha256'] == candidate['sha256'], 'Tour and update tested different APKs'
          assert proof['godot']['pck_sha256'] == candidate['godot']['pck_sha256'] == identity['godot_pck_sha256']
          assert update['offline'] is True and update['fatal_crashes'] == 0 and tour['fatal_crashes'] == 0
          launches = [step for step in tour['steps'] if step.get('step') == 'start-kart-race']
          assert len(launches) == 1 and launches[0]['ok'] is True
          navigation = launches[0]['spatial_menu_navigation']
          assert navigation['status'] == 'PASS' and navigation['selected_mode'] == 'cup'
          assert [section['section'] for section in navigation['sections']] == ['garage', 'driver']
          facts = {
              'package': package, 'versionName': '0.13.5', 'versionCode': 2017,
              'flutterSourceCommit': source, 'godotSourceCommit': native,
              'signingCertificateSha256': certificate, 'apkSha256': digest,
              'apkBytes': apk.stat().st_size, 'androidTourApkSha256': candidate['sha256'],
              'signingScope': 'Public Lumo test key; not Google Play signing',
              'deviceScope': 'x86_64 emulator acceptance; physical Fold7/FPS not measured',
          }
          facts['acceptanceWorkflowRunId'] = 43220602252
          facts['acceptanceWorkflowUrl'] = 'https://github.com/Ullmann27/lumo-lernen/actions/runs/43220602252'
          facts['publicationRecoveryWorkflowCommit'] = os.environ['GITHUB_SHA']
          facts['publicationRecoveryWorkflowUrl'] = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          facts['publicationRecoveryScope'] = 'SDK setup repair only; publishes existing accepted APK from source47889f'
          Path('dist/RELEASE-FACTS.json').write_text(json.dumps(facts, indent=2) + '\n')
          Path('dist/Lumo-Lernen-Neu.apk.sha256').write_text(f'{digest}  Lumo-Lernen-Neu.apk\n')
          print(json.dumps(facts, indent=2))
          PY
      - name: Preserve existing releases and select create-or-verify
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: 47889f74a651b073965def70743417cf320b1eb9
        run: |
          set -euo pipefail
          gh api --paginate --slurp 'repos/Ullmann27/lumo-lernen/releases?per_page=100' > dist/RELEASE-PAGES.json
          gh api 'repos/Ullmann27/lumo-lernen/git/matching-refs/tags/coachpreview-build-2017' > dist/EXISTING-TAGS.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          pages = json.loads(Path('dist/RELEASE-PAGES.json').read_text())
          assert isinstance(pages, list) and all(isinstance(page, list) for page in pages)
          releases = [release for page in pages for release in page]
          existing = [release for release in releases if release['tag_name'] == 'coachpreview-build-2017']
          refs = json.loads(Path('dist/EXISTING-TAGS.json').read_text())
          assert isinstance(refs, list)
          exact_refs = [ref for ref in refs if ref['ref'] == 'refs/tags/coachpreview-build-2017']
          mode = 'create'
          if existing or exact_refs:
              assert len(existing) == 1 and len(exact_refs) == 1, 'Incomplete or conflicting immutable version already exists'
              release, ref = existing[0], exact_refs[0]
              assert release['draft'] is False and release['prerelease'] is True
              assert ref['object']['type'] == 'commit' and ref['object']['sha'] == os.environ['SOURCE_SHA'], 'Existing tag belongs to another source'
              assets = [asset for asset in release['assets'] if asset['name'] == 'Lumo-Lernen-Neu.apk']
              assert len(assets) == 1 and assets[0]['state'] == 'uploaded', 'Existing release has no completed APK'
              mode = 'verify-existing'
          Path('dist/RELEASES.json').write_text(json.dumps(releases))
          Path('dist/RELEASE-STATE.json').write_text(json.dumps({'mode': mode}) + '\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'mode={mode}\n')
          PY
          if [ "$(python3 -c 'import json; print(json.load(open("dist/RELEASE-STATE.json"))["mode"])')" = create ]; then
            python3 scripts/release_pipeline_gates.py --pubspec pubspec.yaml --verification dist/PUBLISH-VERIFICATION.json --apk dist/Lumo-Lernen-Neu.apk --releases-json dist/RELEASES.json
          else
            echo 'Existing release is preserved. Only public byte/source verification will run.'
          fi
      - name: Publish the tested file once under the installed family update channel
        if: steps.release-state.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: 47889f74a651b073965def70743417cf320b1eb9
          RUN_URL: https://github.com/Ullmann27/lumo-lernen/actions/runs/43220602252
        run: |
          set -euo pipefail
          {
            echo 'Lumo Lernen + Lumo Kart 0.13.5 (Build 2017), ARM64 test APK.'
            echo
            cat dist/RELEASE-FACTS.json
            echo
            echo "Acceptance workflow: $RUN_URL"
            echo "Publication recovery: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'Full Flutter/native gates, the actual Android tour, and the in-place 2015→2017 learning-preservation upgrade passed before publication.'
            echo 'Publication-only recovery fixes an unavailable legacy SDK tools package. The tested APK and its source commit are unchanged.'
            echo 'Install as an update without uninstalling the existing family app.'
            echo 'Signed with the unchanged public Lumo TEST key. This is not Google Play signing.'
            echo 'Physical Samsung/Fold7 performance and 60 FPS have not been measured.'
            echo 'Older APKs, releases and the production main branch remain unchanged.'
          } > dist/RELEASE-NOTES.txt
          gh release create coachpreview-build-2017 \
            dist/Lumo-Lernen-Neu.apk \
            dist/Lumo-Lernen-Neu.apk.sha256 \
            dist/BUILD-PROVENANCE.json \
            dist/GODOT-SOURCE.json \
            dist/PUBLISH-VERIFICATION.json \
            dist/RELEASE-FACTS.json \
            --repo Ullmann27/lumo-lernen \
            --target "$SOURCE_SHA" \
            --title 'Lumo 0.13.5 (2017) Android ARM64 Test-APK' \
            --notes-file dist/RELEASE-NOTES.txt \
            --prerelease --latest=false
      - name: Verify the published release, immutable tag and unauthenticated Chrome APK bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: 47889f74a651b073965def70743417cf320b1eb9
        run: |
          set -euo pipefail
          gh api repos/Ullmann27/lumo-lernen/releases/tags/coachpreview-build-2017 > dist/PUBLISHED-RELEASE.json
          gh api repos/Ullmann27/lumo-lernen/git/ref/tags/coachpreview-build-2017 > dist/PUBLISHED-TAG.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads(Path('dist/PUBLISHED-RELEASE.json').read_text())
          tag = json.loads(Path('dist/PUBLISHED-TAG.json').read_text())
          facts = json.loads(Path('dist/RELEASE-FACTS.json').read_text())
          assert release['draft'] is False and release['prerelease'] is True
          assert release['tag_name'] == 'coachpreview-build-2017'
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == os.environ['SOURCE_SHA']
          assets = [asset for asset in release['assets'] if asset['name'] == 'Lumo-Lernen-Neu.apk']
          assert len(assets) == 1 and assets[0]['state'] == 'uploaded'
          assert assets[0]['size'] == facts['apkBytes'] > 0
          url = 'https://github.com/Ullmann27/lumo-lernen/releases/download/coachpreview-build-2017/Lumo-Lernen-Neu.apk'
          assert assets[0]['browser_download_url'] == url
          Path('dist/DIRECT-APK-URL.txt').write_text(url + '\n')
          PY
          curl --fail --location --retry 3 --max-time 600 \
            "$(cat dist/DIRECT-APK-URL.txt)" --output "$RUNNER_TEMP/lumo-public-2017.apk"
          python3 - "$RUNNER_TEMP/lumo-public-2017.apk" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          apk = Path(sys.argv[1])
          facts = json.loads(Path('dist/RELEASE-FACTS.json').read_text())
          assert apk.stat().st_size == facts['apkBytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == facts['apkSha256'], 'Public download bytes differ'
          public_url = Path('dist/DIRECT-APK-URL.txt').read_text().strip()
          Path('dist/PUBLIC-DOWNLOAD-VERIFIED.json').write_text(json.dumps({
              'status': 'PASS', 'authentication': 'none; curl without Authorization headers',
              'url': public_url, 'bytes': apk.stat().st_size,
              'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'sourceCommit': facts['flutterSourceCommit'],
          }, indent=2) + '\n')
          print('Verified public Chrome APK:', public_url)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumo-2017-public-delivery-receipt
          path: |
            dist/RELEASE-FACTS.json
            dist/PUBLISH-VERIFICATION.json
            dist/PUBLISHED-RELEASE.json
            dist/PUBLISHED-TAG.json
            dist/DIRECT-APK-URL.txt
            dist/PUBLIC-DOWNLOAD-VERIFIED.json
            recovery/*.json
          if-no-files-found: warn
          retention-days: 90
