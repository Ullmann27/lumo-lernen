name: Publish verified LUMO 2020 agent test APK

on:
  push:
    branches:
      - delivery/lumo-agent-2020-20261114
    paths:
      - .github/workflows/lumo-agent-2020-publish.yml

permissions:
  contents: read

concurrency:
  group: lumo-2020-new-release-only
  cancel-in-progress: false

jobs:
  publish-verified-test-apk:
    if: github.repository == 'Ullmann27/lumo-lernen' && github.ref == 'refs/heads/delivery/lumo-agent-2020-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_SHA: 26a127bb897c9dd0832512d2ae3b80a6495f7f7e
      ACCEPTANCE_RUN: '43580690846'
      ACCEPTANCE_PR: '493'
      VERSION_TAG: coachpreview-build-2020
    steps:
      - name: Check out the exact accepted source and its original verifier
        uses: actions/checkout@v4
        with:
          ref: 26a127bb897c9dd0832512d2ae3b80a6495f7f7e
          persist-credentials: false

      - name: Read the complete current acceptance and download its original bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p publication/metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN" > publication/metadata/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN/jobs?per_page=100" > publication/metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN/artifacts?per_page=100" > publication/metadata/artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ACCEPTANCE_PR" > publication/metadata/pull.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          metadata = Path('publication/metadata')
          run = json.loads((metadata/'run.json').read_text())
          assert run['id'] == int(os.environ['ACCEPTANCE_RUN'])
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['head_branch'] == 'integration/lumo-agent-execution-20261114'
          assert run['event'] == 'pull_request'
          assert run['path'] == '.github/workflows/lumo-connect-four-2020.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          catalog = json.loads((metadata/'artifacts.json').read_text())
          assert catalog['total_count'] == len(catalog['artifacts'])
          matches = [a for a in catalog['artifacts'] if a['name'] == 'lumo-connect-four-2020-delivery-bundle']
          assert len(matches) == 1
          artifact = matches[0]
          assert artifact['expired'] is False
          assert artifact['workflow_run']['id'] == run['id']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_SHA']
          assert type(artifact['id']) is int and artifact['id'] > 0
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', artifact['digest'])
          (metadata/'bundle.json').write_text(json.dumps(artifact, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('BUNDLE_ARTIFACT_ID=' + str(artifact['id']) + '\n')
          PY
          bundle_id="$(python3 -c 'import json; print(json.load(open("publication/metadata/bundle.json"))["id"])')"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$bundle_id/zip" > publication/original-bundle.zip

      - name: Verify and safely unpack every original delivery byte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, stat, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path('publication/original-bundle.zip')
          artifact = json.loads(Path('publication/metadata/bundle.json').read_text())
          assert archive.stat().st_size == artifact['size_in_bytes']
          with archive.open('rb') as handle:
              assert 'sha256:' + hashlib.file_digest(handle, 'sha256').hexdigest() == artifact['digest']
          root = Path('publication/delivery')
          root.mkdir()
          with zipfile.ZipFile(archive) as zipped:
              seen = set()
              for member in zipped.infolist():
                  path = PurePosixPath(member.filename)
                  name = path.as_posix()
                  assert not member.flag_bits & 1
                  assert path.parts and not path.is_absolute() and '..' not in path.parts
                  assert '\\' not in member.filename and name == member.filename.rstrip('/')
                  assert name not in seen
                  seen.add(name)
                  kind = stat.S_IFMT(member.external_attr >> 16)
                  assert kind in ((0, stat.S_IFDIR) if member.is_dir() else (0, stat.S_IFREG))
              zipped.extractall(root)
          PY
          python3 scripts/verify_connect_four_delivery.py check-current \
            --delivery publication/delivery --metadata publication/metadata \
            --pull-request "$ACCEPTANCE_PR" --bundle-archive publication/original-bundle.zip \
            --bundle-artifact-id "$BUNDLE_ARTIFACT_ID"

      - name: Require a genuinely new version before creating its tag and draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > publication/metadata/releases.json
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION_TAG" > publication/metadata/tags.json
          python3 scripts/verify_connect_four_delivery.py check-vacant \
            --delivery publication/delivery --metadata publication/metadata
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --input publication/delivery/audit/create-tag.json > publication/created-tag.json
          python3 scripts/verify_connect_four_delivery.py check-tag \
            --delivery publication/delivery --tag publication/created-tag.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            --input publication/delivery/audit/create-release.json > publication/created-release.json
          release_id="$(python3 -c 'import json; print(json.load(open("publication/created-release.json"))["id"])')"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > publication/empty-draft.json
          python3 scripts/verify_connect_four_delivery.py check-release \
            --delivery publication/delivery --tag publication/created-tag.json \
            --created publication/created-release.json --release publication/empty-draft.json --stage empty-draft

      - name: Upload the exact verified original assets without replacing files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            test -n "$name"
            gh release upload "$VERSION_TAG" "publication/delivery/assets/$name" --repo "$GITHUB_REPOSITORY"
          done < publication/delivery/audit/asset-names.txt
          release_id="$(python3 -c 'import json; print(json.load(open("publication/created-release.json"))["id"])')"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION_TAG" > publication/current-tag.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > publication/uploaded-draft.json
          python3 scripts/verify_connect_four_delivery.py check-release \
            --delivery publication/delivery --tag publication/current-tag.json \
            --created publication/created-release.json --release publication/uploaded-draft.json --stage uploaded-draft

      - name: Recheck current acceptance and publish only the checked new draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN" > publication/metadata/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN/jobs?per_page=100" > publication/metadata/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN/artifacts?per_page=100" > publication/metadata/artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$ACCEPTANCE_PR" > publication/metadata/pull.json
          python3 scripts/verify_connect_four_delivery.py check-current \
            --delivery publication/delivery --metadata publication/metadata \
            --pull-request "$ACCEPTANCE_PR" --bundle-archive publication/original-bundle.zip \
            --bundle-artifact-id "$BUNDLE_ARTIFACT_ID"
          release_id="$(python3 -c 'import json; print(json.load(open("publication/created-release.json"))["id"])')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --input publication/delivery/audit/publish-release.json > publication/published-release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION_TAG" > publication/published-tag.json
          python3 scripts/verify_connect_four_delivery.py check-release \
            --delivery publication/delivery --tag publication/published-tag.json \
            --created publication/created-release.json --release publication/published-release.json --stage published

      - name: Download the public APK without authentication and verify its exact bytes
        shell: bash
        run: |
          set -euo pipefail
          url="$(python3 -c 'import json; print(json.load(open("publication/delivery/publication-plan.json"))["download_url"])')"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 --max-time 300 \
            "$url" -o publication/public-Lumo-Lernen-Neu.apk
          python3 scripts/verify_connect_four_delivery.py verify-public \
            --delivery publication/delivery --tag publication/published-tag.json \
            --created publication/created-release.json --release publication/published-release.json \
            --apk publication/public-Lumo-Lernen-Neu.apk --receipt publication/PUBLIC-APK-RECEIPT.json
          cat publication/PUBLIC-APK-RECEIPT.json

      - name: Preserve original publication receipts and any exact failure state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumo-2020-agent-publication-receipt
          path: |
            publication/metadata/
            publication/*.json
          if-no-files-found: error
          retention-days: 90
